name: Aggregate dashboard data

on:
  # Trigger after fetch workflow completes
  workflow_run:
    workflows: ["Fetch DHIS2 Vaccination Data"]
    types: [completed]

  # Manual trigger
  workflow_dispatch:

  # Also trigger on data changes
  push:
    branches: [main]
    paths:
      - "docs/data/monthly/**"
      - "docs/data/ou_map.json"
      - "docs/config/rename_map.json"
      - "scripts/aggregate_dashboard.py"

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded (or if manual/push trigger)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnostic — verify source files
        run: |
          echo "=== ou_map.json ==="
          if [ -f docs/data/ou_map.json ]; then
            echo "EXISTS — $(wc -c < docs/data/ou_map.json) bytes"
            echo "First 200 chars:"
            head -c 200 docs/data/ou_map.json
            echo ""
          else
            echo "MISSING!"
          fi

          echo ""
          echo "=== rename_map.json ==="
          if [ -f docs/config/rename_map.json ]; then
            echo "EXISTS — $(wc -c < docs/config/rename_map.json) bytes"
          else
            echo "MISSING!"
          fi

          echo ""
          echo "=== antenne_rules.json ==="
          if [ -f docs/data/antenne_rules.json ]; then
            echo "EXISTS — $(wc -c < docs/data/antenne_rules.json) bytes"
          else
            echo "Not found (optional)"
          fi

          echo ""
          echo "=== Monthly NDJSON files ==="
          if [ -d docs/data/monthly ]; then
            find docs/data/monthly -name "*.ndjson" -not -name "*.gz" | head -20
            echo "Total .ndjson files: $(find docs/data/monthly -name '*.ndjson' -not -name '*.gz' | wc -l)"
            echo "Total .ndjson.gz files: $(find docs/data/monthly -name '*.ndjson.gz' | wc -l)"
            
            # Show first line of first file
            FIRST=$(find docs/data/monthly -name "*.ndjson" -not -name "*.gz" | sort | head -1)
            if [ -n "$FIRST" ]; then
              echo ""
              echo "First line of $FIRST:"
              head -1 "$FIRST"
            fi
          else
            echo "docs/data/monthly/ NOT FOUND"
          fi

          echo ""
          echo "=== index.json ==="
          if [ -f docs/data/index.json ]; then
            echo "EXISTS — $(wc -c < docs/data/index.json) bytes"
          else
            echo "MISSING"
          fi

      - name: Run aggregation
        run: python scripts/aggregate_dashboard.py

      - name: Validate output JSON
        run: |
          echo "=== Dashboard output files ==="
          if [ -d docs/data/dashboard ]; then
            for f in docs/data/dashboard/*.json; do
              if [ -f "$f" ]; then
                SIZE=$(wc -c < "$f")
                # Check if valid JSON
                if python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
                  echo "✅ $(basename $f): ${SIZE} bytes — valid JSON"
                else
                  echo "❌ $(basename $f): ${SIZE} bytes — INVALID JSON!"
                  echo "   First 100 chars: $(head -c 100 "$f")"
                  exit 1
                fi
              fi
            done
          else
            echo "❌ docs/data/dashboard/ directory not found!"
            exit 1
          fi

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dashboard aggregated data [skip ci]"
            git push
          fi
