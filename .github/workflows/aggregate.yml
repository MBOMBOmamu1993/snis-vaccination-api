name: Aggregate ALL data for dashboard

on:
  workflow_run:
    workflows: 
      - "Backfill DHIS2 (FOSA / AS / ZS)"
      - "Sync DHIS2 -> GitHub (FOSA / AS / ZS)"
      - "Update DHIS2 vaccination data"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# 🔒 Sérialise les agrégations : une nouvelle attend la fin de la précédente au
# lieu de la TUER en cours de route. cancel-in-progress:true provoquait des
# annulations en boucle (chaque backfill FOSA/AS/ZS déclenche une agrégation, qui
# tuait la précédente à ~11 min avant qu'elle ait pu finir ~15-20 min et publier)
# → le dashboard ne se mettait jamais à jour. En file d'attente, chaque agrégation
# va à son terme.
concurrency:
  group: dashboard-aggregation
  cancel-in-progress: false

jobs:
  aggregate-all:
    # Se lance après toute synchronisation terminée (success OU failure) ou en
    # manuel. Un run de synchro peut finir « failure » à cause de la sonde de
    # santé ALORS QUE les données validées sont déjà commitées : l'agrégation
    # (idempotente, elle ne lit que les fichiers commités) doit quand même
    # rafraîchir le dashboard.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    
    # J'ai augmenté à 40 minutes car il y a maintenant 3 scripts à faire tourner l'un après l'autre
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate ALL aggregated dashboard data (FOSA, AS, ZS)
        run: python scripts/aggregate_all.py

      # --- 4. Sauvegarde Globale ---
      - name: Commit all aggregated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # On ajoute tous les dossiers de données générés (FOSA, AS, ZS)
          git add docs/data/dashboard/ docs/data_as/dashboard/ docs/data_zs/dashboard/ docs/.nojekyll
          
          # On vérifie s'il y a des changements avant de pousser
          if ! git diff --staged --quiet; then
            git commit -m "auto: refresh ALL dashboard aggregates (FOSA, AS, ZS) with population"
            chmod +x scripts/safe_push.sh
            ./scripts/safe_push.sh main
          fi

      # --- 5. Redéploiement Vercel (synchro quotidienne du dashboard) ---
      # Déclenche un build de production Vercel APRÈS le rafraîchissement des
      # données, pour que le dashboard affiche les nouvelles données DHIS2 chaque
      # jour. Étape non bloquante : ignorée si le secret n'est pas défini.
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL non défini — redéploiement Vercel ignoré."
            exit 0
          fi
          echo "Déclenchement du redéploiement Vercel…"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" && echo "Déploiement Vercel déclenché."
