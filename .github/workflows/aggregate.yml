name: Aggregate dashboard data

on:
  # Trigger after BOTH fetch workflows complete
  workflow_run:
    workflows:
      - "Update DHIS2 vaccination data"
      - "Backfill DHIS2 (range)"
    types: [completed]

  # Manual trigger
  workflow_dispatch:

  # Also trigger on config/data changes
  push:
    branches: [main]
    paths:
      - "docs/data/monthly/**"
      - "docs/data/ou_map.json"
      - "docs/data/rename_map.json"
      - "docs/data/antenne_rules.json"
      - "scripts/aggregate_dashboard.py"

# Same concurrency group as fetch workflows to avoid conflicts
concurrency:
  group: dhis2-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only run if the triggering workflow succeeded (or if manual/push trigger)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnostic — verify source files
        run: |
          echo "=== ou_map.json ==="
          if [ -f docs/data/ou_map.json ]; then
            echo "EXISTS — $(wc -c < docs/data/ou_map.json) bytes"
            python3 -c "
          import json
          d = json.load(open('docs/data/ou_map.json'))
          print(f'  Type: {type(d).__name__}, entries: {len(d)}')
          if isinstance(d, dict):
              k = list(d.keys())[0]
              print(f'  Sample key: {k}')
              print(f'  Sample val: {d[k]}')
          "
          else
            echo "MISSING!"
          fi

          echo ""
          echo "=== rename_map.json ==="
          if [ -f docs/data/rename_map.json ]; then
            echo "EXISTS — $(wc -c < docs/data/rename_map.json) bytes"
          else
            echo "MISSING!"
          fi

          echo ""
          echo "=== antenne_rules.json ==="
          if [ -f docs/data/antenne_rules.json ]; then
            echo "EXISTS — $(wc -c < docs/data/antenne_rules.json) bytes"
          else
            echo "Not found (optional)"
          fi

          echo ""
          echo "=== Monthly NDJSON ==="
          if [ -d docs/data/monthly ]; then
            NDIRS=$(find docs/data/monthly -mindepth 1 -maxdepth 1 -type d | wc -l)
            NFILES=$(find docs/data/monthly -name "*.ndjson" -not -name "*.gz" | wc -l)
            NGZFILES=$(find docs/data/monthly -name "*.ndjson.gz" | wc -l)
            echo "  Month folders: $NDIRS"
            echo "  .ndjson files: $NFILES"
            echo "  .ndjson.gz files: $NGZFILES"

            # Show first line of first file
            FIRST=$(find docs/data/monthly -name "*.ndjson" -not -name "*.gz" | sort | head -1)
            if [ -n "$FIRST" ]; then
              echo ""
              echo "  First record from $FIRST:"
              head -1 "$FIRST" | python3 -c "
          import sys, json
          rec = json.loads(sys.stdin.readline())
          keys = list(rec.keys())
          print(f'    Fields: {len(keys)}')
          print(f'    First 8: {keys[:8]}')
          print(f'    OrgUnit: {rec.get(\"OrgUnit\", \"?\")}')
          print(f'    Period:  {rec.get(\"Period\", \"?\")}')
          " 2>/dev/null || echo "    (could not parse)"
            fi
          else
            echo "  docs/data/monthly/ NOT FOUND"
          fi

      - name: Run aggregation
        run: python scripts/aggregate_dashboard.py

      - name: Validate output JSON
        run: |
          echo "=== Dashboard output ==="
          ERRORS=0
          if [ -d docs/data/dashboard ]; then
            for f in docs/data/dashboard/*.json; do
              if [ -f "$f" ]; then
                SIZE=$(wc -c < "$f")
                if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
                  echo "✅ $(basename $f): ${SIZE} bytes"
                else
                  echo "❌ $(basename $f): ${SIZE} bytes — INVALID JSON!"
                  head -c 200 "$f"
                  echo ""
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            done

            if [ $ERRORS -gt 0 ]; then
              echo "FATAL: $ERRORS invalid JSON files"
              exit 1
            fi
          else
            echo "❌ docs/data/dashboard/ not created!"
            exit 1
          fi

      - name: Commit & push (rebase + retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/dashboard/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update dashboard aggregated data [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin HEAD:main && break
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
