name: Aggregate ALL data for dashboard

on:
  workflow_run:
    workflows: 
      - "Backfill DHIS2 (FOSA / AS / ZS)"
      - "Sync DHIS2 -> GitHub (FOSA / AS / ZS)"
      - "Update DHIS2 vaccination data"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# 🔒 Empêche les lancements en double si plusieurs synchronisations finissent en même temps
concurrency:
  group: dashboard-aggregation
  cancel-in-progress: true

jobs:
  aggregate-all:
    # Ne se lance que si la synchronisation a réussi, ou si c'est un lancement manuel
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    
    # J'ai augmenté à 40 minutes car il y a maintenant 3 scripts à faire tourner l'un après l'autre
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate ALL aggregated dashboard data (FOSA, AS, ZS)
        run: python scripts/aggregate_all.py

      # --- 4. Sauvegarde Globale ---
      - name: Commit all aggregated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # On ajoute tous les dossiers de données générés (FOSA, AS, ZS)
          git add docs/data/dashboard/ docs/data_as/dashboard/ docs/data_zs/dashboard/ docs/.nojekyll
          
          # On vérifie s'il y a des changements avant de pousser
          if ! git diff --staged --quiet; then
            git commit -m "auto: refresh ALL dashboard aggregates (FOSA, AS, ZS) with population"
            chmod +x scripts/safe_push.sh
            ./scripts/safe_push.sh main
          fi
