name: Aggregate AS & ZS data for dashboard

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate-as:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate AS aggregated dashboard data
        run: python scripts/aggregate_dashboard_as.py

      - name: Generate ZS aggregated dashboard data
        run: python scripts/aggregate_dashboard_zs.py

      - name: Commit aggregated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/data_as/dashboard/ docs/data_zs/dashboard/ docs/.nojekyll
          git diff --staged --quiet || git commit -m "auto: refresh AS & ZS dashboard aggregates"
          git push
