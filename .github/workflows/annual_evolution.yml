# Pré-calcul de l'évolution annuelle des couvertures (2020 → aujourd'hui).
# Interroge les indicateurs de couverture DHIS2 par année (province + ZS) et
# écrit docs/data/annual/evolution.json(.gz). Léger (~quelques centaines de Ko).
# Lancement : manuel (workflow_dispatch) ou mensuel (le 5 à 04h UTC).
name: Build annual evolution (couvertures 2020→)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 5 * *"

permissions:
  contents: write

concurrency:
  group: annual-evolution
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            /*
            !/docs/data/monthly
            !/docs/data_as/monthly
            !/docs/data_zs/monthly
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests

      - name: Générer l'évolution annuelle
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: python scripts/build_annual_evolution.py

      - name: Commit du fichier d'évolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/annual/evolution.json docs/data/annual/evolution.json.gz
          if ! git diff --staged --quiet; then
            git commit -m "auto: refresh évolution annuelle des couvertures (2020→)"
            git push origin HEAD:main
          fi

      - name: Redéploiement Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" && echo "Vercel déclenché."; fi
