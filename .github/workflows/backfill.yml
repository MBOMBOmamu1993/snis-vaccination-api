name: Backfill DHIS2 (FOSA / AS / ZS)

# ─────────────────────────────────────────────────────────────
# MANUEL : choisir le niveau et la plage de dates
# AUTO   : tourne les 3 niveaux séquentiellement chaque semaine
#          (dimanche 03:00 UTC) pour maintenir les données à jour
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Niveau à backfiller"
        required: true
        default: "FOSA"
        type: choice
        options:
          - FOSA
          - AS
          - ZS
      start:
        description: "Début YYYYMM (ex: 202501)"
        required: true
        default: "202501"
      end:
        description: "Fin YYYYMM (laisser vide = mois courant)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    name: "Backfill ${{ inputs.level }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Build OU maps (FOSA + AS + ZS)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: python scripts/build_ou_map.py

      - name: Run Backfill
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          END="${{ inputs.end }}"
          
          # Détermination dynamique du script et du dossier de sortie
          if [[ "${{ inputs.level }}" == "FOSA" ]]; then
            SCRIPT="scripts/fetch_dhis2_vaccination.py"
            OUT="docs/data"
          elif [[ "${{ inputs.level }}" == "AS" ]]; then
            SCRIPT="scripts/fetch_dhis2_as.py"
            OUT="docs/data_as"
          else
            SCRIPT="scripts/fetch_dhis2_zs.py"
            OUT="docs/data_zs"
          fi

          python $SCRIPT \
            --backfill \
            --start "${{ inputs.start }}" \
            ${END:+--end "$END"} \
            --retry_failed --retry_limit 12 \
            --out $OUT

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data* 
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Backfill ${{ inputs.level }} ${{ inputs.start }}-${{ inputs.end || 'current' }}"
          chmod +x scripts/safe_push.sh
          ./scripts/safe_push.sh main
