# =============================================================================
#  Mashako 3.0 — SYNCHRO DE SECOURS DANS LE CLOUD (gratuit, GitHub Actions)
#
#  Le PC de Felly reste PRIORITAIRE. Ce workflow ne fait quelque chose QUE si le
#  PC n'a pas fait le travail (arbitre.mjs décide : publication du jour ? bail
#  frais posé par le PC ? heure prévue + 45 min passée ?).
#
#  Authentification : pas de PAT Tableau (désactivés par l'admin axdata) et pas
#  de connexion Google automatisable — on réutilise la SESSION du PC, déposée
#  dans le secret TABLEAU_COOKIES par cloud/publier-cookies.mjs.
#  Vérifié le 27/07/2026 : la session Tableau n'est PAS liée à l'adresse IP.
#
#  Aucun script de synchro n'est modifié : on prépare un profil Chrome déjà
#  connecté (cloud/seed-profile.mjs), puis on lance le sync.mjs habituel.
# =============================================================================
name: Mashako 3.0 — synchro de secours (cloud)

on:
  schedule:
    # ── Horaires en UTC ; Kinshasa = UTC+1, sans heure d'été.
    - cron: "45 6 * * *"      # 07h45 — synchro Antenne        (PC : 7h00)
    - cron: "15 10 * * *"     # 11h15 — synchro Zone de Santé  (PC : 10h30)
    - cron: "45 19 * * *"     # 20h45 — backfill Antenne       (PC : 20h00)
    - cron: "15 23 * * *"     # 00h15 — backfill Zone de Santé (PC : 23h30)
    # ── Ronde de rattrapage toutes les 2 h : c'est elle qui reprend le travail
    #    quand le PC s'éteint EN PLEINE synchro (son bail périme en 25 min).
    #    Quand il n'y a rien à faire, la ronde s'arrête en ~40 s sans réveiller
    #    ni Chrome ni Tableau.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      canal:
        description: "ant, zs, ou vide pour les deux"
        required: false
        default: ""
      tache:
        description: "sync ou backfill"
        required: false
        default: "sync"
      force:
        description: "1 = ignorer l'heure et la publication du jour"
        required: false
        default: ""
      dry:
        description: "1 = expliquer la décision sans rien lancer"
        required: false
        default: ""
      test_alerte:
        description: "1 = ouvrir puis refermer une alerte de test (vérifie que l'e-mail arrive)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write     # ouverture/fermeture de l'alerte « session Tableau expirée »

# Une seule exécution à la fois : si une synchro de 5 h tourne, la ronde
# suivante attend au lieu de doubler les exports (Tableau bride le compte).
concurrency:
  group: mashako-cloud
  cancel-in-progress: false

jobs:
  synchro:
    runs-on: ubuntu-latest
    # sync.mjs s'arrête seul à 5 h (garde-fou MAX_MINUTES) puis publie ;
    # 50 min de marge, sous le plafond de 6 h de GitHub.
    timeout-minutes: 350

    steps:
      # Le dépôt pèse ~21 Go (ndjson bruts) : on ne récupère que l'outillage.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/mashako-sync
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # État à conserver d'une exécution à l'autre : registre de couverture ZS,
      # noms d'URL résolus, garde « déjà synchronisé aujourd'hui », et — pour le
      # détail par aire de santé (reprendre où le relais précédent s'est arrêté)
      # — le journal zs_as_ledger + les tranches déjà exportées.
      - name: Restaurer l'état de la dernière exécution
        uses: actions/cache@v4
        with:
          path: |
            tools/mashako-sync/zs_ledger.json
            tools/mashako-sync/urlnames.json
            tools/mashako-sync/urlnames-zs.json
            tools/mashako-sync/best_count.json
            tools/mashako-sync/best_count_zs.json
            tools/mashako-sync/zs_as_ledger.json
            tools/mashako-sync/zs_as_ledger_s1.json
            tools/mashako-sync/zs_as_ledger_s2.json
            tools/mashako-sync/zs_as_ledger_s3.json
            tools/mashako-sync/out-zs/views
            tools/mashako-sync/session-cloud.enc
          key: mashako-etat-${{ github.run_id }}
          restore-keys: mashako-etat-

      - name: Dépendances Node
        working-directory: tools/mashako-sync
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # on utilise le Chrome du runner
        run: npm ci --no-audit --no-fund

      # Vérifie le VRAI circuit d'alerte : l'issue est créée par
      # github-actions[bot], donc par quelqu'un d'autre que Felly — c'est la
      # seule façon de savoir si l'e-mail arrive vraiment. (Une issue créée par
      # Felly lui-même ne déclenche aucune notification : GitHub ne notifie
      # jamais de ses propres actions.)
      - name: Test volontaire de la chaîne d'alerte
        if: inputs.test_alerte == '1'
        working-directory: tools/mashako-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node cloud/alerte.mjs --ouvrir "TEST volontaire — aucune panne réelle"
          sleep 30
          node cloud/alerte.mjs --fermer

      - name: Canal et tâche, selon l'horaire déclencheur
        run: |
          case "${{ github.event.schedule }}" in
            "45 6 * * *")   echo "CANAL=ant" >> "$GITHUB_ENV"; echo "TACHE=sync"     >> "$GITHUB_ENV" ;;
            "15 10 * * *")  echo "CANAL=zs"  >> "$GITHUB_ENV"; echo "TACHE=sync"     >> "$GITHUB_ENV" ;;
            "45 19 * * *")  echo "CANAL=ant" >> "$GITHUB_ENV"; echo "TACHE=backfill" >> "$GITHUB_ENV" ;;
            "15 23 * * *")  echo "CANAL=zs"  >> "$GITHUB_ENV"; echo "TACHE=backfill" >> "$GITHUB_ENV" ;;
            "0 */2 * * *")  echo "CANAL="    >> "$GITHUB_ENV"; echo "TACHE=sync"     >> "$GITHUB_ENV" ;;
            *)              echo "CANAL=${{ inputs.canal }}" >> "$GITHUB_ENV"
                            echo "TACHE=${{ inputs.tache || 'sync' }}" >> "$GITHUB_ENV" ;;
          esac
          # Une fois par jour (créneau ANT du matin), on contrôle la session
          # MÊME s'il n'y a rien à synchroniser : c'est ce qui détecte une
          # session morte au plus tôt, et qui la maintient en vie — ainsi que la
          # licence Tableau, révoquée après un mois sans connexion.
          if [ "${{ github.event.schedule }}" = "45 6 * * *" ]; then
            echo "CONTROLE_SESSION=1" >> "$GITHUB_ENV"
          fi

      # Décision AVANT de réveiller quoi que ce soit : si le PC a fait le
      # travail, on s'arrête ici sans toucher à Tableau.
      - name: Y a-t-il quelque chose à faire ?
        working-directory: tools/mashako-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASHAKO_ROLE: actions
        run: |
          node cloud/arbitre.mjs --decider --tache "$TACHE" \
            ${CANAL:+--canal "$CANAL"} \
            ${{ inputs.force == '1' && '--force' || '' }}

      # La session est prise D'ABORD dans le cache chiffré (reconduite par le
      # relais précédent : toujours plus fraîche), et le secret TABLEAU_COOKIES
      # (déposé par le PC) ne sert plus que de repli. C'est ce qui permet à la
      # session de survivre indéfiniment PC éteint : chaque relais la rajeunit
      # et la retransmet au suivant (gel de fin juillet 2026, issue #71).
      - name: Injecter la session Tableau (cache chiffré, sinon secret du PC)
        id: session
        if: (env.MASHAKO_A_FAIRE == '1' || env.CONTROLE_SESSION == '1') && inputs.dry != '1'
        working-directory: tools/mashako-sync
        env:
          TABLEAU_COOKIES: ${{ secrets.TABLEAU_COOKIES }}
          MASHAKO_SESSION_KEY: ${{ secrets.MASHAKO_SESSION_KEY }}
        run: |
          if [ -n "$MASHAKO_SESSION_KEY" ] && node cloud/session-cache.mjs --charger; then
            if node cloud/seed-profile.mjs --fichier cookies-cache.json; then
              echo "Session reprise du cache chiffré du relais précédent."
              exit 0
            fi
            echo "Cache de session périmé — repli sur le secret TABLEAU_COOKIES."
            rm -rf browser-profile
          fi
          if [ -z "$TABLEAU_COOKIES" ]; then
            echo "::error::Secret TABLEAU_COOKIES absent. Sur le PC : node cloud/publier-cookies.mjs"
            exit 1
          fi
          node cloud/seed-profile.mjs

      # Le SEUL incident qui exige Felly : plus personne dans le cloud ne peut
      # se reconnecter à Tableau à sa place. On ouvre une issue GitHub assignée
      # au propriétaire du dépôt → e-mail immédiat, même PC éteint.
      - name: Alerter — session Tableau expirée
        if: always() && steps.session.outcome == 'failure'
        working-directory: tools/mashako-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node cloud/alerte.mjs --ouvrir "seed-profile.mjs refusé par Tableau (exécution ${{ github.run_id }})"

      - name: Lever l'alerte — la session refonctionne
        if: steps.session.outcome == 'success'
        working-directory: tools/mashako-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node cloud/alerte.mjs --fermer

      - name: Synchroniser
        if: env.MASHAKO_A_FAIRE == '1' && inputs.dry != '1'
        working-directory: tools/mashako-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASHAKO_ROLE: actions
          MASHAKO_HEADLESS: "1"
        run: |
          node cloud/arbitre.mjs --tache "$TACHE" \
            --canal "${MASHAKO_CANAL_UTILE:-$CANAL}" \
            ${{ inputs.force == '1' && '--force' || '' }}

      # Reconduction : les cookies rafraîchis par CE passage repartent, chiffrés,
      # dans le cache Actions pour le passage suivant (même si la synchro
      # elle-même a échoué : la session, elle, est valide et doit survivre).
      - name: Reconduire la session pour le prochain relais
        if: always() && steps.session.outcome == 'success' && inputs.dry != '1'
        working-directory: tools/mashako-sync
        env:
          MASHAKO_SESSION_KEY: ${{ secrets.MASHAKO_SESSION_KEY }}
        run: node cloud/session-cache.mjs --sauver || echo "(reconduite impossible — le secret du PC restera la référence)"

      - name: Journal de l'arbitre
        if: always()
        working-directory: tools/mashako-sync
        run: tail -n 80 cloud/arbitre.log 2>/dev/null || echo "(aucun journal)"
