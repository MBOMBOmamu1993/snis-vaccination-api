name: "[OBSOLETE] Refresh DHIS2 monthly data"
# REMPLACÉ par sync_dhis2.yml — déclenche manuellement seulement si besoin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      # ✅ 1) Générer / mettre à jour ou_map.json
      - name: Build OU map (ou_map.json)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          python scripts/build_ou_map.py --out docs/data/ou_map.json

      # ✅ 2) Générer / mettre à jour index.json + monthly parts (3 derniers mois)
      - name: Run refresh (last 3 months)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          python scripts/fetch_dhis2_vaccination.py --months 3 --out docs/data --max_plain_bytes 4500000

      - name: Commit & push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "auto: refresh ou_map.json + index.json + monthly data"
          git push
