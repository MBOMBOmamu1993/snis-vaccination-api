name: Build OU maps (FOSA + AS)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"  # chaque lundi 02:15 UTC

permissions:
  contents: write

jobs:
  build-ou-map:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Build OU maps (FOSA + AS + ZS)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          python scripts/build_ou_map.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            docs/data/ou_map.json \
            docs/data/ou_map.json.gz \
            docs/data/ou_map.meta.json \
            docs/data_as/ou_map_as.json \
            docs/data_as/ou_map_as.json.gz \
            docs/data_as/ou_map_as.meta.json \
            docs/data_zs/ou_map_zs.json \
            docs/data_zs/ou_map_zs.json.gz \
            docs/data_zs/ou_map_zs.meta.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update OU maps (FOSA + AS + ZS)"
          chmod +x scripts/safe_push.sh
          ./scripts/safe_push.sh main
