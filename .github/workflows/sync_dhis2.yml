name: Sync DHIS2 -> GitHub (FOSA / AS / ZS)

# ─────────────────────────────────────────────────────────────
# MANUEL : choisir le niveau à rafraîchir
# AUTO   : tourne les 3 niveaux séquentiellement chaque jour
#          FOSA à 12:00 UTC, AS à 12:30 UTC, ZS à 13:00 UTC
#
# ⚠️ NE PAS replanifier dans la fenêtre nocturne (≈18:00–06:00 UTC) :
# l'API analytics du SNIS y renvoie des valeurs transitoires fausses
# (combos « 12-23 mois » gonflés x2/x3 ou mois à zéro) pendant la
# reconstruction des tables analytics — cause de la surestimation
# CV VAR2 de mars-juillet 2026. L'ordre FOSA → AS → ZS compte aussi :
# le garde-fou AS/ZS se réfère aux données FOSA fraîchement validées.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 12 * * *"   # FOSA — 12:00 UTC
    - cron: "30 12 * * *"  # AS   — 12:30 UTC
    - cron: "0 13 * * *"   # ZS   — 13:00 UTC
  workflow_dispatch:
    inputs:
      level:
        description: "Niveau à synchroniser"
        required: true
        default: "FOSA"
        type: choice
        options:
          - FOSA
          - AS
          - ZS
      months:
        description: "Nombre de mois à rafraîchir"
        required: false
        default: "3"

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────
# JOB FOSA  (12:00 UTC auto  OU  manuel level=FOSA)
# ─────────────────────────────────────────────────────────────
jobs:
  sync-fosa:
    name: "Sync FOSA"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'FOSA')

    concurrency:
      group: dhis2-sync-fosa
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Build OU maps
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: python scripts/build_ou_map.py

      - name: Fetch FOSA (last N months)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          MONTHS="${{ inputs.months || '3' }}"
          python scripts/fetch_dhis2_vaccination.py \
            --months "$MONTHS" \
            --retry_failed --retry_limit 3 \
            --out docs/data

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/data/ou_map.json docs/data/ou_map.json.gz docs/data/ou_map.meta.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: sync FOSA (last ${{ inputs.months || '3' }} months)"
          chmod +x scripts/safe_push.sh
          ./scripts/safe_push.sh main

      # Après le commit (les données validées sont publiées quoi qu'il
      # arrive) : run rouge + notification si un mois clôturé reste en
      # échec ou stocké vide — plus jamais de gel silencieux type
      # ZS juin/juillet 2026.
      - name: Sonde de santé (mois clôturés en échec ?)
        run: python scripts/check_sync_health.py docs/data/index.json

# ─────────────────────────────────────────────────────────────
# JOB AS  (12:30 UTC auto  OU  manuel level=AS)
# ─────────────────────────────────────────────────────────────
  sync-as:
    name: "Sync AS"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 12 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'AS')

    concurrency:
      group: dhis2-sync-as
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Build OU maps
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: python scripts/build_ou_map.py

      - name: Fetch AS (last N months)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          MONTHS="${{ inputs.months || '3' }}"
          python scripts/fetch_dhis2_as.py \
            --months "$MONTHS" \
            --retry_failed --retry_limit 3 \
            --out docs/data_as

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data_as docs/data_as/ou_map_as.json docs/data_as/ou_map_as.json.gz docs/data_as/ou_map_as.meta.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: sync AS (last ${{ inputs.months || '3' }} months)"
          chmod +x scripts/safe_push.sh
          ./scripts/safe_push.sh main

      - name: Sonde de santé (mois clôturés en échec ?)
        run: python scripts/check_sync_health.py docs/data_as/index.json

# ─────────────────────────────────────────────────────────────
# JOB ZS  (13:00 UTC auto  OU  manuel level=ZS)
# ─────────────────────────────────────────────────────────────
  sync-zs:
    name: "Sync ZS"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'ZS')

    concurrency:
      group: dhis2-sync-zs
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Build OU maps
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: python scripts/build_ou_map.py

      - name: Fetch ZS (last N months)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          MONTHS="${{ inputs.months || '3' }}"
          python scripts/fetch_dhis2_zs.py \
            --months "$MONTHS" \
            --retry_failed --retry_limit 3 \
            --out docs/data_zs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data_zs docs/data_zs/ou_map_zs.json docs/data_zs/ou_map_zs.json.gz docs/data_zs/ou_map_zs.meta.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: sync ZS (last ${{ inputs.months || '3' }} months)"
          chmod +x scripts/safe_push.sh
          ./scripts/safe_push.sh main

      - name: Sonde de santé (mois clôturés en échec ?)
        run: python scripts/check_sync_health.py docs/data_zs/index.json
