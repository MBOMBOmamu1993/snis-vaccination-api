name: DHIS2 -> GitHub -> Zoho (batch)

on:
  schedule:
    - cron: "2 23 * * *"   # tous les jours à 00:02 (UTC+1)
  workflow_dispatch:
    inputs:
      purge_all:
        description: "PURGE ALL Zoho records (one-shot). Also resets zoho_sync_state.json."
        required: false
        default: "false"
      backfill_all:
        description: "Backfill ALL months from 202501 to now (use only when initializing / after purge)."
        required: false
        default: "false"

concurrency:
  group: dhis2-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      # 0) Build OU maps (FOSA + AS)
      - name: Build OU maps (FOSA + AS)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          python scripts/build_ou_map.py

      # 1) Fetch DHIS2
      - name: Fetch DHIS2 and build NDJSON/index (backfill all)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_all == 'true' }}
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          python scripts/fetch_dhis2_vaccination.py \
            --backfill \
            --start 202501 \
            --out docs/data

      - name: Fetch DHIS2 and build NDJSON/index (last 3 months)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill_all == 'true') }}
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          python scripts/fetch_dhis2_vaccination.py \
            --months 3 \
            --out docs/data

      # 2) PURGE ALL (manual one-shot)
      - name: PURGE ALL Zoho records (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purge_all == 'true' }}
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_DC: ${{ secrets.ZOHO_DC }}
          ZOHO_OWNER: drcongo
          ZOHO_APP_LINK: vaccination-de-routine-dhis2-rdc
          ZOHO_FORM_LINK: Donn_es_PEV_FOSA
          ZOHO_REPORT_LINK: Donn_es_PEV_FOSA_Report
        run: |
          python scripts/sync_zoho_creator_batch.py \
            --index docs/data/index.json \
            --state docs/data/zoho_sync_state.json \
            --purge_all \
            --purge_only \
            --batch_size 200 \
            --purge_batch_limit 200 \
            --throttle_seconds 1.5

      # 3A) Sync Zoho (full import) - seulement si backfill_all=true (et pas purge_all)
      - name: Sync to Zoho Creator (full import, batch 200)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_all == 'true' && inputs.purge_all != 'true' }}
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_DC: ${{ secrets.ZOHO_DC }}
          ZOHO_OWNER: drcongo
          ZOHO_APP_LINK: vaccination-de-routine-dhis2-rdc
          ZOHO_FORM_LINK: Donn_es_PEV_FOSA
          ZOHO_REPORT_LINK: Donn_es_PEV_FOSA_Report
        run: |
          python scripts/sync_zoho_creator_batch.py \
            --index docs/data/index.json \
            --state docs/data/zoho_sync_state.json \
            --import_historical \
            --refresh_last_n 2 \
            --batch_size 200 \
            --throttle_seconds 1.5

      # 3B) Sync Zoho (daily add-only for previous 2 months)
      - name: Sync to Zoho Creator (daily add-only, batch 200)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.purge_all == 'true' || inputs.backfill_all == 'true')) }}
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_DC: ${{ secrets.ZOHO_DC }}
          ZOHO_OWNER: drcongo
          ZOHO_APP_LINK: vaccination-de-routine-dhis2-rdc
          ZOHO_FORM_LINK: Donn_es_PEV_FOSA
          ZOHO_REPORT_LINK: Donn_es_PEV_FOSA_Report
        run: |
          python scripts/sync_zoho_creator_batch.py \
            --index docs/data/index.json \
            --state docs/data/zoho_sync_state.json \
            --refresh_last_n 2 \
            --batch_size 200 \
            --throttle_seconds 1.5

      # 4) Commit & push
      - name: Commit & push if changed (rebase + retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            docs/data \
            docs/data/ou_map.json \
            docs/data/ou_map.json.gz \
            docs/data/ou_map.meta.json \
            docs/data_as/ou_map_as.json \
            docs/data_as/ou_map_as.json.gz \
            docs/data_as/ou_map_as.meta.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update DHIS2 export + OU maps + Zoho sync state"

          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin HEAD:main && break
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
