name: Sync Zoho Creator (last 3 months)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"  # toutes les 10 minutes

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run sync
        env:
          # OAuth
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_DC: ${{ secrets.ZOHO_DC }} # "com" ou "eu" etc

          # Creator app config
          ZC_OWNER: drcongo
          ZC_APP_LINK: vaccination-de-routine-dhis2-rdc
          ZC_FORM_LINK: Donn_es_PEV_FOSA
          ZC_REPORT_LINK: Donn_es_PEV_FOSA_Report
          ZC_API_BASE: https://creator.zoho.com

          DATA_ROOT: docs/data
        run: |
          python scripts/push_to_zoho_v2.py --batch 200 --sleep 10
