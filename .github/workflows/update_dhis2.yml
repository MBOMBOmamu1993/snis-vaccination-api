name: "[OBSOLETE] Update DHIS2 vaccination data"
# REMPLACÉ par sync_dhis2.yml — déclenche manuellement seulement si besoin

on:
  workflow_dispatch:

# ✅ Empêche deux workflows (update/backfill) d'écrire en même temps
concurrency:
  group: dhis2-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ requis pour pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run fetch (last 3 months incl. current)
        env:
          DHIS2_BASE_URL: ${{ secrets.DHIS2_BASE_URL }}
          DHIS2_USERNAME: ${{ secrets.DHIS2_USERNAME }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
        run: |
          python scripts/fetch_dhis2_vaccination.py --start 202501 --months 3 --out docs/data

      - name: Commit & push (rebase + retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update DHIS2 data"

          # ✅ pull --rebase puis push, avec retry
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin HEAD:main && break
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done

      - name: Debug list files
        run: |
          echo "=== monthly/202501 ==="
          ls -lah docs/data/monthly/202501 || true
          echo "=== find ndjson ==="
          find docs/data -maxdepth 4 -type f -name "*.ndjson" -print | head -n 50
          echo "=== git status ==="
          git status --porcelain
