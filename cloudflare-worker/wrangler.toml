name = "pev-ia-proxy"
main = "worker.js"
compatibility_date = "2026-06-01"

# Namespace KV pour les codes d'accès et transactions.
# Créez-le avec :  npx wrangler kv namespace create CODES
# puis collez l'id généré ci-dessous.
[[kv_namespaces]]
binding = "CODES"
id = "fb104235615740b9a9d117355f864751"

[vars]
# Origine(s) autorisée(s) à appeler le proxy (CORS)
ALLOWED_ORIGIN = "https://mbombomamu1993.github.io,https://snis-vaccination-dhis2.vercel.app"

[triggers]
# - toutes les 5 min : relance des alertes WhatsApp en échec (file notifq:*)
# - 17h00 UTC = 18h00 Kinshasa (UTC+1) : rapport des ventes quotidien
crons = ["*/5 * * * *", "0 17 * * *"]
