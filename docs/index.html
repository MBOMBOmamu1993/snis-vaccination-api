<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard PEV de routine – RDC</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;color:#333;font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#999;border-radius:3px}

.hdr{background:linear-gradient(135deg,#002b55 0%,#0b3a6f 45%,#1a5fa8 100%);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:1200;box-shadow:0 3px 18px rgba(0,0,0,.22)}
.hdr .logo{display:flex;align-items:center;gap:10px}
.hdr .logo img,.hdr .logo svg{height:42px;width:42px}
.hdr h1{font-size:21px;font-weight:800;letter-spacing:.4px;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.ibtn{border:2px solid rgba(255,255,255,.45);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-style:italic;font-size:18px;color:#fff;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.15)}

.nav{background:linear-gradient(135deg,#0b3a6f,#0d4888);display:flex;padding-left:16px;border-top:1px solid rgba(255,255,255,.07);position:sticky;top:60px;z-index:1100;overflow-x:auto;-webkit-overflow-scrolling:touch}
.mi{position:relative;padding:13px 20px;color:rgba(255,255,255,.82);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s;user-select:none}
.mi:hover,.mi.act{color:#fff;background:rgba(255,255,255,.09);border-bottom-color:#64b5f6}
.dd{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:290px;box-shadow:0 14px 42px rgba(0,0,0,.22);border-radius:0 0 10px 10px;z-index:2000;overflow:hidden;border:1px solid #ddd}
.dd .di{padding:12px 18px;cursor:pointer;color:#333;font-size:12.5px;font-weight:500;border-bottom:1px solid #f3f3f3;transition:.2s;display:flex;align-items:center;gap:8px}
.dd .di:last-child{border:none}.dd .di:hover{background:#e3f2fd;color:#0b3a6f;padding-left:24px}
.dd .di.as{background:linear-gradient(135deg,#0b3a6f,#1565c0);color:#fff;font-weight:700}
.mi:hover>.dd{display:block}

.lb{background:linear-gradient(135deg,#e3ecf7,#d6e3f5);padding:9px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #c5d4e8;font-size:12px;flex-wrap:wrap}
.lb .lst{font-weight:700;min-width:160px;color:#0b3a6f}
.lb .pw{flex:1;min-width:180px;height:6px;background:#c5d4e8;border-radius:3px;overflow:hidden}
.lb .pf{height:100%;background:linear-gradient(90deg,#0b3a6f,#2196f3);border-radius:3px;transition:width .4s}
.lb .pt{font-size:11px;color:#555;min-width:100px}

.fs{background:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border-bottom:2px solid #e3ecf7;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.fg{position:relative}
.fg label{display:block;font-size:9.5px;font-weight:700;color:#888;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.fbtn{padding:7px 12px;border:2px solid #d1d5db;border-radius:7px;background:#fafbfc;cursor:pointer;font-size:12px;font-weight:600;min-width:140px;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:.2s;gap:6px}
.fbtn:hover{border-color:#1565c0;background:#f0f4ff}
.fbtn .cn{background:#0b3a6f;color:#fff;font-size:9px;padding:2px 5px;border-radius:8px}
.fd{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:230px;max-height:310px;overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.16);border-radius:8px;z-index:999;padding:4px 0;border:1px solid #ddd;margin-top:2px}
.fd.sh{display:block}
.fd .sr{width:calc(100% - 14px);margin:4px 7px 6px;padding:6px 8px;border:1px solid #ddd;border-radius:5px;font-size:11px;outline:none}
.fd .sr:focus{border-color:#1565c0}
.fi{display:flex;align-items:center;gap:7px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.12s}
.fi:hover{background:#e3f2fd}
.fi input[type=checkbox]{accent-color:#0b3a6f;width:14px;height:14px}
.fa{border-bottom:2px solid #e3ecf7;font-weight:700;padding:7px 12px;background:#fafbfc}

.ct{padding:18px 22px}
.db{background:#fff;border-radius:13px;padding:22px;min-height:480px;box-shadow:0 4px 18px rgba(0,0,0,.05);border:1px solid #e5e7eb}

.kr{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kc{flex:1;min-width:170px;background:#fff;border-radius:13px;padding:18px;box-shadow:0 3px 16px rgba(0,0,0,.05);border-left:5px solid #0b3a6f;text-align:center;transition:transform .2s,box-shadow .2s}
.kc:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,0,0,.1)}
.kc.gn{border-left-color:#27ae60}.kc.rd{border-left-color:#e74c3c}.kc.or{border-left-color:#f39c12}.kc.bl{border-left-color:#2196f3}.kc.pu{border-left-color:#9b59b6}
.kv{font-size:28px;font-weight:800;color:#0b3a6f}
.kl{font-size:11px;font-weight:600;color:#666;margin-top:4px}

.cb{background:#fff;border-radius:13px;padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.04);margin-bottom:18px;border:1px solid #eef1f5}
.cb h4{font-size:14px;font-weight:700;color:#0b3a6f;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid #e3ecf7;display:flex;align-items:center;gap:7px}
.cr{display:flex;gap:16px;flex-wrap:wrap}.ch{flex:1;min-width:370px}

.tw{overflow-x:auto;margin-bottom:16px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.06);max-height:480px;overflow-y:auto}
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt thead{background:linear-gradient(135deg,#0b3a6f,#1565c0);color:#fff;position:sticky;top:0;z-index:10}
.dt th{padding:10px 8px;text-align:left;font-weight:700;white-space:nowrap;font-size:10px}
.dt td{padding:7px 8px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.dt tbody tr:hover{background:#f0f7ff}.dt tbody tr:nth-child(even){background:#fafbfc}
.cg{background:#d4edda!important;color:#155724}.crd{background:#fee2e2!important;color:#991b1b}
.cy{background:#fff3cd!important;color:#856404}.co{background:#ffe0b2!important;color:#e65100}

.sect{font-size:15px;font-weight:800;color:#0b3a6f;margin-bottom:16px;padding:13px 18px;background:linear-gradient(135deg,#e3ecf7,#dce8fa);border-radius:11px;display:flex;align-items:center;gap:9px;border-left:5px solid #0b3a6f}

.stt{display:flex;margin-bottom:18px;border-bottom:3px solid #0b3a6f;background:#fff;border-radius:11px 11px 0 0;overflow-x:auto}
.stb{padding:12px 20px;cursor:pointer;font-size:12.5px;font-weight:600;color:#666;border-bottom:4px solid transparent;white-space:nowrap;transition:.2s}
.stb:hover{background:#e3f2fd;color:#0b3a6f}.stb.act{color:#0b3a6f;border-bottom-color:#0b3a6f;font-weight:800;background:#f0f7ff}

.pg{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px;margin-top:10px}
.pg button{padding:9px 22px;border:none;background:linear-gradient(135deg,#0b3a6f,#1565c0);color:#fff;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pg button:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.pg button:not(:disabled):hover{background:linear-gradient(135deg,#1565c0,#1976d2)}
.pg span{font-size:13px;font-weight:700;color:#0b3a6f;background:#e3ecf7;padding:7px 14px;border-radius:18px}

.lgb{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:11px}
.lgi{display:flex;align-items:center;gap:4px}
.lgd{width:13px;height:13px;border-radius:2px;display:inline-block}

@media(max-width:900px){.nav{flex-wrap:wrap}.ch{min-width:100%}.kr{flex-direction:column}.hdr{padding:0 10px}.hdr h1{font-size:15px}.fs{padding:8px 10px}}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M35 25L35 75M65 25L65 75M35 50L65 50M25 38L75 38M25 62L75 62" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="50" cy="18" r="5" fill="#64b5f6"/><circle cx="50" cy="82" r="5" fill="#64b5f6"/>
      <text x="50" y="98" text-anchor="middle" fill="#64b5f6" font-size="9" font-weight="bold">PEV</text>
    </svg>
    <span style="font-weight:700;font-size:14px">PEV</span>
  </div>
  <h1>Dashboard PEV de routine – RDC</h1>
  <div class="ibtn" title="Info"><i>i</i></div>
</div>

<div class="nav" id="mainNav">
  <div class="mi act" id="menuOQD">
    <span>Outil qualité données</span><span style="font-size:10px;margin-left:3px;opacity:.6">▼</span>
    <div class="dd" id="dropdownOQD">
      <div class="di as" onclick="event.stopPropagation();goTo(0)"><span>📋</span> 1. Complétude et Promptitude</div>
      <div class="di" onclick="event.stopPropagation();goTo(1)"><span>📈</span> 2. Cohérence-temps</div>
      <div class="di" onclick="event.stopPropagation();goTo(2)"><span>🔗</span> 3. Cohérence-donnée</div>
      <div class="di" onclick="event.stopPropagation();goTo(3)"><span>⚠️</span> 4. Valeurs atypiques</div>
      <div class="di" onclick="event.stopPropagation();goTo(4)"><span>🏆</span> 5. Score qualité</div>
    </div>
  </div>
</div>

<div class="lb" id="loadBar">
  <div class="lst" id="loadStatus">⏳ Chargement...</div>
  <div class="pw"><div class="pf" id="progFill" style="width:0%"></div></div>
  <div class="pt" id="progText"></div>
</div>

<div class="fs" id="filterSection"></div>

<div class="ct">
  <div class="db" id="dashboard">
    <div style="text-align:center;padding:70px;color:#888"><div style="font-size:48px;margin-bottom:14px">📊</div><h3>Chargement...</h3></div>
  </div>
  <div class="pg" id="paginationBar" style="display:none">
    <button id="btnPrev" onclick="changePage(-1)" disabled>◀ Précédent</button>
    <span id="pageInfo">Page 1/5</span>
    <button id="btnNext" onclick="changePage(1)">Suivant ▶</button>
  </div>
</div>

<script>
var BASE='./data/dashboard';
var S={
  page:0,charts:{},meta:null,byProv:[],byZS:[],
  heatmap:{},hmIndex:{},hmCache:{},
  filtered:{prov:[],zs:[]},filters:{},allVals:{},loaded:false
};

var PAGES=[
  {title:'1. Complétude et Promptitude',ic:'📋',render:renderP1},
  {title:'2. Cohérence-temps',ic:'📈',render:renderP2},
  {title:'3. Cohérence-donnée',ic:'🔗',render:renderP3},
  {title:'4. Valeurs atypiques',ic:'⚠️',render:renderP4},
  {title:'5. Score qualité des données',ic:'🏆',render:renderP5}
];
var AG_MAP={BCG:'BCG_0_11',VPO0:'VPO0_0_11',DTC1:'DTC1_0_11',VPO1:'VPO1_0_11',ROTA1:'ROTA1_0_11','PCV13_1':'PCV13_1_0_11',DTC2:'DTC2_0_11',VPO2:'VPO2_0_11',ROTA2:'ROTA2_0_11','PCV13_2':'PCV13_2_0_11',DTC3:'DTC3_0_11',VPO3:'VPO3_0_11',VPI1:'VPI1_0_11',ROTA3:'ROTA3_0_11','PCV13_3':'PCV13_3_0_11',VAR1:'VAR1_0_11',VPI2:'VPI2_0_11',VAR2:'VAR2_0_11',VAA:'VAA_0_11'};
function agL(a){var m={BCG:'BCG',VPO0:'VPO0',DTC1:'DTC1/Penta1',VPO1:'VPO1',ROTA1:'ROTA1',PCV13_1:'PCV13-1',DTC2:'DTC2/Penta2',VPO2:'VPO2',ROTA2:'ROTA2',PCV13_2:'PCV13-2',DTC3:'DTC3/Penta3',VPO3:'VPO3',VPI1:'VPI1',ROTA3:'ROTA3',PCV13_3:'PCV13-3',VAR1:'VAR1',VPI2:'VPI2',VAR2:'VAR2',VAA:'VAA'};return m[a]||a;}
function moisLabel(ym){if(!ym||ym.length<6)return ym||'';var n=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];return n[parseInt(ym.substring(4,6),10)-1]+' '+ym.substring(0,4);}
function tr(s,n){return s&&s.length>n?s.substr(0,n-1)+'…':s;}
function ccl(v){return v>=80?'cg':v>=50?'cy':'crd';}

function setP(pct,text,status){
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').textContent=text||'';
  if(status)document.getElementById('loadStatus').textContent=status;
}

/* ══ LOAD (ORIGINAL — INCHANGÉ) ══ */
async function loadAll(){
  var t0=Date.now();setP(10,'Chargement...','⏳ Chargement...');
  try{
    var[mR,pR,zR,hmR]=await Promise.all([
      fetch(BASE+'/meta.json?t='+Date.now()),
      fetch(BASE+'/by_province.json'),
      fetch(BASE+'/by_zs.json'),
      fetch(BASE+'/heatmap/manifest.json')
    ]);
    setP(50,'Parsing...');
    S.meta=await mR.json();S.byProv=await pR.json();S.byZS=await zR.json();
    S.hmIndex=await hmR.json();
    S.hmCache={};S.heatmap={};
    setP(80,'Filtres...');
    S.allVals={province:S.meta.provinces||[],antenne:S.meta.antennes||[],zs:S.meta.zs||[],period:S.meta.months||[]};
    Object.keys(S.allVals).forEach(function(k){S.filters[k]=S.allVals[k].slice();});
    S.loaded=true;applyFilters();renderFilters();renderPage();
    var dt=((Date.now()-t0)/1000).toFixed(1);
    setP(100,S.meta.total_records.toLocaleString()+' enreg. | '+S.meta.months.length+' mois | '+S.meta.nb_fosa+' FOSA','⚡ Prêt en '+dt+'s');
  }catch(e){
    console.error(e);setP(0,'❌ '+e.message,'❌ Erreur');
    document.getElementById('dashboard').innerHTML='<div style="text-align:center;padding:60px;color:#e74c3c"><h3>❌ Erreur de chargement</h3><p>'+e.message+'</p><p style="margin-top:12px;font-size:12px;color:#888">Lancez d\'abord le workflow <code>aggregate</code> via GitHub Actions.</p></div>';
  }
}

/* ══ Load heatmap on-demand per province (ORIGINAL) ══ */
async function loadHeatmap(){
  var provs=S.filters.province||[];
  var toLoad=provs.filter(function(p){return S.hmIndex[p]&&!S.hmCache[p];});
  if(toLoad.length){
    var fetches=toLoad.map(function(p){
      return fetch(BASE+'/heatmap/'+S.hmIndex[p])
        .then(function(r){return r.json();})
        .then(function(d){S.hmCache[p]=d;});
    });
    await Promise.all(fetches);
  }
  S.heatmap={};
  provs.forEach(function(p){
    var d=S.hmCache[p];
    if(d){Object.keys(d).forEach(function(f){S.heatmap[f]=d[f];});}
  });
}

function applyFilters(){
  var f=S.filters;
  function ok(r){
    if(f.province.length<S.allVals.province.length&&!f.province.includes(r._Province))return false;
    if(f.antenne.length<S.allVals.antenne.length&&!f.antenne.includes(r._Antenne))return false;
    if(f.zs.length<S.allVals.zs.length&&!f.zs.includes(r._ZS))return false;
    if(f.period.length<S.allVals.period.length&&!f.period.includes(r._YM))return false;
    return true;
  }
  S.filtered={prov:S.byProv.filter(ok),zs:S.byZS.filter(ok)};
}

function renderFilters(){
  var c=document.getElementById('filterSection');c.innerHTML='';
  var dims=['province','antenne','zs','period'];
  var labels={province:'Province',antenne:'Antenne PEV',zs:'Zone de Santé',period:'Période'};
  dims.forEach(function(dim){
    var g=document.createElement('div');g.className='fg';
    var l=document.createElement('label');l.textContent=labels[dim];g.appendChild(l);
    var b=document.createElement('button');b.className='fbtn';
    var sel=S.filters[dim],tot=S.allVals[dim].length;
    b.innerHTML='<span>'+(sel.length===tot?'Tout ('+tot+')':sel.length+'/'+tot)+'</span><span class="cn">'+sel.length+'</span><span>▼</span>';
    b.onclick=function(e){e.stopPropagation();document.querySelectorAll('.fd').forEach(function(el){if(el.id!=='fd-'+dim)el.classList.remove('sh');});document.getElementById('fd-'+dim).classList.toggle('sh');};
    g.appendChild(b);
    var dd=document.createElement('div');dd.className='fd';dd.id='fd-'+dim;
    var sr=document.createElement('input');sr.className='sr';sr.placeholder='Rechercher...';sr.type='text';
    sr.oninput=function(){var q=sr.value.toLowerCase();dd.querySelectorAll('.fi:not(.fa)').forEach(function(it){it.style.display=it.textContent.toLowerCase().indexOf(q)>=0?'':'none';});};
    dd.appendChild(sr);
    var aDiv=document.createElement('div');aDiv.className='fi fa';
    var aCb=document.createElement('input');aCb.type='checkbox';aCb.checked=sel.length===tot;
    aCb.onchange=function(){S.filters[dim]=aCb.checked?S.allVals[dim].slice():[];applyFilters();renderFilters();renderPage();};
    aDiv.appendChild(aCb);var aS=document.createElement('span');aS.textContent='Tout sélectionner';aS.style.fontWeight='700';aDiv.appendChild(aS);dd.appendChild(aDiv);
    S.allVals[dim].forEach(function(v){
      var it=document.createElement('div');it.className='fi';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=S.filters[dim].includes(v);
      cb.onchange=function(){if(cb.checked&&!S.filters[dim].includes(v))S.filters[dim].push(v);if(!cb.checked)S.filters[dim]=S.filters[dim].filter(function(x){return x!==v;});applyFilters();renderFilters();renderPage();};
      it.appendChild(cb);var sp=document.createElement('span');sp.textContent=(dim==='period'?moisLabel(v):v);it.appendChild(sp);dd.appendChild(it);
    });
    g.appendChild(dd);c.appendChild(g);
  });
}
document.addEventListener('click',function(e){if(!e.target.closest('.fg'))document.querySelectorAll('.fd').forEach(function(el){el.classList.remove('sh');});});

function goTo(p){
  S.page=p;
  document.getElementById('dropdownOQD').querySelectorAll('.di').forEach(function(el,i){el.classList.toggle('as',i===p);});
  window.scrollTo({top:0,behavior:'smooth'});
  if(S.loaded)renderPage();
}
function changePage(d){
  var n=S.page+d;
  if(n>=0&&n<5){
    S.page=n;
    document.getElementById('dropdownOQD').querySelectorAll('.di').forEach(function(el,i){el.classList.toggle('as',i===S.page);});
    window.scrollTo({top:0,behavior:'smooth'});
    renderPage();
  }
}

function renderPage(){
  Object.values(S.charts).forEach(function(c){try{c.destroy();}catch(e){}});S.charts={};
  var d=document.getElementById('dashboard');d.innerHTML='';
  var pg=PAGES[S.page];
  d.appendChild(E('div','sect','<span>'+pg.ic+'</span> Outil qualité données — '+pg.title));
  var c=document.createElement('div');c.id='pageContent';d.appendChild(c);
  try{pg.render(c);}catch(e){console.error(e);c.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
  var bar=document.getElementById('paginationBar');bar.style.display='flex';
  document.getElementById('pageInfo').textContent='Page '+(S.page+1)+' sur 5';
  document.getElementById('btnPrev').disabled=S.page===0;
  document.getElementById('btnNext').disabled=S.page>=4;
}

function E(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function groupBy(a,fn){var g={};a.forEach(function(r){var k=fn(r);if(!g[k])g[k]=[];g[k].push(r);});return g;}
function sumF(a,f){return a.reduce(function(s,r){return s+(r[f]||0);},0);}
function avgF(a,f){return a.length?sumF(a,f)/a.length:0;}
function pct(n,d){return d?(n/d*100):0;}

/* ╔══════════════════════════════════════╗
   ║  P1: COMPLÉTUDE & PROMPTITUDE       ║
   ╚══════════════════════════════════════╝ */
function renderP1(c){
  var data=S.filtered.zs;
  var tN=sumF(data,'n'),tR=sumF(data,'rap'),pR=tN?(tR/tN*100):0;
  var aC=avgF(data,'comp'),aP=avgF(data,'prompt');

  c.appendChild(E('div','kr',
    '<div class="kc gn"><div class="kv">'+tR.toLocaleString()+'</div><div class="kl">FOSA rapportantes</div></div>'+
    '<div class="kc rd"><div class="kv">'+(tN-tR).toLocaleString()+'</div><div class="kl">FOSA non-rapportantes</div></div>'+
    '<div class="kc bl"><div class="kv">'+pR.toFixed(1)+'%</div><div class="kl">% de rapportage</div></div>'+
    '<div class="kc or"><div class="kv">'+aC.toFixed(1)+'%</div><div class="kl">Complétude moyenne</div></div>'+
    '<div class="kc pu"><div class="kv">'+(S.meta?S.meta.nb_fosa:0).toLocaleString()+'</div><div class="kl">Nombre de FOSA</div></div>'));

  [{l:'Province',d:S.filtered.prov,k:'_Province'},{l:'Antenne PEV',d:data,k:'_Antenne'},{l:'Zone de Santé',d:data,k:'_ZS'}].forEach(function(lv,i){
    var g=groupBy(lv.d,function(r){return r[lv.k]||'';});var labs=Object.keys(g).filter(Boolean).sort();
    if(labs.length>50)labs=labs.slice(0,50);
    var cD=labs.map(function(k){return avgF(g[k],'comp');});var pD=labs.map(function(k){return avgF(g[k],'prompt');});
    var box=E('div','cb');
    box.innerHTML='<h4>📊 Complétude et Promptitude par '+lv.l+'</h4><canvas id="cp'+i+'" height="'+(labs.length>15?Math.min(labs.length*5,200):70)+'"></canvas>';c.appendChild(box);
    setTimeout(function(){
      var ctx=document.getElementById('cp'+i);if(!ctx)return;
      S.charts['cp'+i]=new Chart(ctx,{type:'bar',data:{labels:labs.map(function(l){return tr(l,24);}),datasets:[{label:'Complétude (%)',data:cD,backgroundColor:'rgba(33,150,243,.72)',borderRadius:3},{label:'Promptitude (%)',data:pD,backgroundColor:'rgba(255,152,0,.72)',borderRadius:3}]},options:{indexAxis:labs.length>12?'y':'x',responsive:true,plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true}},tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+ctx.raw.toFixed(1)+'%';}}}},scales:{x:{beginAtZero:true,max:100,title:{display:true,text:'%'}},y:{ticks:{font:{size:labs.length>25?7:9}}}}}});
    },60+i*30);
  });

  var byM=groupBy(data,function(r){return r._YM||'';});var months=Object.keys(byM).filter(Boolean).sort();
  var mB=E('div','cb');mB.innerHTML='<h4>📈 % FOSA ayant rapporté par mois</h4><canvas id="pM" height="50"></canvas>';c.appendChild(mB);
  setTimeout(function(){
    var ctx=document.getElementById('pM');if(!ctx)return;
    S.charts.pM=new Chart(ctx,{type:'line',data:{labels:months.map(moisLabel),datasets:[{label:'% rapporté',data:months.map(function(m){var d=byM[m];var t=sumF(d,'n'),r=sumF(d,'rap');return t?(r/t*100):0;}),borderColor:'#0b3a6f',backgroundColor:'rgba(11,58,111,.05)',fill:true,tension:.35,pointRadius:5,pointBackgroundColor:'#0b3a6f',borderWidth:3}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'%'}}}}});
  },200);

  /* Heatmap async */
  var hmBox=E('div','cb');
  hmBox.innerHTML='<h4>🗓️ Suivi des soumissions par FOSA × mois</h4><div class="lgb"><div class="lgi"><div class="lgd" style="background:#27ae60"></div> Rapporté</div><div class="lgi"><div class="lgd" style="background:#e74c3c"></div> Non rapporté</div><div class="lgi"><div class="lgd" style="background:#bdc3c8"></div> Pas de données</div></div><div id="hmDiv" style="text-align:center;padding:30px;color:#888"><em>⏳ Chargement heatmap…</em></div>';
  c.appendChild(hmBox);

  loadHeatmap().then(function(){
    var hm=S.heatmap;
    var fosas=Object.keys(hm).sort().slice(0,150);
    if(fosas.length>0&&months.length>0){
      var z=fosas.map(function(f){return months.map(function(m){return hm[f]&&hm[f][m]!==undefined?hm[f][m]:-1;});});
      var el=document.getElementById('hmDiv');
      if(!el)return;
      el.innerHTML='';
      el.style.cssText='width:100%;height:'+Math.max(400,fosas.length*14)+'px';
      Plotly.newPlot(el,[{z:z,x:months.map(moisLabel),y:fosas.map(function(f){return tr(f,32);}),type:'heatmap',colorscale:[[0,'#e74c3c'],[.5,'#bdc3c8'],[1,'#27ae60']],showscale:false,hoverongaps:false}],{margin:{l:200,r:25,t:8,b:55},xaxis:{tickangle:-45,tickfont:{size:10}},yaxis:{autorange:'reversed',dtick:1,tickfont:{size:7}},plot_bgcolor:'#fafbfc'},{responsive:true});
    }else{
      var el=document.getElementById('hmDiv');
      if(el)el.innerHTML='<em>Aucune donnée heatmap pour cette sélection.</em>';
    }
  }).catch(function(e){
    console.error('Heatmap error:',e);
    var el=document.getElementById('hmDiv');
    if(el)el.innerHTML='<em style="color:#e74c3c">Erreur chargement heatmap.</em>';
  });
}

/* ╔══════════════════════════════════════╗
   ║  P2: COHÉRENCE-TEMPS                ║
   ╚══════════════════════════════════════╝ */
function renderP2(c){
  var data=S.filtered.zs;var months=[...new Set(data.map(function(r){return r._YM;}))].filter(Boolean).sort();
  ['BCG','DTC1','DTC3','VPO3','VPI1','VAR1'].forEach(function(ag,i){
    var f=AG_MAP[ag];if(!f)return;
    var row=E('div','cr');
    var left=E('div','ch');
    left.innerHTML='<div class="cb"><h4>📈 '+agL(ag)+' — Évolution mensuelle</h4><canvas id="ct'+i+'" height="60"></canvas></div>';
    row.appendChild(left);
    c.appendChild(row);
    var vals=months.map(function(m){return data.filter(function(r){return r._YM===m;}).reduce(function(a,r){return a+(r[f]||0);},0);});
    setTimeout(function(){
      var ctx=document.getElementById('ct'+i);if(!ctx)return;
      S.charts['ct'+i]=new Chart(ctx,{type:'line',data:{labels:months.map(moisLabel),datasets:[{label:agL(ag),data:vals,borderColor:'#1565C0',backgroundColor:'rgba(21,101,192,.05)',fill:true,tension:.35,pointRadius:5,pointBackgroundColor:'#1565C0',borderWidth:3}]},options:{responsive:true,interaction:{mode:'index',intersect:false},scales:{y:{beginAtZero:true,title:{display:true,text:'Vaccinés'}},x:{grid:{display:false}}}}});
    },100+i*50);
  });
}

/* ╔══════════════════════════════════════╗
   ║  P3: COHÉRENCE-DONNÉE               ║
   ╚══════════════════════════════════════╝ */
function renderP3(c){
  var data=S.filtered.zs;
  var months=[...new Set(data.map(function(r){return r._YM;}))].filter(Boolean).sort();
  var lastM=months[months.length-1];

  // Scatter plots
  [{a:'PCV13_1_0_11',b:'DTC1_0_11',la:'PCV13-1',lb:'DTC1',t:'PCV13-1 vs DTC1'},{a:'PCV13_3_0_11',b:'DTC3_0_11',la:'PCV13-3',lb:'DTC3',t:'PCV13-3 vs DTC3'}].forEach(function(p,pi){
    var box=E('div','cb');box.innerHTML='<h4>🔗 Cohérence '+p.t+' (±10%)</h4><div id="cs'+pi+'" style="height:340px"></div>';c.appendChild(box);
    setTimeout(function(){
      var dv=document.getElementById('cs'+pi);if(!dv||!lastM)return;
      var lastD=data.filter(function(r){return r._YM===lastM;});
      var gZS=groupBy(lastD,function(r){return r._ZS||'';});
      var xV=[],yV=[],txt=[],col=[];
      Object.keys(gZS).filter(Boolean).forEach(function(zs){
        var d=gZS[zs];var v1=sumF(d,p.a),v2=sumF(d,p.b);if(!v2&&!v1)return;
        var den=v2||v1||1;var pctV=(v1-v2)/den*100;
        xV.push(v2);yV.push(v1);col.push(Math.abs(pctV)>10?'#e74c3c':'#1565c0');
        txt.push(zs+'<br>'+p.lb+': '+v2+'<br>'+p.la+': '+v1+'<br>Var: '+pctV.toFixed(1)+'%');
      });
      if(!xV.length)return;
      var mx=Math.max.apply(null,xV.concat(yV).concat([10]))*1.15;
      Plotly.newPlot(dv,[
        {x:xV,y:yV,text:txt,type:'scatter',mode:'markers',marker:{size:9,color:col,line:{width:1,color:'#fff'}},hoverinfo:'text'},
        {x:[0,mx],y:[0,mx],type:'scatter',mode:'lines',line:{color:'#333',width:2,dash:'dot'},name:'Égalité'},
        {x:[0,mx],y:[0,mx*1.1],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'+10%'},
        {x:[0,mx],y:[0,mx*0.9],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'-10%'}
      ],{xaxis:{title:p.lb},yaxis:{title:p.la},margin:{l:55,r:20,t:8,b:45},legend:{orientation:'h',y:-0.2},plot_bgcolor:'#fafbfc'},{responsive:true});
    },80+pi*80);
  });

  // Dropout DTC1-DTC3
  var gZS=groupBy(data,function(r){return r._ZS||'';});
  var labs=[],vals=[],cols=[];
  Object.keys(gZS).filter(Boolean).sort().forEach(function(zs){
    var d=gZS[zs];var d1=sumF(d,'DTC1_0_11'),d3=sumF(d,'DTC3_0_11');if(!d1)return;
    var dr=(d1-d3)/d1*100;labs.push(tr(zs,26));vals.push(dr);cols.push(dr<0?'#e74c3c':'#1565c0');
  });
  var drBox=E('div','cb');drBox.innerHTML='<h4>📉 Taux d\'abandon DTC1–DTC3 par ZS</h4><canvas id="drC" height="75"></canvas>';c.appendChild(drBox);
  setTimeout(function(){
    var ctx=document.getElementById('drC');if(!ctx)return;
    S.charts.dr=new Chart(ctx,{type:'bar',data:{labels:labs,datasets:[{label:'Dropout DTC1-DTC3 (%)',data:vals,backgroundColor:cols,borderRadius:3}]},options:{indexAxis:labs.length>8?'y':'x',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){var v=ctx.raw;return'Dropout: '+(v>0?'+':'')+v.toFixed(1)+'%'+(v<0?' ⚠️ NÉGATIF':'');}}}},scales:{x:{title:{display:true,text:'%'}},y:{ticks:{font:{size:labs.length>20?7:9}}}}}});
  },300);
}

/* ╔══════════════════════════════════════╗
   ║  P4: VALEURS ATYPIQUES              ║
   ╚══════════════════════════════════════╝ */
function renderP4(c){
  var data=S.filtered.zs;var months=[...new Set(data.map(function(r){return r._YM;}))].filter(Boolean).sort();
  var ags=['BCG','DTC1','DTC3','VAR1','VPO3'];var colors=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6'];
  var gP=groupBy(S.filtered.prov,function(r){return r._Province||'';});var provs=Object.keys(gP).filter(Boolean).sort();
  var ds=ags.map(function(ag,i){return{label:agL(ag),data:provs.map(function(p){return sumF(gP[p],AG_MAP[ag]);}),backgroundColor:colors[i],borderRadius:2};});
  var box=E('div','cb');
  box.innerHTML='<h4>⚠️ Doses par province — antigènes clés</h4><canvas id="agP" height="80"></canvas>';c.appendChild(box);
  setTimeout(function(){
    var ctx=document.getElementById('agP');if(!ctx)return;
    S.charts.agP=new Chart(ctx,{type:'bar',data:{labels:provs.map(function(l){return tr(l,20);}),datasets:ds},options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true}}},scales:{x:{ticks:{maxRotation:45,font:{size:8}}}}}});
  },100);

  var tB=E('div','cb');
  tB.innerHTML='<h4>📈 Tendance mensuelle — antigènes clés</h4><canvas id="agT" height="55"></canvas>';c.appendChild(tB);
  setTimeout(function(){
    var ctx=document.getElementById('agT');if(!ctx)return;
    var ds2=ags.map(function(ag,i){return{label:agL(ag),data:months.map(function(m){return data.filter(function(r){return r._YM===m;}).reduce(function(a,r){return a+(r[AG_MAP[ag]]||0);},0);}),borderColor:colors[i],tension:.3,pointRadius:3,fill:false,borderWidth:2};});
    S.charts.agT=new Chart(ctx,{type:'line',data:{labels:months.map(moisLabel),datasets:ds2},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true}}},scales:{y:{beginAtZero:true,title:{display:true,text:'Doses'}}}}});
  },200);
}

/* ╔══════════════════════════════════════╗
   ║  P5: SCORE QUALITÉ DES DONNÉES      ║
   ╚══════════════════════════════════════╝ */
function renderP5(c){
  c.innerHTML='<div class="stt" id="sTabs"><div class="stb act" onclick="showST(0)">Par Province</div><div class="stb" onclick="showST(1)">Par Antenne</div><div class="stb" onclick="showST(2)">Par ZS</div></div><div id="scoreC"></div>';
  setTimeout(function(){showST(0);},50);
}

window.showST=function(idx){
  document.querySelectorAll('#sTabs .stb').forEach(function(t,i){t.classList.toggle('act',i===idx);});
  var sc=document.getElementById('scoreC');sc.innerHTML='';
  var data=[S.filtered.prov,S.filtered.zs,S.filtered.zs][idx];
  var kf=['_Province','_Antenne','_ZS'][idx];var lb=['Province','Antenne PEV','Zone de Santé'][idx];
  var g=groupBy(data,function(r){return r[kf]||'';});var units=Object.keys(g).filter(Boolean).sort();

  var rows=units.map(function(u){
    var d=g[u],tN=sumF(d,'n'),tR=sumF(d,'rap'),pR=tN?(tR/tN*100):0;
    var aC=avgF(d,'comp'),aP=avgF(d,'prompt');
    var d1=sumF(d,'DTC1_0_11'),d3=sumF(d,'DTC3_0_11'),dr=d1?((d1-d3)/d1*100):0;
    var scR=(pR>=90?20:pR>=80?16:pR>=70?12:pR>=60?8:pR>=50?4:0);
    var scC=(aC>=90?20:aC>=80?16:aC>=70?12:aC>=60?8:aC>=50?4:0);
    var scD=dr>=0?20:0;
    var tot=Math.round(scR+scC+scD);
    var interp=tot>=50?'Bon':'Mauvais';
    return{u:u,tN:tN,tR:tR,pR:pR,aC:aC,aP:aP,d1:d1,d3:d3,dr:dr,tot:tot,interp:interp};
  });
  rows.sort(function(a,b){return b.tot-a.tot;});

  var bon=rows.filter(function(r){return r.interp==='Bon';}).length;
  var mau=rows.length-bon;
  var avg2=rows.length?rows.reduce(function(s,r){return s+r.tot;},0)/rows.length:0;

  sc.innerHTML='<div class="kr" style="margin-bottom:16px">'+
    '<div class="kc gn"><div class="kv">'+bon+'</div><div class="kl">👍 Bon (≥50)</div></div>'+
    '<div class="kc rd"><div class="kv">'+mau+'</div><div class="kl">⚠️ Mauvais (<50)</div></div>'+
    '<div class="kc bl"><div class="kv">'+avg2.toFixed(0)+'</div><div class="kl">Score moyen /100</div></div>'+
    '<div class="kc pu"><div class="kv">'+rows.length+'</div><div class="kl">'+lb+'s évaluées</div></div></div>';

  // Distribution chart
  sc.innerHTML+='<div class="cb"><h4>📊 Distribution des scores — '+lb+'</h4><canvas id="sDist" height="45"></canvas></div>';
  setTimeout(function(){var x=document.getElementById('sDist');if(!x)return;
    var bins=[[0,20],[20,40],[40,60],[60,80],[80,101]],bL=bins.map(function(b){return b[0]+'-'+(b[1]===101?100:b[1]);}),bC=bins.map(function(b){return rows.filter(function(r){return r.tot>=b[0]&&r.tot<b[1];}).length;});
    S.charts.sDist=new Chart(x,{type:'bar',data:{labels:bL,datasets:[{data:bC,backgroundColor:['#e74c3c','#ff7043','#f39c12','#66bb6a','#27ae60'],borderRadius:5}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,title:{display:true,text:'Nombre'}},x:{title:{display:true,text:'Score'}}}}});
  },60);

  // Table
  var h='<div class="tw"><table class="dt"><thead><tr><th>'+lb+'</th><th>Enreg.</th><th>Rapp.</th><th>%Rapp.</th><th>Compl.</th><th>Prompt.</th><th>DTC1</th><th>DTC3</th><th>Drop%</th><th>SCORE</th><th>Interprét.</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var scCol=r.tot>=50?'#27ae60':'#e74c3c';
    var intC=r.interp==='Bon'?'cg':'crd';
    h+='<tr><td><b>'+tr(r.u,26)+'</b></td><td style="text-align:center">'+r.tN+'</td><td style="text-align:center">'+r.tR+'</td><td class="'+ccl(r.pR)+'">'+r.pR.toFixed(1)+'%</td><td class="'+ccl(r.aC)+'">'+r.aC.toFixed(1)+'%</td><td style="text-align:center">'+r.aP.toFixed(1)+'%</td><td style="text-align:center">'+r.d1+'</td><td style="text-align:center">'+r.d3+'</td><td class="'+(r.dr<0?'crd':'')+'">'+r.dr.toFixed(1)+'%</td><td style="background:'+scCol+';color:#fff;text-align:center;font-weight:800;font-size:15px">'+r.tot+'</td><td class="'+intC+'" style="font-weight:700;text-align:center">'+r.interp+'</td></tr>';
  });
  sc.innerHTML+=h+'</tbody></table></div>';
};

loadAll();
</script>
