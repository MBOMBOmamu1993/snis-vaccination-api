<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard PEV – RDC</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;color:#333}
.top-header{background:linear-gradient(135deg,#0b3a6f,#1a5fa8);color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:1100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.htitle{font-size:20px;font-weight:800;letter-spacing:.5px}
.navbar{background:linear-gradient(135deg,#0b3a6f,#0e4a8a);display:flex;padding-left:16px;border-top:1px solid rgba(255,255,255,.1);position:sticky;top:58px;z-index:1050}
.menu-item{position:relative;padding:13px 20px;color:#fff;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:all .25s}
.menu-item:hover,.menu-item.active{background:rgba(255,255,255,.1);border-bottom-color:#4ea1ff}
.dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:280px;box-shadow:0 12px 32px rgba(0,0,0,.2);border-radius:0 0 10px 10px;z-index:2000;overflow:hidden}
.dropdown div{padding:12px 18px;cursor:pointer;color:#333;font-size:13.5px;font-weight:500;border-bottom:1px solid #f0f0f0;transition:all .2s}
.dropdown div:hover{background:#e8f0fe;color:#0b3a6f;padding-left:22px}
.dropdown div.active-sub{background:linear-gradient(135deg,#0b3a6f,#1565C0);color:#fff;font-weight:700}
.menu-item:hover .dropdown{display:block}
.load-bar{background:#e8f0fe;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d0d5dd;font-size:12.5px;flex-wrap:wrap}
.load-bar .status{font-weight:700;min-width:200px}
.load-bar .prog-wrap{flex:1;min-width:200px;height:8px;background:#ddd;border-radius:4px;overflow:hidden}
.load-bar .prog-fill{height:100%;background:#0b3a6f;border-radius:4px;transition:width .3s}
.load-bar .prog-text{font-size:11px;color:#666;min-width:120px}
.filter-section{background:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border-bottom:2px solid #e8f0fe}
.filter-group{position:relative}
.filter-group label{display:block;font-size:10.5px;font-weight:700;color:#666;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.filter-btn{padding:8px 14px;border:2px solid #d1d5db;border-radius:8px;background:#fafbfc;cursor:pointer;font-size:12.5px;font-weight:600;min-width:140px;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:all .2s}
.filter-btn:hover{border-color:#0b3a6f;background:#f0f4ff}
.filter-dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:220px;max-height:280px;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.15);border-radius:10px;z-index:999;padding:4px 0;border:1px solid #e5e7eb}
.filter-dropdown.show{display:block}
.fd-item{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.fd-item:hover{background:#e8f0fe}
.fd-item input[type=checkbox]{accent-color:#0b3a6f}
.fd-all{border-bottom:1px solid #eee;font-weight:600;padding:6px 12px}
.container{padding:20px}
.dashboard{background:#fff;border-radius:12px;padding:20px;min-height:500px;box-shadow:0 4px 16px rgba(0,0,0,.06);border:1px solid #e5e7eb}
.kpi-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kpi-card{flex:1;min-width:170px;background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 4px 16px rgba(0,0,0,.06);border-left:5px solid #0b3a6f;text-align:center;border:1px solid #f0f0f0;transition:transform .2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.kpi-card.green{border-left-color:#27ae60}.kpi-card.red{border-left-color:#e74c3c}.kpi-card.orange{border-left-color:#f39c12}.kpi-card.blue{border-left-color:#2196F3}
.kpi-value{font-size:28px;font-weight:800;color:#0b3a6f}
.kpi-label{font-size:12px;font-weight:600;color:#555;margin-top:4px}
.chart-box{background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:18px;border:1px solid #eef1f5}
.chart-box h4{font-size:14.5px;font-weight:700;color:#0b3a6f;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e8f0fe}
.chart-row{display:flex;gap:16px;flex-wrap:wrap}
.chart-half{flex:1;min-width:380px}
.data-table-wrap{overflow-x:auto;margin-bottom:18px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.data-table{width:100%;border-collapse:collapse;font-size:11.5px}
.data-table thead{background:linear-gradient(135deg,#0b3a6f,#1565C0);color:#fff;position:sticky;top:0}
.data-table th{padding:10px 12px;text-align:left;font-weight:700;white-space:nowrap}
.data-table td{padding:8px 10px;border-bottom:1px solid #eee}
.data-table tbody tr:hover{background:#f0f7ff}
.cell-red{background:#fee2e2!important;color:#991b1b}
.section-title{font-size:16px;font-weight:800;color:#0b3a6f;margin-bottom:16px;padding:12px 18px;background:linear-gradient(135deg,#e8f0fe,#dce8fa);border-radius:10px;display:flex;align-items:center;gap:8px;border-left:4px solid #0b3a6f}
.sub-tabs{display:flex;margin-bottom:18px;border-bottom:3px solid #0b3a6f;background:#fff;border-radius:10px 10px 0 0;overflow:hidden}
.sub-tab{padding:12px 20px;cursor:pointer;font-size:13px;font-weight:600;color:#555;border-bottom:4px solid transparent}
.sub-tab:hover{background:#e8f0fe;color:#0b3a6f}
.sub-tab.active{color:#0b3a6f;border-bottom-color:#0b3a6f;font-weight:800;background:#f5f8ff}
.pagination{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px;margin-top:10px}
.pagination button{padding:9px 20px;border:none;background:#0b3a6f;color:#fff;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:700}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.pagination button:not(:disabled):hover{background:#1565C0}
.pagination span{font-size:13px;font-weight:600;color:#333}
@media(max-width:768px){.navbar{flex-wrap:wrap}.chart-half{min-width:100%}.kpi-row{flex-direction:column}}
</style>
</head>
<body>

<div class="top-header">
  <div style="display:flex;align-items:center;gap:10px;font-weight:bold;font-size:14px">🏥 PEV</div>
  <div class="htitle">Dashboard PEV de routine – RDC</div>
  <div style="border:2px solid rgba(255,255,255,.5);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-style:italic;font-size:18px;color:#fff" title="Info">i</div>
</div>

<div class="navbar" id="mainNav">
  <div class="menu-item active" id="menuOQD">Outil qualité données ▼
    <div class="dropdown" id="dropdownOQD">
      <div class="active-sub" onclick="event.stopPropagation();goTo(0)">1. Complétude et Promptitude</div>
      <div onclick="event.stopPropagation();goTo(1)">2. Cohérence-temps</div>
      <div onclick="event.stopPropagation();goTo(2)">3. Cohérence-donnée</div>
      <div onclick="event.stopPropagation();goTo(3)">4. Valeurs atypiques</div>
      <div onclick="event.stopPropagation();goTo(4)">5. Score qualité</div>
    </div>
  </div>
</div>

<div class="load-bar" id="loadBar">
  <div class="status" id="loadStatus">⏳ Chargement...</div>
  <div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-text" id="progText"></div>
</div>

<div class="filter-section" id="filterSection"></div>

<div class="container">
  <div class="dashboard" id="dashboard"></div>
  <div class="pagination" id="paginationBar" style="display:none">
    <button id="btnPrev" onclick="changePage(-1)" disabled>◀ Précédent</button>
    <span id="pageInfo"></span>
    <button id="btnNext" onclick="changePage(1)">Suivant ▶</button>
  </div>
</div>

<script>
var BASE='./data/dashboard';
var S={page:0,charts:{},meta:null,byProv:[],byZS:[],heatmap:{},filtered:{prov:[],zs:[]},filters:{},allVals:{},loaded:false};
var PAGES=[
  {title:'1. Complétude et Promptitude',render:renderP1},
  {title:'2. Cohérence-temps',render:renderP2},
  {title:'3. Cohérence-donnée',render:renderP3},
  {title:'4. Valeurs atypiques',render:renderP4},
  {title:'5. Score qualité des données',render:renderP5}
];
var AG_MAP={BCG:'BCG_0_11',VPO0:'VPO0_0_11',DTC1:'DTC1_0_11',VPO1:'VPO1_0_11',ROTA1:'ROTA1_0_11','PCV13_1':'PCV13_1_0_11',DTC2:'DTC2_0_11',VPO2:'VPO2_0_11',ROTA2:'ROTA2_0_11','PCV13_2':'PCV13_2_0_11',DTC3:'DTC3_0_11',VPO3:'VPO3_0_11',VPI1:'VPI1_0_11',ROTA3:'ROTA3_0_11','PCV13_3':'PCV13_3_0_11',VAR1:'VAR1_0_11',VPI2:'VPI2_0_11',VAR2:'VAR2_0_11',VAA:'VAA_0_11'};
function agL(a){var m={BCG:'BCG',VPO0:'VPO0',DTC1:'DTC1/Penta1',VPO1:'VPO1',ROTA1:'ROTA1',PCV13_1:'PCV13-1',DTC2:'DTC2/Penta2',VPO2:'VPO2',ROTA2:'ROTA2',PCV13_2:'PCV13-2',DTC3:'DTC3/Penta3',VPO3:'VPO3',VPI1:'VPI1',ROTA3:'ROTA3',PCV13_3:'PCV13-3',VAR1:'VAR1',VPI2:'VPI2',VAR2:'VAR2',VAA:'VAA'};return m[a]||a;}
function moisLabel(ym){var n=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];return n[parseInt(ym.substring(4,6),10)-1]+' '+ym.substring(0,4);}

function setP(pct,text,status){document.getElementById('progFill').style.width=pct+'%';document.getElementById('progText').textContent=text||'';if(status)document.getElementById('loadStatus').textContent=status;}

/* ── LOAD: only 4 small files (~11 MB total) ── */
async function loadAll(){
  var t0=Date.now();setP(10,'Chargement...','⏳ Chargement...');
  try{
    var [mR,pR,zR,hR]=await Promise.all([
      fetch(BASE+'/meta.json?t='+Date.now()),
      fetch(BASE+'/by_province.json'),
      fetch(BASE+'/by_zs.json'),
      fetch(BASE+'/heatmap.json')
    ]);
    setP(50,'Parsing...');
    S.meta=await mR.json();S.byProv=await pR.json();S.byZS=await zR.json();S.heatmap=await hR.json();
    setP(80,'Filtres...');
    S.allVals={province:S.meta.provinces||[],antenne:S.meta.antennes||[],zs:S.meta.zs||[],period:S.meta.months||[]};
    Object.keys(S.allVals).forEach(function(k){S.filters[k]=S.allVals[k].slice();});
    S.loaded=true;applyFilters();renderFilters();renderPage();
    var dt=((Date.now()-t0)/1000).toFixed(1);
    setP(100,S.meta.total_records.toLocaleString()+' enreg. | '+S.meta.months.length+' mois | '+S.meta.nb_fosa+' FOSA','⚡ Prêt en '+dt+'s');
  }catch(e){
    console.error(e);setP(0,'❌ '+e.message,'❌ Erreur');
    document.getElementById('dashboard').innerHTML='<div style="text-align:center;padding:60px;color:#e74c3c"><h3>❌ Erreur de chargement</h3><p>'+e.message+'</p><p style="margin-top:12px;font-size:12px;color:#888">Lancez d\'abord le workflow <code>aggregate</code> via GitHub Actions.</p></div>';
  }
}

function applyFilters(){
  var f=S.filters;
  function ok(r){
    if(f.province.length<S.allVals.province.length&&!f.province.includes(r._Province))return false;
    if(f.antenne.length<S.allVals.antenne.length&&!f.antenne.includes(r._Antenne))return false;
    if(f.zs.length<S.allVals.zs.length&&!f.zs.includes(r._ZS))return false;
    if(f.period.length<S.allVals.period.length&&!f.period.includes(r._YM))return false;
    return true;
  }
  S.filtered={prov:S.byProv.filter(ok),zs:S.byZS.filter(ok)};
}

function renderFilters(){
  var c=document.getElementById('filterSection');c.innerHTML='';
  var dims=['province','antenne','zs','period'];
  var labels={province:'Province',antenne:'Antenne PEV',zs:'Zone de Santé',period:'Période'};
  dims.forEach(function(dim){
    var g=document.createElement('div');g.className='filter-group';
    var l=document.createElement('label');l.textContent=labels[dim];g.appendChild(l);
    var b=document.createElement('button');b.className='filter-btn';
    var sel=S.filters[dim],tot=S.allVals[dim].length;
    b.innerHTML='<span>'+(sel.length===tot?'Tout':sel.length+' sél.')+'</span><span>▼</span>';
    b.onclick=function(){var dd=document.getElementById('fd-'+dim);document.querySelectorAll('.filter-dropdown').forEach(function(el){if(el.id!=='fd-'+dim)el.classList.remove('show');});dd.classList.toggle('show');};
    g.appendChild(b);
    var dd=document.createElement('div');dd.className='filter-dropdown';dd.id='fd-'+dim;
    var aDiv=document.createElement('div');aDiv.className='fd-item fd-all';
    var aCb=document.createElement('input');aCb.type='checkbox';aCb.checked=sel.length===tot;
    aCb.onchange=function(){S.filters[dim]=aCb.checked?S.allVals[dim].slice():[];applyFilters();renderFilters();renderPage();};
    aDiv.appendChild(aCb);var aS=document.createElement('span');aS.textContent='Tout';aDiv.appendChild(aS);dd.appendChild(aDiv);
    S.allVals[dim].forEach(function(v){
      var it=document.createElement('div');it.className='fd-item';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=S.filters[dim].includes(v);
      cb.onchange=function(){if(cb.checked&&!S.filters[dim].includes(v))S.filters[dim].push(v);if(!cb.checked)S.filters[dim]=S.filters[dim].filter(function(x){return x!==v;});applyFilters();renderFilters();renderPage();};
      it.appendChild(cb);var sp=document.createElement('span');sp.textContent=(dim==='period'?moisLabel(v):v);it.appendChild(sp);dd.appendChild(it);
    });
    g.appendChild(dd);c.appendChild(g);
  });
}
document.addEventListener('click',function(e){if(!e.target.closest('.filter-group'))document.querySelectorAll('.filter-dropdown').forEach(function(el){el.classList.remove('show');});});

function goTo(p){S.page=p;document.getElementById('dropdownOQD').querySelectorAll('div').forEach(function(el,i){el.classList.toggle('active-sub',i===p);});window.scrollTo({top:0});if(S.loaded)renderPage();}
function changePage(d){var n=S.page+d;if(n>=0&&n<5){S.page=n;document.getElementById('dropdownOQD').querySelectorAll('div').forEach(function(el,i){el.classList.toggle('active-sub',i===S.page);});window.scrollTo({top:0});renderPage();}}

function renderPage(){
  Object.values(S.charts).forEach(function(c){try{c.destroy();}catch(e){}});S.charts={};
  var d=document.getElementById('dashboard');d.innerHTML='';
  var pg=PAGES[S.page];
  var t=document.createElement('div');t.className='section-title';t.innerHTML='<span>📊</span> '+pg.title;d.appendChild(t);
  var c=document.createElement('div');c.id='pageContent';d.appendChild(c);
  try{pg.render(c);}catch(e){console.error(e);c.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
  var bar=document.getElementById('paginationBar');bar.style.display='flex';
  document.getElementById('pageInfo').textContent='Page '+(S.page+1)+'/5';
  document.getElementById('btnPrev').disabled=S.page===0;
  document.getElementById('btnNext').disabled=S.page>=4;
}

function groupBy(a,fn){var g={};a.forEach(function(r){var k=fn(r);if(!g[k])g[k]=[];g[k].push(r);});return g;}
function sumF(a,f){return a.reduce(function(s,r){return s+(r[f]||0);},0);}
function avgF(a,f){return a.length?sumF(a,f)/a.length:0;}

/* ══════ PAGE 1 : COMPLÉTUDE ══════ */
function renderP1(c){
  var data=S.filtered.zs;
  var tN=sumF(data,'n'),tR=sumF(data,'rap'),pR=tN?(tR/tN*100):0;
  var aC=avgF(data,'comp'),aP=avgF(data,'prompt');
  c.innerHTML='<div class="kpi-row">'+
    '<div class="kpi-card green"><div class="kpi-value">'+tR.toLocaleString()+'</div><div class="kpi-label">Rapportantes</div></div>'+
    '<div class="kpi-card red"><div class="kpi-value">'+(tN-tR).toLocaleString()+'</div><div class="kpi-label">Non-rapportantes</div></div>'+
    '<div class="kpi-card blue"><div class="kpi-value">'+pR.toFixed(1)+'%</div><div class="kpi-label">% rapportage</div></div>'+
    '<div class="kpi-card orange"><div class="kpi-value">'+aC.toFixed(1)+'%</div><div class="kpi-label">Complétude moy.</div></div>'+
    '<div class="kpi-card"><div class="kpi-value">'+(S.meta?S.meta.nb_fosa:0).toLocaleString()+'</div><div class="kpi-label">FOSA</div></div></div>';

  [{l:'Province',d:S.filtered.prov,k:'_Province'},{l:'Antenne PEV',d:data,k:'_Antenne'},{l:'Zone de Santé',d:data,k:'_ZS'}].forEach(function(lv,i){
    var g=groupBy(lv.d,function(r){return r[lv.k]||'';});var labs=Object.keys(g).filter(Boolean).sort();
    var cD=labs.map(function(k){return avgF(g[k],'comp');});var pD=labs.map(function(k){return avgF(g[k],'prompt');});
    var box=document.createElement('div');box.className='chart-box';
    box.innerHTML='<h4>Complétude et Promptitude par '+lv.l+'</h4><canvas id="cp'+i+'" height="80"></canvas>';c.appendChild(box);
    setTimeout(function(){var ctx=document.getElementById('cp'+i);if(!ctx)return;
      S.charts['cp'+i]=new Chart(ctx,{type:'bar',data:{labels:labs.map(function(l){return l.length>22?l.substring(0,20)+'…':l;}),datasets:[{label:'Complétude (%)',data:cD,backgroundColor:'#2196F3',borderRadius:3},{label:'Promptitude (%)',data:pD,backgroundColor:'#FF9800',borderRadius:3}]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'%'}},x:{ticks:{maxRotation:45,font:{size:9}}}}}});
    },50+i*30);
  });

  var byM=groupBy(data,function(r){return r._YM||'';});var months=Object.keys(byM).filter(Boolean).sort();
  var mB=document.createElement('div');mB.className='chart-box';mB.innerHTML='<h4>% rapportage par mois</h4><canvas id="pM" height="60"></canvas>';c.appendChild(mB);
  setTimeout(function(){var ctx=document.getElementById('pM');if(!ctx)return;
    S.charts.pM=new Chart(ctx,{type:'line',data:{labels:months.map(moisLabel),datasets:[{label:'% rapporté',data:months.map(function(m){var d=byM[m];var t=sumF(d,'n'),r=sumF(d,'rap');return t?(r/t*100):0;}),borderColor:'#0b3a6f',backgroundColor:'rgba(11,58,111,.08)',fill:true,tension:.3,pointRadius:5}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'%'}}}}});
  },200);

  var hm=S.heatmap;var fosas=Object.keys(hm).sort().slice(0,150);
  if(fosas.length>0&&months.length>0){
    var z=fosas.map(function(f){return months.map(function(m){return hm[f]&&hm[f][m]!==undefined?hm[f][m]:-1;});});
    var hmB=document.createElement('div');hmB.className='chart-box';
    hmB.innerHTML='<h4>Soumissions par FOSA (150 premières)</h4><div id="hmDiv" style="width:100%;height:'+Math.max(400,fosas.length*14)+'px"></div>';c.appendChild(hmB);
    setTimeout(function(){if(!document.getElementById('hmDiv'))return;
      Plotly.newPlot('hmDiv',[{z:z,x:months.map(moisLabel),y:fosas.map(function(f){return f.length>30?f.substring(0,28)+'…':f;}),type:'heatmap',colorscale:[[0,'#f8d7da'],[.5,'#e0e0e0'],[1,'#d4edda']],showscale:true,colorbar:{tickvals:[0,1],ticktext:['Non','Oui']}}],{margin:{l:200,r:30,t:20,b:60},xaxis:{title:'Mois',tickangle:-45},yaxis:{autorange:'reversed',dtick:1,tickfont:{size:7}}},{responsive:true});
    },300);
  }
}

/* ══════ PAGE 2 : COHÉRENCE TEMPS ══════ */
function renderP2(c){
  var data=S.filtered.zs;var months=[...new Set(data.map(function(r){return r._YM;}))].filter(Boolean).sort();
  ['BCG','DTC1','DTC3','VPO3','VPI1','VAR1'].forEach(function(ag,i){
    var f=AG_MAP[ag];if(!f)return;
    var box=document.createElement('div');box.className='chart-box';
    box.innerHTML='<h4>'+agL(ag)+' – Évolution mensuelle</h4><canvas id="ct'+i+'" height="70"></canvas>';c.appendChild(box);
    var vals=months.map(function(m){return data.filter(function(r){return r._YM===m;}).reduce(function(a,r){return a+(r[f]||0);},0);});
    setTimeout(function(){var ctx=document.getElementById('ct'+i);if(!ctx)return;
      S.charts['ct'+i]=new Chart(ctx,{type:'line',data:{labels:months.map(moisLabel),datasets:[{label:agL(ag),data:vals,borderColor:'#1565C0',backgroundColor:'rgba(21,101,192,.06)',fill:true,tension:.3,pointRadius:4}]},options:{responsive:true,scales:{y:{beginAtZero:true,title:{display:true,text:'Vaccinés'}}}}});
    },100+i*50);
  });
}

/* ══════ PAGE 3 : COHÉRENCE DONNÉE ══════ */
function renderP3(c){
  var data=S.filtered.zs;
  var gZS=groupBy(data,function(r){return r._ZS||'';});
  var labs=[],vals=[],cols=[];
  Object.keys(gZS).filter(Boolean).sort().forEach(function(zs){
    var d=gZS[zs];var d1=sumF(d,'DTC1_0_11'),d3=sumF(d,'DTC3_0_11');if(!d1)return;
    var dr=(d1-d3)/d1*100;labs.push(zs.length>25?zs.substring(0,23)+'…':zs);vals.push(dr);cols.push(dr<0?'#e74c3c':'#1565C0');
  });
  var box=document.createElement('div');box.className='chart-box';
  box.innerHTML='<h4>Taux d\'abandon DTC1–DTC3 par ZS</h4><canvas id="drC" height="80"></canvas>';c.appendChild(box);
  setTimeout(function(){var ctx=document.getElementById('drC');if(!ctx)return;
    S.charts.dr=new Chart(ctx,{type:'bar',data:{labels:labs,datasets:[{label:'Dropout (%)',data:vals,backgroundColor:cols,borderRadius:3}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'%'}}}}});
  },100);

  var months=[...new Set(data.map(function(r){return r._YM;}))].sort();var lastM=months[months.length-1];
  var lastD=data.filter(function(r){return r._YM===lastM;});
  var xV=[],yV=[],txt=[],col=[];
  lastD.forEach(function(r){
    var v1=r.PCV13_1_0_11||0,v2=r.DTC1_0_11||0;if(!v2&&!v1)return;
    xV.push(v2);yV.push(v1);var pct=v2?((v1-v2)/v2*100):0;
    txt.push((r._ZS||'')+'<br>DTC1: '+v2+'<br>PCV13-1: '+v1+'<br>Var: '+pct.toFixed(1)+'%');
    col.push(Math.abs(pct)>10?'#e74c3c':'#1565C0');
  });
  if(xV.length){
    var sB=document.createElement('div');sB.className='chart-box';
    sB.innerHTML='<h4>Cohérence PCV13-1 vs DTC1 (±10%)</h4><div id="scP" style="height:350px"></div>';c.appendChild(sB);
    setTimeout(function(){var el=document.getElementById('scP');if(!el)return;var mx=Math.max.apply(null,xV.concat(yV).concat([10]));
      Plotly.newPlot(el,[{x:xV,y:yV,text:txt,type:'scatter',mode:'markers',marker:{size:8,color:col},hoverinfo:'text'},{x:[0,mx],y:[0,mx],type:'scatter',mode:'lines',line:{color:'black',dash:'dash'},showlegend:false}],{xaxis:{title:'DTC1'},yaxis:{title:'PCV13-1'},margin:{l:60,r:30,t:10,b:50},showlegend:false},{responsive:true});
    },200);
  }
}

/* ══════ PAGE 4 : VALEURS ATYPIQUES ══════ */
function renderP4(c){
  var data=S.filtered.zs;var months=[...new Set(data.map(function(r){return r._YM;}))].filter(Boolean).sort();
  var ags=['BCG','DTC1','DTC3','VAR1','VPO3'];var colors=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6'];
  var gP=groupBy(S.filtered.prov,function(r){return r._Province||'';});var provs=Object.keys(gP).filter(Boolean).sort();
  var ds=ags.map(function(ag,i){return{label:agL(ag),data:provs.map(function(p){return sumF(gP[p],AG_MAP[ag]);}),backgroundColor:colors[i],borderRadius:2};});
  var box=document.createElement('div');box.className='chart-box';
  box.innerHTML='<h4>Doses par province — antigènes clés</h4><canvas id="agP" height="80"></canvas>';c.appendChild(box);
  setTimeout(function(){var ctx=document.getElementById('agP');if(!ctx)return;
    S.charts.agP=new Chart(ctx,{type:'bar',data:{labels:provs.map(function(l){return l.length>20?l.substring(0,18)+'…':l;}),datasets:ds},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{x:{ticks:{maxRotation:45,font:{size:8}}}}}});
  },100);

  var tB=document.createElement('div');tB.className='chart-box';
  tB.innerHTML='<h4>Tendance mensuelle — antigènes clés</h4><canvas id="agT" height="60"></canvas>';c.appendChild(tB);
  setTimeout(function(){var ctx=document.getElementById('agT');if(!ctx)return;
    var ds2=ags.map(function(ag,i){return{label:agL(ag),data:months.map(function(m){return data.filter(function(r){return r._YM===m;}).reduce(function(a,r){return a+(r[AG_MAP[ag]]||0);},0);}),borderColor:colors[i],tension:.3,pointRadius:3,fill:false};});
    S.charts.agT=new Chart(ctx,{type:'line',data:{labels:months.map(moisLabel),datasets:ds2},options:{responsive:true,scales:{y:{beginAtZero:true,title:{display:true,text:'Doses'}}}}});
  },200);
}

/* ══════ PAGE 5 : SCORE QUALITÉ ══════ */
function renderP5(c){
  c.innerHTML='<div class="sub-tabs"><div class="sub-tab active" onclick="showST(0)">Par Province</div><div class="sub-tab" onclick="showST(1)">Par Antenne</div><div class="sub-tab" onclick="showST(2)">Par ZS</div></div><div id="scoreC"></div>';
  setTimeout(function(){showST(0);},50);
}
window.showST=function(idx){
  document.querySelectorAll('.sub-tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
  var sc=document.getElementById('scoreC');sc.innerHTML='';
  var data=[S.filtered.prov,S.filtered.zs,S.filtered.zs][idx];
  var kf=['_Province','_Antenne','_ZS'][idx];var lb=['Province','Antenne PEV','Zone de Santé'][idx];
  var g=groupBy(data,function(r){return r[kf]||'';});var units=Object.keys(g).filter(Boolean).sort();
  var h='<div class="data-table-wrap" style="max-height:550px;overflow-y:auto"><table class="data-table"><thead><tr><th>'+lb+'</th><th>Enreg.</th><th>Rapp.</th><th>%Rapp.</th><th>Compl.</th><th>Prompt.</th><th>DTC1</th><th>DTC3</th><th>Drop%</th><th>Score</th></tr></thead><tbody>';
  units.forEach(function(u){
    var d=g[u],tN=sumF(d,'n'),tR=sumF(d,'rap'),pR=tN?(tR/tN*100):0;
    var aC=avgF(d,'comp'),aP=avgF(d,'prompt');
    var d1=sumF(d,'DTC1_0_11'),d3=sumF(d,'DTC3_0_11'),dr=d1?((d1-d3)/d1*100):0;
    var sc=Math.round((pR>=90?20:pR>=70?12:4)+(aC>=90?20:aC>=70?12:4)+(dr>=0?20:0));
    var cl=sc>=50?'#27ae60':'#e74c3c';
    h+='<tr><td><b>'+u+'</b></td><td>'+tN+'</td><td>'+tR+'</td><td>'+pR.toFixed(1)+'%</td><td>'+aC.toFixed(1)+'%</td><td>'+aP.toFixed(1)+'%</td><td>'+d1+'</td><td>'+d3+'</td><td class="'+(dr<0?'cell-red':'')+'">'+dr.toFixed(1)+'%</td><td style="background:'+cl+';color:#fff;font-weight:700;text-align:center">'+sc+'</td></tr>';
  });
  h+='</tbody></table></div>';sc.innerHTML=h;
};

loadAll();
</script>
