<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Dashboard PEV de routine – RDC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <!-- Bibliothèques pour les exports PDF et PowerPoint -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            color: #333;
            font-size: 13px
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px
        }

        ::-webkit-scrollbar-thumb {
            background: #999;
            border-radius: 3px
        }

        .hdr {
            background: linear-gradient(135deg, #002b55 0%, #0b3a6f 45%, #1a5fa8 100%);
            color: #fff;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 1200;
            box-shadow: 0 3px 18px rgba(0, 0, 0, .22)
        }

        .hdr .logo {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .hdr .logo img {
            height: 52px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            background: transparent
        }

        .hdr .logo svg {
            height: 42px;
            width: 42px
        }

        .hdr h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: .4px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .2)
        }

        .ibtn {
            border: 2px solid rgba(255, 255, 255, .45);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-style: italic;
            font-size: 18px;
            color: #fff;
            transition: .2s
        }

        .ibtn:hover {
            background: rgba(255, 255, 255, .15)
        }

        .nav {
            background: linear-gradient(135deg, #0b3a6f, #0d4888);
            display: flex;
            padding-left: 16px;
            border-top: 1px solid rgba(255, 255, 255, .07);
            position: sticky;
            top: 60px;
            z-index: 1100;
            overflow: visible;
            -webkit-overflow-scrolling: touch
        }

        .mi {
            position: relative;
            padding: 13px 20px;
            color: rgba(255, 255, 255, .82);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: .2s;
            user-select: none
        }

        .mi:hover,
        .mi.act {
            color: #fff;
            background: rgba(255, 255, 255, .09);
            border-bottom-color: #64b5f6
        }

        .dd {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            min-width: 290px;
            box-shadow: 0 14px 42px rgba(0, 0, 0, .22);
            border-radius: 0 0 10px 10px;
            z-index: 9999;
            overflow: hidden;
            border: 1px solid #ddd
        }

        .dd .di {
            padding: 12px 18px;
            cursor: pointer;
            color: #333;
            font-size: 12.5px;
            font-weight: 500;
            border-bottom: 1px solid #f3f3f3;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .dd .di:last-child {
            border: none
        }

        .dd .di:hover {
            background: #e3f2fd;
            color: #0b3a6f;
            padding-left: 24px
        }

        .dd .di.as {
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            font-weight: 700
        }

        .mi:hover>.dd {
            display: block
        }

        .mi .dd {
            animation: fadeIn .15s ease
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .lb {
            background: linear-gradient(135deg, #e3ecf7, #d6e3f5);
            padding: 9px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #c5d4e8;
            font-size: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1000
        }

        .lb .st {
            font-weight: 700;
            min-width: 160px;
            color: #0b3a6f
        }

        .lb .pw {
            flex: 1;
            min-width: 180px;
            height: 6px;
            background: #c5d4e8;
            border-radius: 3px;
            overflow: hidden
        }

        .lb .pf {
            height: 100%;
            background: linear-gradient(90deg, #0b3a6f, #2196f3);
            border-radius: 3px;
            transition: width .4s
        }

        .lb .pt {
            font-size: 11px;
            color: #555;
            min-width: 100px
        }

        .fs {
            background: #fff;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            border-bottom: 2px solid #e3ecf7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .02);
            position: relative;
            z-index: 1000
        }

        .fg {
            position: relative
        }

        .fg label {
            display: block;
            font-size: 9.5px;
            font-weight: 700;
            color: #888;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .fg select {
            padding: 7px 10px;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            background: #fafbfc;
            font-size: 12px;
            font-weight: 600;
            min-width: 160px;
            cursor: pointer;
            outline: none;
            transition: .2s
        }

        .fg select:focus {
            border-color: #1565c0;
            background: #f0f4ff
        }

        .fbtn {
            padding: 7px 12px;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            background: #fafbfc;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            min-width: 140px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: .2s;
            gap: 6px
        }

        .fbtn:hover {
            border-color: #1565c0;
            background: #f0f4ff
        }

        .fbtn .cn {
            background: #0b3a6f;
            color: #fff;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 8px
        }

        .fd {
            display: block;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            min-width: 230px;
            max-height: 310px;
            overflow-y: auto;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .16);
            border-radius: 8px;
            z-index: 999;
            padding: 4px 0;
            border: 1px solid #ddd;
            margin-top: 2px
        }

        .fd.sh {
            display: block
        }

        .fd .sr {
            width: calc(100% - 14px);
            margin: 4px 7px 6px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 11px;
            outline: none
        }

        .fd .sr:focus {
            border-color: #1565c0
        }

        .fi {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: .12s
        }

        .fi:hover {
            background: #e3f2fd
        }

        .fi input[type=checkbox] {
            accent-color: #0b3a6f;
            width: 14px;
            height: 14px
        }

        .fa {
            border-bottom: 2px solid #e3ecf7;
            font-weight: 700;
            padding: 7px 12px;
            background: #fafbfc
        }

        .ct {
            padding: 18px 22px
        }

        .db {
            background: #fff;
            border-radius: 13px;
            padding: 22px;
            min-height: 480px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .05);
            border: 1px solid #e5e7eb
        }

        .kr {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .kc {
            flex: 1;
            min-width: 170px;
            background: #fff;
            border-radius: 13px;
            padding: 18px;
            box-shadow: 0 3px 16px rgba(0, 0, 0, .05);
            border-left: 5px solid #0b3a6f;
            text-align: center;
            transition: transform .2s, box-shadow .2s
        }

        .kc:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(0, 0, 0, .1)
        }

        .kc.gn {
            border-left-color: #27ae60
        }

        .kc.rd {
            border-left-color: #e74c3c
        }

        .kc.or {
            border-left-color: #f39c12
        }

        .kc.bl {
            border-left-color: #2196f3
        }

        .kc.pu {
            border-left-color: #9b59b6
        }

        .kv {
            font-size: 28px;
            font-weight: 800;
            color: #0b3a6f
        }

        .kl {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            margin-top: 4px
        }

        .cb {
            background: #fff;
            border-radius: 13px;
            padding: 18px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, .04);
            margin-bottom: 18px;
            border: 1px solid #eef1f5
        }

        .cb h4 {
            font-size: 14px;
            font-weight: 700;
            color: #0b3a6f;
            margin-bottom: 12px;
            padding-bottom: 9px;
            border-bottom: 2px solid #e3ecf7;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .cr {
            display: flex;
            gap: 16px;
            flex-wrap: wrap
        }

        .ch {
            flex: 1;
            min-width: 370px
        }

        .tw {
            overflow-x: auto;
            margin-bottom: 16px;
            border-radius: 9px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
            max-height: 480px;
            overflow-y: auto
        }

        .dt {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px
        }

        .dt thead {
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .dt th {
            padding: 10px 8px;
            text-align: left;
            font-weight: 700;
            white-space: nowrap;
            font-size: 10px
        }

        .dt td {
            padding: 7px 8px;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap
        }

        .dt tbody tr:hover {
            background: #f0f7ff
        }

        .dt tbody tr:nth-child(even) {
            background: #fafbfc
        }

        .cg {
            background: #d4edda !important;
            color: #155724
        }

        .crd {
            background: #fee2e2 !important;
            color: #991b1b
        }

        .cy {
            background: #fff3cd !important;
            color: #856404
        }

        .co {
            background: #ffe0b2 !important;
            color: #e65100
        }

        .tr {
            color: #e74c3c !important;
            font-weight: 700
        }

        .st {
            font-size: 15px;
            font-weight: 800;
            color: #0b3a6f;
            margin-bottom: 16px;
            padding: 13px 18px;
            background: linear-gradient(135deg, #e3ecf7, #dce8fa);
            border-radius: 11px;
            display: flex;
            align-items: center;
            gap: 9px;
            border-left: 5px solid #0b3a6f
        }

        .stt {
            display: flex;
            margin-bottom: 18px;
            border-bottom: 3px solid #0b3a6f;
            background: #fff;
            border-radius: 11px 11px 0 0;
            overflow-x: auto
        }

        .stb {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            color: #666;
            border-bottom: 4px solid transparent;
            white-space: nowrap;
            transition: .2s
        }

        .stb:hover {
            background: #e3f2fd;
            color: #0b3a6f
        }

        .stb.act {
            color: #0b3a6f;
            border-bottom-color: #0b3a6f;
            font-weight: 800;
            background: #f0f7ff
        }

        .pg {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 14px;
            margin-top: 10px
        }

        .pg button {
            padding: 9px 22px;
            border: none;
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .12)
        }

        .pg button:disabled {
            opacity: .3;
            cursor: not-allowed;
            box-shadow: none
        }

        .pg button:not(:disabled):hover {
            background: linear-gradient(135deg, #1565c0, #1976d2)
        }

        .pg span {
            font-size: 13px;
            font-weight: 700;
            color: #0b3a6f;
            background: #e3ecf7;
            padding: 7px 14px;
            border-radius: 18px
        }

        .lgb {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin: 8px 0;
            font-size: 11px
        }

        .lgi {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .lgd {
            width: 13px;
            height: 13px;
            border-radius: 2px;
            display: inline-block
        }

        .frst {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 1px 4px;
            color: #aaa;
            transition: .2s;
            margin-left: 6px;
            vertical-align: middle
        }

        .frst:hover {
            color: #e74c3c;
            transform: rotate(-90deg)
        }

        @media(max-width:900px) {
            .nav {
                flex-wrap: wrap
            }

            .ch {
                min-width: 100%
            }

            .kr {
                flex-direction: column
            }

            .hdr {
                padding: 0 10px
            }

            .hdr h1 {
                font-size: 15px
            }

            .fs {
                padding: 8px 10px
            }
        }

        /* ═══ PERFORMANCE & FLUIDITÉ ═══ */
        html {
            scroll-behavior: smooth
        }

        body {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility
        }

        * {
            will-change: auto;
            backface-visibility: hidden
        }

        .fd {
            transform: translateZ(0);
            transition: opacity .12s ease, transform .12s ease
        }

        .fd.sh {
            opacity: 1;
            transform: translateZ(0) translateY(0)
        }

        .fd:not(.sh) {
            opacity: 0;
            pointer-events: none;
            transform: translateZ(0) translateY(-4px)
        }

        .fi {
            transition: background .08s ease
        }

        .fbtn {
            transition: border-color .1s ease, background .1s ease
        }

        .dt {
            contain: layout style
        }

        .tw {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth
        }

        .cb {
            contain: content
        }

        canvas {
            image-rendering: auto
        }
    </style>
</head>

<body>
    <div class="hdr">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/MBOMBOmamu1993/pev-assets/main/PEV_RD_Congo_TRANSPARENT.png"
                alt="Logo PEV">
        </div>
        <h1>Dashboard PEV de routine – RDC</h1>
        <div class="ibtn" title="Info"><i>i</i></div>
    </div>
    <div class="nav" id="NAV"></div>
    <div class="lb" id="LB">
        <div class="st" id="LS">⏳ Initialisation...</div>
        <div class="pw">
            <div class="pf" id="PF" style="width:0%"></div>
        </div>
        <div class="pt" id="PT"></div>
    </div>
    <div class="fs" id="FS"></div>
    <div class="ct">
        <div class="db" id="DB">
            <div style="text-align:center;padding:70px;color:#888">
                <div style="font-size:48px;margin-bottom:14px">📊</div>
                <h3>Chargement...</h3>
            </div>
        </div>
        <div class="pg" id="PG" style="display:none"><button id="BP" onclick="chPg(-1)" disabled>◀
                Précédent</button><span id="PI">Page 1/5</span><button id="BN" onclick="chPg(1)">Suivant ▶</button>
        </div>
    </div>

    <script>
        /* ═══ CONFIGURATION ═══ */
        var C = {
            MA: 11, CT: 0.33, CD: 0.10,
            VAP_PROV: ['Kongo Central', 'Kwango', 'Kwilu', 'Maindombe', 'Equateur', 'Tshuapa', 'Mongala', 'Sud-Ubangi', 'Nord-Ubangi', 'Bas-Uele', 'Haut-Uele', 'Tshopo', 'Maniema', 'Lomami', 'Haut-Lomami', 'Kasai Central'],
            BR: [[90, 20], [80, 16], [70, 12], [60, 8], [50, 4], [0, 0]],
            BA: [[0, 20], [5.01, 16], [10.01, 12], [20.01, 8], [30.01, 4], [50.01, 0]]
        };

        var AG = ['BCG', 'VPO0', 'DTC1', 'VPO1', 'ROTA1', 'PCV13_1', 'DTC2', 'VPO2', 'ROTA2', 'PCV13_2',
            'DTC3', 'VPO3', 'VPI1', 'ROTA3', 'PCV13_3', 'VAR1', 'VPI2', 'VAA', 'VAR2', 'TD'];
        var AG_VAP = ['VAP1', 'VAP2', 'VAP3', 'VAP4'];
        var AG_ALL = AG.concat(AG_VAP);

        var AG_LBL = {
            BCG: 'BCG (0-11 mois)', VPO0: 'VPO0 (0-11 mois)', DTC1: 'DTC1/Penta1 (0-11 mois)', VPO1: 'VPO1 (0-11 mois)', ROTA1: 'ROTA1 (0-11 mois)',
            PCV13_1: 'PCV13-1 (0-11 mois)', DTC2: 'DTC2/Penta2 (0-11 mois)', VPO2: 'VPO2 (0-11 mois)', ROTA2: 'ROTA2 (0-11 mois)', PCV13_2: 'PCV13-2 (0-11 mois)',
            DTC3: 'DTC3/Penta3 (0-11 mois)', VPO3: 'VPO3 (0-11 mois)', VPI1: 'VPI1 (0-11 mois)', ROTA3: 'ROTA3 (0-11 mois)', PCV13_3: 'PCV13-3 (0-11 mois)',
            VAR1: 'VAR1 (0-11 mois)', VPI2: 'VPI2 (0-11 mois)', VAA: 'VAA (0-11 mois)', VAR2: 'VAR2 (12-23 mois)', TD: 'Td 2+',
            VAP1: 'VAP1 (0-11 mois)', VAP2: 'VAP2 (0-11 mois)', VAP3: 'VAP3 (0-11 mois)', VAP4: 'VAP4 (15 mois)'
        };

        var AG_FIELD_MAP = {
            BCG: 'BCG_0_11', VPO0: 'VPO0_0_11', DTC1: 'DTC1_0_11', VPO1: 'VPO1_0_11',
            ROTA1: 'ROTA1_0_11', PCV13_1: 'PCV13_1_0_11', DTC2: 'DTC2_0_11', VPO2: 'VPO2_0_11',
            ROTA2: 'ROTA2_0_11', PCV13_2: 'PCV13_2_0_11', DTC3: 'DTC3_0_11', VPO3: 'VPO3_0_11',
            VPI1: 'VPI1_0_11', ROTA3: 'ROTA3_0_11', PCV13_3: 'PCV13_3_0_11',
            VAR1: 'VAR1_0_11', VPI2: 'VPI2_0_11', VAA: 'VAA_0_11', VAR2: 'VAR2_12_23',
            TD: 'Td_2_plus',
            VAP1: 'VAP1_0_11', VAP2: 'VAP2_0_11', VAP3: 'VAP3_0_11', VAP4: 'VAP4_12_23'
        };

        var SAME_AGE = [
            { age: 'Naissance', v: ['BCG', 'VPO0'] },
            { age: '6 semaines', v: ['DTC1', 'VPO1', 'ROTA1', 'PCV13_1'] },
            { age: '10 semaines', v: ['DTC2', 'VPO2', 'ROTA2', 'PCV13_2'] },
            { age: '14 semaines', v: ['DTC3', 'VPO3', 'VPI1', 'ROTA3', 'PCV13_3'] },
            { age: '9 mois', v: ['VAR1', 'VPI2', 'VAA'] }
        ];
    var VACCIN_CALENDAR = [
        { age: 'Naissance', ags: ['BCG', 'VPO0'] },
        { age: '6 semaines', ags: ['DTC1', 'VPO1', 'ROTA1', 'PCV13_1'] },
        { age: '10 semaines', ags: ['DTC2', 'VPO2', 'ROTA2', 'PCV13_2'] },
        { age: '14 semaines', ags: ['DTC3', 'VPO3', 'VPI1', 'ROTA3', 'PCV13_3'] },
        { age: '6 mois', ags: ['VAP1'] },
        { age: '7 mois', ags: ['VAP2'] },
        { age: '8 mois', ags: ['VAP3'] },
        { age: '9 mois', ags: ['VAR1', 'VPI2', 'VAA'] },
        { age: '15 mois', ags: ['VAR2', 'VAP4'] }
    ];

    var LOGIST_FIELDS = [
            { lbl: 'Vaccin BCG', pfx: 'BCG', unit: 'Dose 20 d/fl.', vacs: ['BCG'] },
            { lbl: 'Vaccin VPO', pfx: 'VPO', unit: 'Dose 20 d/fl.', vacs: ['VPO0', 'VPO1', 'VPO2', 'VPO3'] },
            { lbl: 'Vaccin DTC/Penta', pfx: 'DTC', unit: 'Dose 10 d/fl.', vacs: ['DTC1', 'DTC2', 'DTC3'] },
            { lbl: 'Vaccin VPI', pfx: 'VPI', unit: 'Dose 5 d/fl.', vacs: ['VPI1', 'VPI2'] },

            h += '</tr></thead><tbody>';

            LOGIST_FIELDS.forEach(function (item, idx) {
                var p = item.pfx;
                var stk = sf(D, p + '_stock_d_but');
                var rcv = sf(D, p + '_re_ues');
                var used = sf(D, p + '_utilis_es');
                var admin = item.vacs ? item.vacs.reduce(function (s, v) { return s + sf(D, v); }, 0) : sf(D, p + '_administr_es');
                var perdu = sf(D, p + '_pertes');
                var denom = (admin || 0) + (perdu || 0);
                var txPerte = denom > 0 ? (perdu / denom * 100) : 0;
                var jrs = sf(D, p + '_jours_rupture');
                var sdu = sf(D, p + '_stock_fin');

                var bg = idx % 2 === 0 ? '#fff' : '#f8fafc';
                h += '<tr style="background:' + bg + '">';
                h += '<td style="text-align:center;font-weight:600">' + (idx + 1) + '</td>';
                h += '<td style="position:sticky;left:0;z-index:1;background:' + bg + ';font-weight:600;white-space:nowrap">' + item.lbl + '</td>';
                h += '<td style="font-size:10px;color:#666">' + item.unit + '</td>';
                h += '<td style="text-align:right;font-variant-numeric:tabular-nums">' + (stk ? stk.toLocaleString() : '\u2014') + '</td>';
                h += '<td style="text-align:right;font-variant-numeric:tabular-nums">' + (rcv ? rcv.toLocaleString() : '\u2014') + '</td>';
                h += '<td style="text-align:right;font-variant-numeric:tabular-nums">' + (used ? used.toLocaleString() : '\u2014') + '</td>';
                h += '<td style="text-align:right;font-variant-numeric:tabular-nums">' + (admin ? admin.toLocaleString() : '\u2014') + '</td>';
                h += '<td style="text-align:right;font-variant-numeric:tabular-nums">' + (perdu ? perdu.toLocaleString() : '\u2014') + '</td>';
                var txCol = txPerte > 5 ? '#e74c3c' : txPerte > 2 ? '#f39c12' : '#27ae60';
                h += '<td style="text-align:right;font-weight:600;color:' + txCol + '">' + txPerte.toFixed(1) + '%</td>';
                var jrCol = jrs > 0 ? '#e74c3c' : '#27ae60';
                h += '<td style="text-align:right;color:' + jrCol + ';font-weight:600">' + (jrs ? jrs.toLocaleString() : '0') + '</td>';
                h += '<td style="text-align:right;font-variant-numeric:tabular-nums">' + (sdu ? sdu.toLocaleString() : '\u2014') + '</td>';
                h += '</tr>';
            });

            h += '</tbody></table></div>';
            repBox.innerHTML += h;
            c.appendChild(repBox);
        }
        /* ═══ START ═══ */
        loadAll();
    </script>
</body>

</html>
