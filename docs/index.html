<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard PEV – RDC</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#0b3a6f;--pri2:#1565C0;--bg:#f5f7fa;--card:#fff;--bord:#e5e7eb;--green:#27ae60;--red:#e74c3c;--orange:#f39c12;--blue:#2196F3}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:#333;font-size:13px}

/* ── Header ── */
.top-header{background:linear-gradient(135deg,#0b3a6f,#1a5fa8);color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 2px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:1100}
.logo{display:flex;align-items:center;font-weight:bold;font-size:13px;gap:8px}
.logo img{height:32px;border-radius:4px}
.title-block{text-align:center}
.title{font-size:18px;font-weight:800;letter-spacing:.5px}
.gen-info{font-size:10px;opacity:.8;margin-top:1px}
.info-btn{border:2px solid rgba(255,255,255,.5);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-style:italic;font-size:16px;transition:.2s}
.info-btn:hover{background:rgba(255,255,255,.2)}

/* ── Navbar ── */
.navbar{background:linear-gradient(135deg,#0b3a6f,#0e4a8a);display:flex;padding-left:16px;border-top:1px solid rgba(255,255,255,.1);box-shadow:0 2px 8px rgba(0,0,0,.1);position:sticky;top:56px;z-index:1050;flex-wrap:wrap}
.nav-item{position:relative;padding:12px 18px;color:#fff;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:.25s;border-bottom:3px solid transparent}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.1);border-bottom-color:#4ea1ff}
.dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:280px;box-shadow:0 12px 32px rgba(0,0,0,.2);border-radius:0 0 10px 10px;z-index:2000;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.dropdown div{padding:11px 16px;cursor:pointer;color:#333;font-size:13px;font-weight:500;border-bottom:1px solid #f0f0f0;transition:.2s}
.dropdown div:last-child{border-bottom:none}
.dropdown div:hover{background:#e8f0fe;color:var(--pri);padding-left:20px}
.dropdown div.active-sub{background:linear-gradient(135deg,#0b3a6f,#1565C0);color:#fff;font-weight:700}
.nav-item:hover .dropdown{display:block}

/* ── Loading ── */
.load-bar{background:#e8f0fe;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d0d5dd;font-size:12px;flex-wrap:wrap}
.load-bar .status{font-weight:700;min-width:200px}
.prog-wrap{flex:1;min-width:200px;height:7px;background:#ddd;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.prog-text{font-size:11px;color:#666;min-width:120px}

/* ── Filters ── */
.filters{background:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border-bottom:2px solid #e8f0fe;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.f-group{position:relative}
.f-group label{display:block;font-size:10px;font-weight:700;color:#666;margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.f-btn{padding:7px 12px;border:2px solid #d1d5db;border-radius:8px;background:#fafbfc;cursor:pointer;font-size:12px;font-weight:600;min-width:130px;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.f-btn:hover{border-color:var(--pri);background:#f0f4ff}
.f-dd{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:220px;max-height:280px;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.15);border-radius:10px;z-index:999;padding:4px 0;border:1px solid #e5e7eb}
.f-dd.show{display:block}
.fd-i{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.1s}
.fd-i:hover{background:#e8f0fe}
.fd-i input{accent-color:var(--pri)}
.fd-all{border-bottom:1px solid #eee;font-weight:600;padding:6px 12px}

/* ── Content ── */
.container{padding:18px}
.dashboard{background:#fff;border-radius:12px;padding:18px;min-height:400px;box-shadow:0 4px 16px rgba(0,0,0,.06);border:1px solid var(--bord);animation:fadeIn .3s ease-out}

/* ── KPI ── */
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpi{flex:1;min-width:155px;background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 4px 16px rgba(0,0,0,.06);border-left:5px solid var(--pri);text-align:center;transition:.2s;border:1px solid #f0f0f0}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.kpi.green{border-left-color:var(--green)}.kpi.red{border-left-color:var(--red)}.kpi.orange{border-left-color:var(--orange)}.kpi.blue{border-left-color:var(--blue)}
.kpi .val{font-size:26px;font-weight:800;color:var(--pri)}
.kpi .lbl{font-size:11px;font-weight:600;color:#555;margin-top:3px}

/* ── Charts ── */
.box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:16px;border:1px solid #eef1f5;transition:.2s}
.box:hover{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.box h4{font-size:14px;font-weight:700;color:var(--pri);margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #e8f0fe}
.row2{display:flex;gap:14px;flex-wrap:wrap}
.half{flex:1;min-width:380px}

/* ── Tables ── */
.tw{overflow-x:auto;margin-bottom:16px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt thead{background:linear-gradient(135deg,#0b3a6f,#1565C0);color:#fff;position:sticky;top:0}
.dt th{padding:9px 10px;text-align:left;font-weight:700;white-space:nowrap;font-size:11px}
.dt td{padding:7px 9px;border-bottom:1px solid #eee}
.dt tbody tr:hover{background:#f0f7ff}
.cg{background:#d1fae5!important;color:#065f46}
.cr{background:#fee2e2!important;color:#991b1b}
.cy{background:#fef3c7!important;color:#92400e}

/* ── Section title ── */
.sec{font-size:15px;font-weight:800;color:var(--pri);margin-bottom:14px;padding:11px 16px;background:linear-gradient(135deg,#e8f0fe,#dce8fa);border-radius:10px;display:flex;align-items:center;gap:8px;border-left:4px solid var(--pri)}

/* ── Pagination ── */
.pagi{display:flex;justify-content:center;align-items:center;gap:16px;padding:12px;margin-top:8px}
.pagi button{padding:8px 18px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;box-shadow:0 2px 6px rgba(11,58,111,.2)}
.pagi button:disabled{opacity:.35;cursor:not-allowed}
.pagi button:not(:disabled):hover{background:var(--pri2);transform:translateY(-1px)}
.pagi span{font-size:12px;font-weight:600}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.navbar{flex-wrap:wrap}.half{min-width:100%}.kpi-row{flex-direction:column}}
</style>
</head>
<body>

<div class="top-header">
  <div class="logo">🏥 PEV – RDC</div>
  <div class="title-block">
    <div class="title">Dashboard PEV de routine</div>
    <div class="gen-info" id="genInfo"></div>
  </div>
  <div class="info-btn" title="Information">i</div>
</div>

<div class="navbar" id="mainNav">
  <div class="nav-item active" id="navOQD">
    Outil de qualité ▼
    <div class="dropdown" id="ddOQD">
      <div class="active-sub" onclick="goOQD(0)">1. Complétude et Promptitude</div>
      <div onclick="goOQD(1)">2. Cohérence-temps</div>
      <div onclick="goOQD(2)">3. Cohérence-donnée</div>
      <div onclick="goOQD(3)">4. Valeurs atypiques</div>
      <div onclick="goOQD(4)">5. Score qualité</div>
    </div>
  </div>
  <div class="nav-item" onclick="loadTab('zs')">Zone de Santé</div>
  <div class="nav-item" onclick="loadTab('nat')">National</div>
  <div class="nav-item" onclick="loadTab('apercu')">Aperçu général</div>
</div>

<div class="load-bar" id="loadBar">
  <div class="status" id="loadSt">⏳ Chargement…</div>
  <div class="prog-wrap"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
  <div class="prog-text" id="pText"></div>
</div>

<div class="filters" id="filterSec"></div>

<div class="container">
  <div class="dashboard" id="dash"></div>
  <div class="pagi" id="pagi" style="display:none">
    <button id="bPrev" onclick="chPage(-1)" disabled>◀ Précédent</button>
    <span id="pInfo"></span>
    <button id="bNext" onclick="chPage(1)">Suivant ▶</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DASHBOARD PEV – RDC  v9.0
   Champs réels: _Province, _Antenne, _YM
   n, rap, comp, prompt
   BCG_0_11, DTC1_0_11 … VAA_0_11
   ═══════════════════════════════════════════ */

var B='./data/dashboard';

/* ── ANTIGÈNES EXACTS ── */
var AG=[
  'BCG_0_11','DTC1_0_11','DTC2_0_11','DTC3_0_11',
  'VPO0_0_11','VPO1_0_11','VPO2_0_11','VPO3_0_11',
  'VPI1_0_11','VPI2_0_11',
  'ROTA1_0_11','ROTA2_0_11','ROTA3_0_11',
  'PCV13_1_0_11','PCV13_2_0_11','PCV13_3_0_11',
  'VAR1_0_11','VAR2_0_11','VAA_0_11'
];

/* Display names */
var NOM={
  BCG_0_11:'BCG',
  DTC1_0_11:'DTC1',DTC2_0_11:'DTC2',DTC3_0_11:'DTC3',
  VPO0_0_11:'VPO0',VPO1_0_11:'VPO1',VPO2_0_11:'VPO2',VPO3_0_11:'VPO3',
  VPI1_0_11:'VPI1',VPI2_0_11:'VPI2',
  ROTA1_0_11:'ROTA1',ROTA2_0_11:'ROTA2',ROTA3_0_11:'ROTA3',
  PCV13_1_0_11:'PCV13-1',PCV13_2_0_11:'PCV13-2',PCV13_3_0_11:'PCV13-3',
  VAR1_0_11:'VAR1',VAR2_0_11:'VAR2',VAA_0_11:'VAA'
};
function nm(f){return NOM[f]||f;}

/* Key antigens for summary charts */
var KEY_AG=['BCG_0_11','DTC1_0_11','DTC3_0_11','VPO3_0_11','VPI1_0_11','VAR1_0_11','ROTA1_0_11','PCV13_1_0_11'];
var COLORS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1565C0','#e67e22','#00897B'];

/* Same-age groups */
var SAME_AGE={
  'Naissance':['BCG_0_11','VPO0_0_11'],
  '6 sem':['DTC1_0_11','VPO1_0_11','ROTA1_0_11','PCV13_1_0_11'],
  '10 sem':['DTC2_0_11','VPO2_0_11','ROTA2_0_11','PCV13_2_0_11'],
  '14 sem':['DTC3_0_11','VPO3_0_11','VPI1_0_11','ROTA3_0_11','PCV13_3_0_11'],
  '9 mois':['VAR1_0_11','VPI2_0_11','VAA_0_11']
};

/* Dropout: DTC1 → DTC3 */
var D1='DTC1_0_11', D3='DTC3_0_11';

/* ── State ── */
var S={tab:'oqd',pg:0,tp:5,byP:[],byZ:[],meta:null,fP:[],fZ:[],charts:{},fl:{},av:{},ok:false};

/* ── Utils ── */
function v(r,f){var x=r[f];return typeof x==='number'?x:(parseFloat(x)||0);}
function s(r,f){return(r[f]||'').toString().trim();}
function prov(r){return s(r,'_Province');}
function ant(r){return s(r,'_Antenne');}
function ym(r){return s(r,'_YM');}
function zs(r){return s(r,'_ZS')||s(r,'_Antenne');}
function fmt(n){return n?n.toLocaleString('fr-FR'):'0';}
function pct(n){return n!=null?n.toFixed(1)+'%':'—';}
function mL(y){if(!y)return'';var n=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];var m=parseInt(y.substring(4,6),10);return n[(m-1)%12]+' '+y.substring(0,4);}
function sum(rows,f){return rows.reduce(function(a,r){return a+v(r,f);},0);}
function totD(rows){var t=0;AG.forEach(function(a){t+=sum(rows,a);});return t;}
function grp(arr,fn){var g={};arr.forEach(function(r){var k=typeof fn==='function'?fn(r):s(r,fn);if(!k)k='?';if(!g[k])g[k]=[];g[k].push(r);});return g;}
function dropout(d1,d3){return d1>0?((d1-d3)/d1)*100:null;}
function setP(p,t,st){document.getElementById('pFill').style.width=p+'%';if(t)document.getElementById('pText').textContent=t;if(st)document.getElementById('loadSt').textContent=st;}
function avg(arr){if(!arr.length)return 0;return arr.reduce(function(a,b){return a+b;},0)/arr.length;}

function movAvg(data,orgFn,orgVal,ag,curYM,n){
  var pts=data.filter(function(r){return orgFn(r)===orgVal;}).map(function(r){return{m:ym(r),val:v(r,ag)};}).filter(function(x){return x.m<curYM;}).sort(function(a,b){return b.m.localeCompare(a.m);}).slice(0,n);
  if(!pts.length)return null;
  return pts.reduce(function(a,x){return a+x.val;},0)/pts.length;
}

/* ── Load data ── */
async function init(){
  var t0=Date.now();
  setP(5,'','⏳ Chargement…');
  try{
    setP(10,'meta.json…');
    var mR=await fetch(B+'/meta.json?t='+Date.now());
    setP(25,'by_province.json…');
    var pR=await fetch(B+'/by_province.json?t='+Date.now());
    setP(50,'by_zs.json…');
    var zR=await fetch(B+'/by_zs.json?t='+Date.now());
    if(!mR.ok)throw new Error('meta.json: '+mR.status);
    if(!pR.ok)throw new Error('by_province.json: '+pR.status);
    if(!zR.ok)throw new Error('by_zs.json: '+zR.status);

    setP(70,'Parsing…');
    S.meta=await mR.json();
    S.byP=await pR.json();
    S.byZ=await zR.json();

    /* Check by_zs — if empty or has no _ZS, use byP with _Antenne as ZS proxy */
    if(!S.byZ.length||!S.byZ[0]._ZS){
      console.log('ℹ️ by_zs vide ou sans _ZS — utilisation de by_province avec _Antenne comme ZS');
      S.byZ=S.byP;
    }

    console.log('📋 Sample byP:',S.byP[0]);
    console.log('📋 Sample byZ:',S.byZ[0]);
    console.log('📋 Keys byP:',Object.keys(S.byP[0]));

    if(S.meta.generated_at) document.getElementById('genInfo').textContent='Données: '+S.meta.generated_at;

    setP(80,'Filtres…');
    var provs=new Set(),ants=new Set(),periods=new Set();
    S.byP.forEach(function(r){provs.add(prov(r));ants.add(ant(r));periods.add(ym(r));});

    S.av={province:[...provs].filter(Boolean).sort(),antenne:[...ants].filter(Boolean).sort(),period:[...periods].filter(Boolean).sort()};
    S.fl={province:S.av.province.slice(),antenne:S.av.antenne.slice(),period:S.av.period.slice()};

    S.ok=true;
    applyF(); renderF(); render();
    var dt=((Date.now()-t0)/1000).toFixed(1);
    setP(100,fmt(S.byP.length)+' lig. Prov | '+fmt(S.byZ.length)+' lig. ZS | '+S.av.period.length+' mois | '+S.av.province.length+' prov','✅ Prêt en '+dt+'s');
  }catch(e){
    console.error('❌',e);
    setP(0,'','❌ '+e.message);
    document.getElementById('dash').innerHTML='<div style="text-align:center;padding:60px;color:#e74c3c"><h3>❌ Erreur</h3><p>'+e.message+'</p></div>';
  }
}

/* ── Filters ── */
function applyF(){
  var f=S.fl;
  S.fP=S.byP.filter(function(r){
    if(f.province.indexOf(prov(r))<0)return false;
    if(f.antenne.indexOf(ant(r))<0)return false;
    if(f.period.indexOf(ym(r))<0)return false;
    return true;
  });
  S.fZ=S.byZ.filter(function(r){
    if(f.province.indexOf(prov(r))<0)return false;
    if(f.period.indexOf(ym(r))<0)return false;
    return true;
  });
}

function renderF(){
  var c=document.getElementById('filterSec');c.innerHTML='';
  var dims=[['province','Province',S.av.province],['antenne','Antenne',S.av.antenne],['period','Période',S.av.period]];
  dims.forEach(function(d){
    var key=d[0],label=d[1],all=d[2],sel=S.fl[key];
    var g=document.createElement('div');g.className='f-group';
    var lb=document.createElement('label');lb.textContent=label;g.appendChild(lb);
    var btn=document.createElement('button');btn.className='f-btn';
    btn.innerHTML='<span>'+(sel.length===all.length?'Tout ('+all.length+')':sel.length+'/'+all.length)+'</span><span>▼</span>';
    btn.onclick=function(){toggleDD(key);};g.appendChild(btn);
    var dd=document.createElement('div');dd.className='f-dd';dd.id='dd-'+key;
    /* Select all */
    var aDiv=document.createElement('div');aDiv.className='fd-i fd-all';
    var aCb=document.createElement('input');aCb.type='checkbox';aCb.checked=sel.length===all.length;
    aCb.onchange=function(){S.fl[key]=aCb.checked?all.slice():[];applyF();renderF();render();};
    aDiv.appendChild(aCb);var sp=document.createElement('span');sp.textContent='Tout';aDiv.appendChild(sp);dd.appendChild(aDiv);
    all.forEach(function(val){
      var item=document.createElement('div');item.className='fd-i';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=sel.indexOf(val)>=0;
      cb.onchange=function(){
        if(cb.checked&&sel.indexOf(val)<0)S.fl[key].push(val);
        if(!cb.checked)S.fl[key]=S.fl[key].filter(function(x){return x!==val;});
        applyF();renderF();render();
      };
      item.appendChild(cb);
      var s2=document.createElement('span');s2.textContent=(key==='period'?mL(val):val);item.appendChild(s2);
      dd.appendChild(item);
    });
    g.appendChild(dd);c.appendChild(g);
  });
}
function toggleDD(k){var d=document.getElementById('dd-'+k);document.querySelectorAll('.f-dd').forEach(function(e){if(e.id!=='dd-'+k)e.classList.remove('show');});d.classList.toggle('show');}
document.addEventListener('click',function(e){if(!e.target.closest('.f-group'))document.querySelectorAll('.f-dd').forEach(function(e){e.classList.remove('show');});});

/* ── Navigation ── */
function goOQD(i){
  S.tab='oqd';S.pg=i;S.tp=5;
  document.querySelectorAll('.nav-item').forEach(function(e){e.classList.remove('active');});
  document.getElementById('navOQD').classList.add('active');
  document.getElementById('ddOQD').querySelectorAll('div').forEach(function(e,j){e.classList.toggle('active-sub',j===i);});
  if(S.ok){applyF();renderF();render();}window.scrollTo({top:0});
}
function loadTab(t){
  S.tab=t;S.pg=0;S.tp=1;
  document.querySelectorAll('.nav-item').forEach(function(e){e.classList.remove('active');});
  if(S.ok){applyF();renderF();render();}window.scrollTo({top:0});
}
function chPage(d){var n=S.pg+d;if(n>=0&&n<S.tp){S.pg=n;goOQD(n);}}
function render(){
  Object.values(S.charts).forEach(function(c){try{c.destroy();}catch(e){}});S.charts={};
  var d=document.getElementById('dash');d.innerHTML='';
  if(S.tab==='oqd'){S.tp=5;PAGES[S.pg].fn(d);}
  else if(S.tab==='zs')tabZS(d);
  else if(S.tab==='nat')tabNat(d);
  else if(S.tab==='apercu')tabApercu(d);
  updPagi();
}
function updPagi(){
  var b=document.getElementById('pagi');
  if(S.tp<=1){b.style.display='none';return;}
  b.style.display='flex';
  document.getElementById('pInfo').textContent='Page '+(S.pg+1)+' / '+S.tp;
  document.getElementById('bPrev').disabled=S.pg===0;
  document.getElementById('bNext').disabled=S.pg>=S.tp-1;
}

var PAGES=[
  {fn:p1_completude},
  {fn:p2_coherenceTemps},
  {fn:p3_coherenceDonnee},
  {fn:p4_atypiques},
  {fn:p5_score}
];

/* ═══════════════════════════════════════
   P1 : COMPLÉTUDE ET PROMPTITUDE
   ═══════════════════════════════════════ */
function p1_completude(d){
  sec(d,'📊','1. Complétude et Promptitude');
  var data=S.fP;
  var tN=sum(data,'n'),tR=sum(data,'rap'),tD=totD(data);
  var avgComp=avg(data.map(function(r){return v(r,'comp');}));
  var avgPr=avg(data.map(function(r){return v(r,'prompt');}));
  var nProv=new Set(data.map(prov)).size;

  d.innerHTML+=kpiRow([
    kpi(pct(avgComp),'Complétude moyenne','green'),
    kpi(pct(avgPr),'Promptitude moyenne','orange'),

function alertsTable(d,data,orgFn){
  var months=[...new Set(data.map(ym))].sort();

  var rows=[];
  oL.forEach(function(ou){
    AG.forEach(function(ag){
      months.forEach(function(m){
        var recs=gO[ou].filter(function(r){return ym(r)===m;});if(!recs.length)return;
        var val=recs.reduce(function(a,r){return a+v(r,ag);},0);
        var ma=movAvg(data,orgFn,ou,ag,m,11);
        if(!ma||ma===0)return;var pv=((val-ma)/ma)*100;
        if(Math.abs(pv)<=33)return;
        rows.push({org:ou,prov:prov(recs[0]),ag:ag,per:mL(m),val:val,ma:ma.toFixed(0),pv:pv.toFixed(1),pri:Math.abs(pv)>=50?'P1':'P2'});
      });
    });
  });

  });
  h+='</tbody></table></div>';bx.innerHTML+=h;d.appendChild(bx);
}

function sameAgeTable(d,data){
  var gO=grp(data,ant);var months=[...new Set(data.map(ym))].sort();
  var ages=Object.keys(SAME_AGE);
  var bx=document.createElement('div');bx.className='box';
  bx.innerHTML='<h4>Vaccins au même âge – Cohérence (±10%)</h4>';
  var h='<div class="tw" style="max-height:500px;overflow-y:auto"><table class="dt"><thead><tr><th>Antenne</th><th>Mois</th>';
  ages.forEach(function(a){h+='<th colspan="2">'+a+'</th>';});
  h+='<th>OK?</th></tr></thead><tbody>';

  Object.keys(gO).filter(function(k){return k!=='?';}).sort().forEach(function(ou){
    months.forEach(function(m){
      var recs=gO[ou].filter(function(r){return ym(r)===m;});if(!recs.length)return;
      var maxV=0;
      var row='<tr><td>'+(ou.length>20?ou.substring(0,18)+'…':ou)+'</td><td>'+mL(m)+'</td>';
      ages.forEach(function(age){
        var ags=SAME_AGE[age];
        var vals=ags.map(function(ag){return{n:nm(ag),v:recs.reduce(function(a,r){return a+v(r,ag);},0)};});
        var vStr=vals.map(function(x){return x.n+':'+x.v;}).join(', ');
        var mx=Math.max.apply(null,vals.map(function(x){return x.v;}));
        var mn=Math.min.apply(null,vals.map(function(x){return x.v;}));
        var pc=mx>0?((mx-mn)/mx*100):0;
        if(pc>maxV)maxV=pc;
        var cls=pc>10?'cr':'cg';
        row+='<td style="font-size:9px">'+vStr+'</td><td class="'+cls+'">'+pc.toFixed(0)+'%</td>';
      });
      row+='<td class="'+(maxV<=10?'cg':'cr')+'">'+(maxV<=10?'✓':'✗')+'</td></tr>';
      h+=row;
    });
  });
  h+='</tbody></table></div>';bx.innerHTML+=h;d.appendChild(bx);
}

function dropoutChart(d,data){
  var gO=grp(data,ant);var labs=[],vals=[],cols=[];
  Object.keys(gO).filter(function(k){return k!=='?';}).sort().forEach(function(ou){
    var recs=gO[ou];var d1=sum(recs,D1),d3=sum(recs,D3);
    var dr=dropout(d1,d3);if(dr===null)return;
    labs.push(ou.length>25?ou.substring(0,23)+'…':ou);vals.push(dr);cols.push(dr<0?'#e74c3c':dr>10?'#f39c12':'#27ae60');
  });
  var bx=document.createElement('div');bx.className='box';
  bx.innerHTML='<h4>Taux d\'abandon DTC1 → DTC3 (%)</h4><canvas id="dropC" height="'+(Math.max(80,labs.length*3))+'"></canvas>';
  d.appendChild(bx);
  after(function(){var ctx=document.getElementById('dropC');if(!ctx)return;
    S.charts.dr=new Chart(ctx,{type:'bar',data:{labels:labs,datasets:[{label:'Dropout %',data:vals,backgroundColor:cols,borderRadius:3}]},
      options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'%'}}}}});
  },200);
}

/* ═══════════════════════════════════════
   P4 : VALEURS ATYPIQUES
   ═══════════════════════════════════════ */
function p4_atypiques(d){
  sec(d,'⚠️','4. Valeurs atypiques (moy ± 2σ)');
  var data=S.fP;var gO=grp(data,ant);
  var months=[...new Set(data.map(ym))].sort();
  var oL=Object.keys(gO).filter(function(k){return k!=='?';});
  var rows=[];
  oL.forEach(function(ou){
    AG.forEach(function(ag){
      var allV=gO[ou].map(function(r){return{m:ym(r),val:v(r,ag)};});
      if(allV.length<3)return;
      var mean=avg(allV.map(function(x){return x.val;}));
      var sd=Math.sqrt(allV.reduce(function(a,x){return a+Math.pow(x.val-mean,2);},0)/allV.length);
      if(sd===0)return;
      allV.forEach(function(x){
        if(x.val<mean-2*sd||x.val>mean+2*sd)
          rows.push({org:ou,prov:prov(gO[ou][0]),ag:ag,per:mL(x.m),val:x.val,mean:mean.toFixed(0),sd:sd.toFixed(0),lo:(mean-2*sd).toFixed(0),hi:(mean+2*sd).toFixed(0),type:x.val>mean?'Sup':'Inf'});
      });
    });
  });

  var bx=document.createElement('div');bx.className='box';
  bx.innerHTML='<h4>'+rows.length+' valeurs atypiques détectées</h4>';
  var h='<div class="tw" style="max-height:450px;overflow-y:auto"><table class="dt"><thead><tr><th>Prov</th><th>Antenne</th><th>Antigène</th><th>Période</th><th>Valeur</th><th>Moy</th><th>σ</th><th>[Min</th><th>Max]</th><th>Type</th></tr></thead><tbody>';
  rows.slice(0,400).forEach(function(r){
    h+='<tr><td>'+r.prov+'</td><td>'+r.org+'</td><td>'+nm(r.ag)+'</td><td>'+r.per+'</td><td class="cr">'+r.val+'</td><td>'+r.mean+'</td><td>'+r.sd+'</td><td>'+r.lo+'</td><td>'+r.hi+'</td><td>'+r.type+'</td></tr>';
  });
  h+='</tbody></table></div>';bx.innerHTML+=h;d.appendChild(bx);

  /* Trend chart */
  var byM={};months.forEach(function(m){byM[m]=0;});
  rows.forEach(function(r){/* count per month approx */});
  /* Simpler: count outliers per month */
  var outM={};months.forEach(function(m){outM[m]=0;});
  oL.forEach(function(ou){AG.forEach(function(ag){
    var allV=gO[ou].map(function(r){return{m:ym(r),val:v(r,ag)};});if(allV.length<3)return;
    var mean=avg(allV.map(function(x){return x.val;}));
    var sd2=Math.sqrt(allV.reduce(function(a,x){return a+Math.pow(x.val-mean,2);},0)/allV.length);
    if(sd2===0)return;
    allV.forEach(function(x){if(x.val<mean-2*sd2||x.val>mean+2*sd2){if(outM[x.m]!==undefined)outM[x.m]++;}});
  });});

  box(d,'outTr','Tendance mensuelle des valeurs atypiques','canvas');
  after(function(){var ctx=document.getElementById('outTr');if(!ctx)return;
    S.charts.oT=new Chart(ctx,{type:'bar',data:{labels:months.map(mL),datasets:[{label:'Outliers',data:months.map(function(m){return outM[m];}),backgroundColor:'#e74c3c',borderRadius:3}]},
      options:{responsive:true,scales:{y:{beginAtZero:true}}}});
  },300);
}

/* ═══════════════════════════════════════
   P5 : SCORE QUALITÉ
   ═══════════════════════════════════════ */
function p5_score(d){
  sec(d,'🏆','5. Score qualité des données');
  var data=S.fP;var gP=grp(data,prov);
  var pL=Object.keys(gP).filter(function(k){return k!=='?';}).sort();

  /* Score = Complétude(30) + Promptitude(20) + Dropout positif(20) + Cohérence même âge(30) */
  var rows=pL.map(function(p){
    var recs=gP[p];
    var avgC=avg(recs.map(function(r){return v(r,'comp');}));
    var avgPr=avg(recs.map(function(r){return v(r,'prompt');}));
    var d1=sum(recs,D1),d3=sum(recs,D3);var dr=dropout(d1,d3);
    /* Same-age coherence */
    var cohOK=0,cohTot=0;
    Object.values(SAME_AGE).forEach(function(ags){
      var vals=ags.map(function(ag){return sum(recs,ag);});
      var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
      cohTot++;if(mx>0&&((mx-mn)/mx*100)<=10)cohOK++;
    });
    var sComp=Math.min(30,avgC/100*30);
    var sPrompt=Math.min(20,avgPr/100*20);
    var sDrop=(dr!==null&&dr>=0&&dr<=10)?20:(dr!==null&&dr>=0)?15:0;
    var sCoh=cohTot>0?(cohOK/cohTot*30):0;
    var total=Math.round(sComp+sPrompt+sDrop+sCoh);
    return{prov:p,comp:avgC,prompt:avgPr,dr:dr,cohOK:cohOK,cohTot:cohTot,sComp:sComp,sPrompt:sPrompt,sDrop:sDrop,sCoh:sCoh,total:total};
  }).sort(function(a,b){return b.total-a.total;});

  /* KPIs */
  var avgScore=avg(rows.map(function(r){return r.total;}));
  var nExc=rows.filter(function(r){return r.total>=80;}).length;
  var nBon=rows.filter(function(r){return r.total>=50&&r.total<80;}).length;
  var nMauv=rows.filter(function(r){return r.total<50;}).length;

  d.innerHTML+=kpiRow([
    kpi(avgScore.toFixed(0)+'/100','Score moyen','blue'),
    kpi(nExc,'Excellent (≥80)','green'),
    kpi(nBon,'Bon (50-79)','orange'),
    kpi(nMauv,'Mauvais (<50)','red')
  ]);

  /* Score chart */
  box(d,'scoreC','Score qualité par Province','canvas');
  after(function(){var ctx=document.getElementById('scoreC');if(!ctx)return;
    S.charts.sc=new Chart(ctx,{type:'bar',data:{labels:rows.map(function(r){return short(r.prov);}),
      datasets:[
        {label:'Complétude',data:rows.map(function(r){return r.sComp;}),backgroundColor:'#2196F3'},
        {label:'Promptitude',data:rows.map(function(r){return r.sPrompt;}),backgroundColor:'#FF9800'},
        {label:'Dropout',data:rows.map(function(r){return r.sDrop;}),backgroundColor:'#27ae60'},
        {label:'Cohérence',data:rows.map(function(r){return r.sCoh;}),backgroundColor:'#9b59b6'}
      ]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{x:{stacked:true,ticks:{maxRotation:45,font:{size:9}}},y:{stacked:true,max:100,title:{display:true,text:'Score'}}}}});
  });

  /* Table */
  var bx=document.createElement('div');bx.className='box';
  var h='<h4>Détail des scores</h4><div class="tw"><table class="dt"><thead><tr><th>#</th><th>Province</th><th>Comp%</th><th>Prompt%</th><th>Dropout%</th><th>Coh. même âge</th><th>S.Comp</th><th>S.Prompt</th><th>S.Drop</th><th>S.Coh</th><th>TOTAL</th><th>Interp.</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var ip=r.total>=80?['Excellent','#27ae60']:r.total>=50?['Bon','#f39c12']:['Mauvais','#e74c3c'];
    h+='<tr><td>'+(i+1)+'</td><td><b>'+r.prov+'</b></td><td>'+r.comp.toFixed(1)+'%</td><td>'+r.prompt.toFixed(1)+'%</td><td>'+(r.dr!==null?r.dr.toFixed(1)+'%':'—')+'</td><td>'+r.cohOK+'/'+r.cohTot+'</td>'+
      '<td>'+r.sComp.toFixed(0)+'</td><td>'+r.sPrompt.toFixed(0)+'</td><td>'+r.sDrop+'</td><td>'+r.sCoh.toFixed(0)+'</td>'+
      '<td style="background:'+ip[1]+';color:#fff;font-weight:800;text-align:center">'+r.total+'</td>'+
      '<td style="color:'+ip[1]+';font-weight:700">'+ip[0]+'</td></tr>';
  });
  h+='</tbody></table></div>';bx.innerHTML=h;d.appendChild(bx);
}

/* ═══════════════════════════════════════
   TAB : ZONE DE SANTÉ (= Antenne)
   ═══════════════════════════════════════ */
function tabZS(d){
  sec(d,'🏥','Analyse par Antenne');
  var data=S.fP;var gO=grp(data,ant);
  var ranked=Object.keys(gO).filter(function(k){return k!=='?';}).map(function(ou){return{name:ou,total:totD(gO[ou])};}).sort(function(a,b){return b.total-a.total;});

  var top=ranked.slice(0,30);
  box(d,'zsTop','Top 30 – Doses totales','canvas');
  after(function(){var ctx=document.getElementById('zsTop');if(!ctx)return;
    S.charts.zt=new Chart(ctx,{type:'bar',data:{labels:top.map(function(t){return short(t.name);}),datasets:[{label:'Total doses',data:top.map(function(t){return t.total;}),backgroundColor:'#1565C0',borderRadius:3}]},
      options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}}}});},100);

  var bot=ranked.slice(-30).reverse();
  box(d,'zsBot','30 dernières – Doses totales','canvas');
  after(function(){var ctx=document.getElementById('zsBot');if(!ctx)return;
    S.charts.zb=new Chart(ctx,{type:'bar',data:{labels:bot.map(function(t){return short(t.name);}),datasets:[{label:'Total doses',data:bot.map(function(t){return t.total;}),backgroundColor:'#e74c3c',borderRadius:3}]},
      options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}}}});},200);
}

/* ═══════════════════════════════════════
   TAB : NATIONAL
   ═══════════════════════════════════════ */
function tabNat(d){
  sec(d,'🇨🇩','Vue nationale');
  var data=S.fP;var months=[...new Set(data.map(ym))].sort();var byM=grp(data,ym);

  box(d,'natT','Évolution mensuelle nationale','canvas');
  after(function(){var ctx=document.getElementById('natT');if(!ctx)return;
    var ds=KEY_AG.map(function(ag,i){return{label:nm(ag),data:months.map(function(m){return sum(byM[m]||[],ag);}),borderColor:COLORS[i],tension:.3,pointRadius:4,fill:false};});
    S.charts.nT=new Chart(ctx,{type:'line',data:{labels:months.map(mL),datasets:ds},
      options:{responsive:true,scales:{y:{beginAtZero:true,title:{display:true,text:'Doses'}}}}});},100);

  var gP=grp(data,prov);var pL=Object.keys(gP).filter(function(k){return k!=='?';}).sort();
  box(d,'natP','Doses par Province (empilé)','canvas');
  after(function(){var ctx=document.getElementById('natP');if(!ctx)return;
    var ds=KEY_AG.map(function(ag,i){return{label:nm(ag),data:pL.map(function(p){return sum(gP[p],ag);}),backgroundColor:COLORS[i]};});
    S.charts.nP=new Chart(ctx,{type:'bar',data:{labels:pL.map(short),datasets:ds},
      options:{responsive:true,scales:{x:{stacked:true,ticks:{maxRotation:45,font:{size:8}}},y:{stacked:true,beginAtZero:true}}}});},200);

  /* Monthly table */
  var bx=document.createElement('div');bx.className='box';
  var h='<h4>Résumé mensuel</h4><div class="tw"><table class="dt"><thead><tr><th>Mois</th><th>Comp%</th><th>Prompt%</th>';
  KEY_AG.forEach(function(a){h+='<th>'+nm(a)+'</th>';});h+='<th>Total</th></tr></thead><tbody>';
  months.forEach(function(m){var recs=byM[m]||[];
    h+='<tr><td><b>'+mL(m)+'</b></td><td>'+avg(recs.map(function(r){return v(r,'comp');})).toFixed(1)+'%</td><td>'+avg(recs.map(function(r){return v(r,'prompt');})).toFixed(1)+'%</td>';
    KEY_AG.forEach(function(a){h+='<td>'+fmt(sum(recs,a))+'</td>';});
    h+='<td><b>'+fmt(totD(recs))+'</b></td></tr>';});
  h+='</tbody></table></div>';bx.innerHTML=h;d.appendChild(bx);
}

/* ═══════════════════════════════════════
   TAB : APERÇU GÉNÉRAL
   ═══════════════════════════════════════ */
function tabApercu(d){
  sec(d,'📋','Aperçu général');
  var data=S.fP;var td=totD(data);
  var avgC=avg(data.map(function(r){return v(r,'comp');}));
  var avgP=avg(data.map(function(r){return v(r,'prompt');}));

  d.innerHTML+=kpiRow([
    kpi(fmt(td),'Total doses','blue'),
    kpi(pct(avgC),'Complétude moy.','green'),
    kpi(pct(avgP),'Promptitude moy.','orange'),
    kpi(S.av.province.length,'Provinces',''),
    kpi(S.av.antenne.length,'Antennes',''),
    kpi(S.av.period.length,'Mois',''),
    kpi(AG.length,'Antigènes','')
  ]);

  var gP=grp(data,prov);var pL=Object.keys(gP).filter(function(k){return k!=='?';}).sort();
  var bx=document.createElement('div');bx.className='box';
  var h='<h4>Tous antigènes par Province</h4><div class="tw" style="max-height:600px;overflow-y:auto"><table class="dt"><thead><tr><th>Province</th><th>Comp%</th><th>Prompt%</th>';
  AG.forEach(function(a){h+='<th>'+nm(a)+'</th>';});h+='<th><b>Total</b></th></tr></thead><tbody>';
  var gt={};AG.forEach(function(a){gt[a]=0;});var gtt=0;
  pL.forEach(function(p){var recs=gP[p];
    var c=avg(recs.map(function(r){return v(r,'comp');}));
    var pr=avg(recs.map(function(r){return v(r,'prompt');}));
    h+='<tr><td><b>'+p+'</b></td><td class="'+(c>=80?'cg':c>=50?'cy':'cr')+'">'+c.toFixed(1)+'%</td><td class="'+(pr>=80?'cg':pr>=50?'cy':'cr')+'">'+pr.toFixed(1)+'%</td>';
    AG.forEach(function(a){var x=sum(recs,a);gt[a]+=x;h+='<td>'+fmt(x)+'</td>';});
    var t2=totD(recs);gtt+=t2;h+='<td><b>'+fmt(t2)+'</b></td></tr>';
  });
  h+='<tr style="background:#e8f0fe;font-weight:800"><td>TOTAL</td><td></td><td></td>';
  AG.forEach(function(a){h+='<td>'+fmt(gt[a])+'</td>';});
  h+='<td><b>'+fmt(gtt)+'</b></td></tr></tbody></table></div>';
  bx.innerHTML=h;d.appendChild(bx);
}

/* ── DOM helpers ── */
function sec(d,icon,title){var e=document.createElement('div');e.className='sec';e.innerHTML='<span>'+icon+'</span> '+title;d.appendChild(e);}
function kpiRow(cards){return'<div class="kpi-row">'+cards.join('')+'</div>';}
function kpi(val,lbl,cls){return'<div class="kpi'+(cls?' '+cls:'')+'"><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div>';}
function box(d,id,title,type){var b=document.createElement('div');b.className='box';b.innerHTML='<h4>'+title+'</h4><'+(type==='canvas'?'canvas':'div')+' id="'+id+'"'+
  (type==='canvas'?' height="80"':' style="height:320px"')+'></'+(type==='canvas'?'canvas':'div')+'>';d.appendChild(b);}
function short(s){return s&&s.length>22?s.substring(0,20)+'…':s;}
function after(fn,ms){setTimeout(fn,ms||50);}

/* ── Start ── */
init();
</script>
</body>
</html>
