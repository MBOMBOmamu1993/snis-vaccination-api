<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard PEV de routine – RDC</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;color:#333;font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#999;border-radius:3px}
.hdr{background:linear-gradient(135deg,#002b55 0%,#0b3a6f 45%,#1a5fa8 100%);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:1200;box-shadow:0 3px 18px rgba(0,0,0,.22)}
.hdr .logo{display:flex;align-items:center;gap:10px}
.hdr .logo img,.hdr .logo svg{height:42px;width:42px}
.hdr h1{font-size:21px;font-weight:800;letter-spacing:.4px;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.ibtn{border:2px solid rgba(255,255,255,.45);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-style:italic;font-size:18px;color:#fff;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.15)}
.nav{background:linear-gradient(135deg,#0b3a6f,#0d4888);display:flex;padding-left:16px;border-top:1px solid rgba(255,255,255,.07);position:sticky;top:60px;z-index:1100;overflow-x:auto;-webkit-overflow-scrolling:touch}
.mi{position:relative;padding:13px 20px;color:rgba(255,255,255,.82);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s;user-select:none}
.mi:hover,.mi.act{color:#fff;background:rgba(255,255,255,.09);border-bottom-color:#64b5f6}
.dd{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:290px;box-shadow:0 14px 42px rgba(0,0,0,.22);border-radius:0 0 10px 10px;z-index:2000;overflow:hidden;border:1px solid #ddd}
.dd .di{padding:12px 18px;cursor:pointer;color:#333;font-size:12.5px;font-weight:500;border-bottom:1px solid #f3f3f3;transition:.2s;display:flex;align-items:center;gap:8px}
.dd .di:last-child{border:none}.dd .di:hover{background:#e3f2fd;color:#0b3a6f;padding-left:24px}
.dd .di.as{background:linear-gradient(135deg,#0b3a6f,#1565c0);color:#fff;font-weight:700}
.mi:hover>.dd{display:block}
.lb{background:linear-gradient(135deg,#e3ecf7,#d6e3f5);padding:9px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #c5d4e8;font-size:12px;flex-wrap:wrap}
.lb .st{font-weight:700;min-width:160px;color:#0b3a6f}
.lb .pw{flex:1;min-width:180px;height:6px;background:#c5d4e8;border-radius:3px;overflow:hidden}
.lb .pf{height:100%;background:linear-gradient(90deg,#0b3a6f,#2196f3);border-radius:3px;transition:width .4s}
.lb .pt{font-size:11px;color:#555;min-width:100px}
.fs{background:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border-bottom:2px solid #e3ecf7;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.fg{position:relative}
.fg label{display:block;font-size:9.5px;font-weight:700;color:#888;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.fbtn{padding:7px 12px;border:2px solid #d1d5db;border-radius:7px;background:#fafbfc;cursor:pointer;font-size:12px;font-weight:600;min-width:140px;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:.2s;gap:6px}
.fbtn:hover{border-color:#1565c0;background:#f0f4ff}
.fbtn .cn{background:#0b3a6f;color:#fff;font-size:9px;padding:2px 5px;border-radius:8px}
.fd{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:230px;max-height:310px;overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.16);border-radius:8px;z-index:999;padding:4px 0;border:1px solid #ddd;margin-top:2px}
.fd.sh{display:block}
.fd .sr{width:calc(100% - 14px);margin:4px 7px 6px;padding:6px 8px;border:1px solid #ddd;border-radius:5px;font-size:11px;outline:none}
.fd .sr:focus{border-color:#1565c0}
.fi{display:flex;align-items:center;gap:7px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.12s}
.fi:hover{background:#e3f2fd}
.fi input[type=checkbox]{accent-color:#0b3a6f;width:14px;height:14px}
.fa{border-bottom:2px solid #e3ecf7;font-weight:700;padding:7px 12px;background:#fafbfc}
.ct{padding:18px 22px}
.db{background:#fff;border-radius:13px;padding:22px;min-height:480px;box-shadow:0 4px 18px rgba(0,0,0,.05);border:1px solid #e5e7eb}
.kr{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kc{flex:1;min-width:170px;background:#fff;border-radius:13px;padding:18px;box-shadow:0 3px 16px rgba(0,0,0,.05);border-left:5px solid #0b3a6f;text-align:center;transition:transform .2s,box-shadow .2s}
.kc:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,0,0,.1)}
.kc.gn{border-left-color:#27ae60}.kc.rd{border-left-color:#e74c3c}.kc.or{border-left-color:#f39c12}.kc.bl{border-left-color:#2196f3}.kc.pu{border-left-color:#9b59b6}
.kv{font-size:28px;font-weight:800;color:#0b3a6f}
.kl{font-size:11px;font-weight:600;color:#666;margin-top:4px}
.cb{background:#fff;border-radius:13px;padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.04);margin-bottom:18px;border:1px solid #eef1f5}
.cb h4{font-size:14px;font-weight:700;color:#0b3a6f;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid #e3ecf7;display:flex;align-items:center;gap:7px}
.cr{display:flex;gap:16px;flex-wrap:wrap}.ch{flex:1;min-width:370px}
.tw{overflow-x:auto;margin-bottom:16px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.06);max-height:480px;overflow-y:auto}
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt thead{background:linear-gradient(135deg,#0b3a6f,#1565c0);color:#fff;position:sticky;top:0;z-index:10}
.dt th{padding:10px 8px;text-align:left;font-weight:700;white-space:nowrap;font-size:10px}
.dt td{padding:7px 8px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.dt tbody tr:hover{background:#f0f7ff}.dt tbody tr:nth-child(even){background:#fafbfc}
.cg{background:#d4edda!important;color:#155724}.crd{background:#fee2e2!important;color:#991b1b}
.cy{background:#fff3cd!important;color:#856404}.co{background:#ffe0b2!important;color:#e65100}
.tr{color:#e74c3c!important;font-weight:700}
.st2{font-size:15px;font-weight:800;color:#0b3a6f;margin-bottom:16px;padding:13px 18px;background:linear-gradient(135deg,#e3ecf7,#dce8fa);border-radius:11px;display:flex;align-items:center;gap:9px;border-left:5px solid #0b3a6f}
.stt{display:flex;margin-bottom:18px;border-bottom:3px solid #0b3a6f;background:#fff;border-radius:11px 11px 0 0;overflow-x:auto}
.stb{padding:12px 20px;cursor:pointer;font-size:12.5px;font-weight:600;color:#666;border-bottom:4px solid transparent;white-space:nowrap;transition:.2s}
.stb:hover{background:#e3f2fd;color:#0b3a6f}.stb.act{color:#0b3a6f;border-bottom-color:#0b3a6f;font-weight:800;background:#f0f7ff}
.pg{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px;margin-top:10px}
.pg button{padding:9px 22px;border:none;background:linear-gradient(135deg,#0b3a6f,#1565c0);color:#fff;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pg button:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.pg button:not(:disabled):hover{background:linear-gradient(135deg,#1565c0,#1976d2)}
.pg span{font-size:13px;font-weight:700;color:#0b3a6f;background:#e3ecf7;padding:7px 14px;border-radius:18px}
.lgb{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:11px}
.lgi{display:flex;align-items:center;gap:4px}
.lgd{width:13px;height:13px;border-radius:2px;display:inline-block}
@media(max-width:900px){.nav{flex-wrap:wrap}.ch{min-width:100%}.kr{flex-direction:column}.hdr{padding:0 10px}.hdr h1{font-size:15px}.fs{padding:8px 10px}}
</style>
</head>
<body>

<div class="hdr">
<div class="logo">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2.5"/>
<path d="M35 25L35 75M65 25L65 75M35 50L65 50M25 38L75 38M25 62L75 62" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="50" cy="18" r="5" fill="#64b5f6"/><circle cx="50" cy="82" r="5" fill="#64b5f6"/>
<text x="50" y="98" text-anchor="middle" fill="#64b5f6" font-size="9" font-weight="bold">PEV</text>
</svg>
<span style="font-weight:700;font-size:14px">PEV</span>
</div>
<h1>Dashboard PEV de routine – RDC</h1>
<div class="ibtn" title="Info"><i>i</i></div>
</div>

<div class="nav" id="NAV"></div>

<div class="lb" id="LB">
<div class="st" id="LS">⏳ Initialisation...</div>
<div class="pw"><div class="pf" id="PF" style="width:0%"></div></div>
<div class="pt" id="PT"></div>
</div>

<div class="fs" id="FS"></div>

<div class="ct">
<div class="db" id="DB">
<div style="text-align:center;padding:70px;color:#888">
<div style="font-size:48px;margin-bottom:14px">📊</div>
<h3>Chargement...</h3>
</div>
</div>
<div class="pg" id="PG" style="display:none">
<button id="BP" onclick="chPg(-1)" disabled>◀ Précédent</button>
<span id="PI">Page 1/5</span>
<button id="BN" onclick="chPg(1)">Suivant ▶</button>
</div>
</div>

<script>
/* ═══════════════════════════════════════════════
   CONFIGURATION
   ═══════════════════════════════════════════════ */
var C={
  MA:11,
  CT:0.33,
  CD:0.10,
  BR:[[90,20],[80,16],[70,12],[60,8],[50,4],[0,0]],
  BA:[[0,20],[5.01,16],[10.01,12],[20.01,8],[30.01,4],[50.01,0]]
};

var BASE='./data/dashboard';

var AG_MAP={BCG:'BCG_0_11',VPO0:'VPO0_0_11',DTC1:'DTC1_0_11',VPO1:'VPO1_0_11',ROTA1:'ROTA1_0_11','PCV13_1':'PCV13_1_0_11',DTC2:'DTC2_0_11',VPO2:'VPO2_0_11',ROTA2:'ROTA2_0_11','PCV13_2':'PCV13_2_0_11',DTC3:'DTC3_0_11',VPO3:'VPO3_0_11',VPI1:'VPI1_0_11',ROTA3:'ROTA3_0_11','PCV13_3':'PCV13_3_0_11',VAR1:'VAR1_0_11',VPI2:'VPI2_0_11',VAR2:'VAR2_0_11',VAA:'VAA_0_11'};

var AG_LBL={BCG:'BCG',VPO0:'VPO0',DTC1:'DTC1/Penta1',VPO1:'VPO1',ROTA1:'ROTA1',PCV13_1:'PCV13-1',DTC2:'DTC2/Penta2',VPO2:'VPO2',ROTA2:'ROTA2',PCV13_2:'PCV13-2',DTC3:'DTC3/Penta3',VPO3:'VPO3',VPI1:'VPI1',ROTA3:'ROTA3',PCV13_3:'PCV13-3',VAR1:'VAR1',VPI2:'VPI2',VAA:'VAA',VAR2:'VAR2'};

function agL(a){return AG_LBL[a]||a;}

var SAME_AGE=[
  {age:'Naissance',v:['BCG','VPO0']},
  {age:'6 semaines',v:['DTC1','VPO1','ROTA1','PCV13_1']},
  {age:'10 semaines',v:['DTC2','VPO2','ROTA2','PCV13_2']},
  {age:'14 semaines',v:['DTC3','VPO3','VPI1','ROTA3','PCV13_3']},
  {age:'9 mois',v:['VAR1','VPI2','VAA']}
];

var TABS=[
  {id:'oqd',lb:'Outil qualité données',fl:['province','antenne','zs','period'],
   pp:[{t:'1. Complétude et Promptitude',ic:'📋'},{t:'2. Cohérence-temps',ic:'📈'},{t:'3. Cohérence-donnée',ic:'🔗'},{t:'4. Valeurs atypiques',ic:'⚠️'},{t:'5. Score qualité des données',ic:'👤'}]},
  {id:'zs',lb:'Zone de Santé',fl:['province','antenne','zs','period'],pp:[{t:'Tableau de bord ZS',ic:'🏥'}]},
  {id:'ant',lb:'Antenne PEV',fl:['province','antenne','period'],pp:[{t:'Tableau de bord Antenne',ic:'🏢'}]},
  {id:'nat',lb:'National',fl:['province','period'],pp:[{t:'Tableau de bord National',ic:'🇨🇩'}]},
  {id:'gen',lb:'Aperçu général',fl:['province','antenne','zs','period'],pp:[{t:'Aperçu général',ic:'🌐'}]}
];

/* ═══ STATE ═══ */
var S={
  tab:0, pg:0, charts:{}, meta:null, byProv:[], byZS:[],
  heatmap:{}, hmIndex:{}, hmCache:{},
  filtered:{prov:[],zs:[]}, filters:{}, allVals:{}, loaded:false
};

/* ═══ UTILITIES ═══ */
function mL(ym){
  if(!ym||ym.length<6)return ym||'';
  var n=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
  return n[parseInt(ym.substring(4,6),10)-1]+' '+ym.substring(0,4);
}

function grp(a,fn){var g={};a.forEach(function(r){var k=fn(r)||'_';if(!g[k])g[k]=[];g[k].push(r);});return g;}
function sf(a,f){return a.reduce(function(s,r){return s+(Number(r[f])||0);},0);}
function af(a,f){return a.length?sf(a,f)/a.length:0;}
function pct(n,d){return d?(n/d*100):0;}
function tr(s,n){return s&&s.length>n?s.substr(0,n-1)+'…':s;}
function E(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function ccl(v){return v>=80?'cg':v>=50?'cy':'crd';}
function sB(val,bar){for(var i=0;i<bar.length;i++){if(val>=bar[i][0])return bar[i][1];}return 0;}
function sBA(v){if(v<=5)return 20;if(v<=10)return 16;if(v<=20)return 12;if(v<=30)return 8;if(v<=50)return 4;return 0;}

function sp(p,t,s){
  var a=document.getElementById('PF'),b=document.getElementById('PT'),c=document.getElementById('LS');
  if(a)a.style.width=p+'%';if(b&&t)b.textContent=t;if(c&&s)c.textContent=s;
}

/* ═══════════════════════════════════════
   DATA LOADING (from Script 1 - unchanged)
   ═══════════════════════════════════════ */
async function loadAll(){
  var t0=Date.now();sp(10,'Chargement...','⏳ Chargement...');
  try{
    var [mR,pR,zR,hmR]=await Promise.all([
      fetch(BASE+'/meta.json?t='+Date.now()),
      fetch(BASE+'/by_province.json'),
      fetch(BASE+'/by_zs.json'),
      fetch(BASE+'/heatmap/manifest.json')
    ]);
    sp(50,'Parsing...');
    S.meta=await mR.json();S.byProv=await pR.json();S.byZS=await zR.json();
    S.hmIndex=await hmR.json();
    S.hmCache={};S.heatmap={};
    sp(80,'Filtres...');
    S.allVals={province:S.meta.provinces||[],antenne:S.meta.antennes||[],zs:S.meta.zs||[],period:S.meta.months||[]};
    Object.keys(S.allVals).forEach(function(k){S.filters[k]=S.allVals[k].slice();});
    S.loaded=true;applyFilters();bNav();rFlt();render();
    var dt=((Date.now()-t0)/1000).toFixed(1);
    sp(100,S.meta.total_records.toLocaleString()+' enreg. | '+S.meta.months.length+' mois | '+S.meta.nb_fosa+' FOSA','✅ Prêt en '+dt+'s');
  }catch(e){
    console.error(e);sp(0,'❌ '+e.message,'❌ Erreur');
    document.getElementById('DB').innerHTML='<div style="text-align:center;padding:60px;color:#e74c3c"><h3>❌ Erreur de chargement</h3><p>'+e.message+'</p><p style="margin-top:12px;font-size:12px;color:#888">Lancez d\'abord le workflow <code>aggregate</code> via GitHub Actions.</p></div>';
  }
}

async function loadHeatmap(){
  var provs=S.filters.province||[];
  var toLoad=provs.filter(function(p){return S.hmIndex[p]&&!S.hmCache[p];});
  if(toLoad.length){
    var fetches=toLoad.map(function(p){
      return fetch(BASE+'/heatmap/'+S.hmIndex[p])
        .then(function(r){return r.json();})
        .then(function(d){S.hmCache[p]=d;});
    });
    await Promise.all(fetches);
  }
  S.heatmap={};
  provs.forEach(function(p){
    var d=S.hmCache[p];
    if(d){Object.keys(d).forEach(function(f){S.heatmap[f]=d[f];});}
  });
}

function applyFilters(){
  var f=S.filters;
  function ok(r){
    if(f.province.length<S.allVals.province.length&&!f.province.includes(r._Province))return false;
    if(f.antenne.length<S.allVals.antenne.length&&!f.antenne.includes(r._Antenne))return false;
    if(f.zs.length<S.allVals.zs.length&&!f.zs.includes(r._ZS))return false;
    if(f.period.length<S.allVals.period.length&&!f.period.includes(r._YM))return false;
    return true;
  }
  S.filtered={prov:S.byProv.filter(ok),zs:S.byZS.filter(ok)};
}

/* ═══ FILTERS (Script 2 design) ═══ */
function rFlt(){
  var c=document.getElementById('FS');c.innerHTML='';
  var tab=TABS[S.tab];
  var dm={province:{l:'Province',k:'province'},antenne:{l:'Antenne PEV',k:'antenne'},zs:{l:'Zone de Santé',k:'zs'},period:{l:'Période',k:'period'}};
  tab.fl.forEach(function(dim){
    var info=dm[dim];if(!info)return;
    var g=document.createElement('div');g.className='fg';
    var lb=document.createElement('label');lb.textContent=info.l;g.appendChild(lb);
    var bt=document.createElement('button');bt.className='fbtn';
    var sel=S.filters[info.k],tot=S.allVals[info.k].length;
    bt.innerHTML='<span>'+(sel.length===tot?'Tout ('+tot+')':sel.length+'/'+tot)+'</span><span class="cn">'+sel.length+'</span><span>▼</span>';
    bt.onclick=function(e){e.stopPropagation();document.querySelectorAll('.fd').forEach(function(el){if(el.id!=='fd-'+info.k)el.classList.remove('sh');});document.getElementById('fd-'+info.k).classList.toggle('sh');};
    g.appendChild(bt);
    var dd=document.createElement('div');dd.className='fd';dd.id='fd-'+info.k;
    var sr=document.createElement('input');sr.className='sr';sr.placeholder='Rechercher...';sr.type='text';
    sr.oninput=function(){var q=sr.value.toLowerCase();dd.querySelectorAll('.fi:not(.fa)').forEach(function(it){it.style.display=it.textContent.toLowerCase().indexOf(q)>=0?'':'none';});};
    dd.appendChild(sr);
    var aD=document.createElement('div');aD.className='fi fa';
    var aC=document.createElement('input');aC.type='checkbox';aC.checked=sel.length===tot;
    aC.onchange=function(){S.filters[info.k]=aC.checked?S.allVals[info.k].slice():[];applyFilters();rFlt();render();};
    aD.appendChild(aC);var aS=document.createElement('span');aS.textContent='Tout sélectionner';aS.style.fontWeight='700';aD.appendChild(aS);dd.appendChild(aD);
    S.allVals[info.k].forEach(function(v){
      var it=document.createElement('div');it.className='fi';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=S.filters[info.k].indexOf(v)>=0;
      cb.onchange=function(){if(cb.checked){if(S.filters[info.k].indexOf(v)<0)S.filters[info.k].push(v);}else{S.filters[info.k]=S.filters[info.k].filter(function(x){return x!==v;});}applyFilters();rFlt();render();};
      it.appendChild(cb);var sp2=document.createElement('span');sp2.textContent=info.k==='period'?mL(v):v;it.appendChild(sp2);dd.appendChild(it);
    });
    g.appendChild(dd);c.appendChild(g);
  });
}

document.addEventListener('click',function(e){if(!e.target.closest('.fg'))document.querySelectorAll('.fd').forEach(function(el){el.classList.remove('sh');});});

/* ═══ NAV (Script 2 design) ═══ */
function bNav(){
  var nav=document.getElementById('NAV');nav.innerHTML='';
  TABS.forEach(function(tab,ti){
    var mi=E('div','mi'+(ti===S.tab?' act':''));mi.id='mi-'+tab.id;
    mi.innerHTML='<span>'+tab.lb+'</span><span style="font-size:10px;margin-left:3px;opacity:.6">▼</span>';
    if(tab.pp.length>0){
      var dd=E('div','dd');dd.id='dd-'+tab.id;
      tab.pp.forEach(function(pg,pi){
        var di=E('div','di'+(ti===S.tab&&pi===S.pg?' as':''));
        di.innerHTML='<span>'+pg.ic+'</span> '+pg.t;
        di.onclick=function(e){e.stopPropagation();navTo(ti,pi);};
        dd.appendChild(di);
      });
      mi.appendChild(dd);
    }
    mi.onclick=function(){navTo(ti,0);};
    nav.appendChild(mi);
  });
}

function navTo(t,p){
  S.tab=t;S.pg=p;
  document.querySelectorAll('.mi').forEach(function(el,i){el.classList.toggle('act',i===t);});
  var dd=document.getElementById('dd-'+TABS[t].id);
  if(dd)dd.querySelectorAll('.di').forEach(function(el,i){el.classList.toggle('as',i===p);});
  rFlt();applyFilters();render();window.scrollTo({top:0,behavior:'smooth'});
}

function chPg(d){
  var tab=TABS[S.tab],np=S.pg+d;
  if(np>=0&&np<tab.pp.length){
    S.pg=np;
    var dd=document.getElementById('dd-'+tab.id);
    if(dd)dd.querySelectorAll('.di').forEach(function(el,i){el.classList.toggle('as',i===np);});
    render();window.scrollTo({top:0,behavior:'smooth'});
  }
}

/* ═══ RENDER ═══ */
function render(){
  Object.values(S.charts).forEach(function(c){try{c.destroy();}catch(e){}});S.charts={};
  var db=document.getElementById('DB');db.innerHTML='';
  var tab=TABS[S.tab],pg=tab.pp[S.pg];
  db.appendChild(E('div','st2','<span>'+pg.ic+'</span> '+tab.lb+' — '+pg.t));
  var ct=E('div','','');ct.id='PC';db.appendChild(ct);

  if(tab.id==='oqd'){
    try{[renderP1,renderP2,renderP3,renderP4,renderP5][S.pg](ct);}
    catch(e){console.error(e);ct.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
  } else {
    ct.innerHTML='<div style="text-align:center;padding:70px;color:#888"><div style="font-size:48px;margin-bottom:12px">🚧</div><h3>'+tab.lb+' — En construction</h3><p style="margin-top:8px">Contenu à venir.</p></div>';
  }

  var bar=document.getElementById('PG');
  if(tab.pp.length>1){
    bar.style.display='flex';
    document.getElementById('PI').textContent='Page '+(S.pg+1)+' sur '+tab.pp.length;
    document.getElementById('BP').disabled=S.pg===0;
    document.getElementById('BN').disabled=S.pg>=tab.pp.length-1;
  } else {
    bar.style.display='none';
  }
}

/* ══════════════════════════════════════
   PAGE 1: COMPLÉTUDE & PROMPTITUDE
   ══════════════════════════════════════ */
function renderP1(c){
  var data=S.filtered.zs;
  var tN=sf(data,'n'),tR=sf(data,'rap'),pR=tN?(tR/tN*100):0;
  var aC=af(data,'comp'),aP=af(data,'prompt');

  c.appendChild(E('div','kr',
    '<div class="kc gn"><div class="kv">'+tR.toLocaleString()+'</div><div class="kl">Rapportantes</div></div>'+
    '<div class="kc rd"><div class="kv">'+(tN-tR).toLocaleString()+'</div><div class="kl">Non-rapportantes</div></div>'+
    '<div class="kc bl"><div class="kv">'+pR.toFixed(1)+'%</div><div class="kl">% rapportage</div></div>'+
    '<div class="kc or"><div class="kv">'+aC.toFixed(1)+'%</div><div class="kl">Complétude moy.</div></div>'+
    '<div class="kc pu"><div class="kv">'+(S.meta?S.meta.nb_fosa:0).toLocaleString()+'</div><div class="kl">FOSA</div></div>'
  ));

  // Bar charts at multiple levels
  [{l:'Province',d:S.filtered.prov,k:'_Province'},{l:'Antenne PEV',d:data,k:'_Antenne'},{l:'Zone de Santé',d:data,k:'_ZS'}].forEach(function(lv,idx){
    var g=grp(lv.d,function(r){return r[lv.k]||'';});var labs=Object.keys(g).filter(Boolean).sort();
    if(!labs.length)return;
    if(labs.length>50)labs=labs.slice(0,50);
    var cd=labs.map(function(k){return af(g[k],'comp');}),pd=labs.map(function(k){return af(g[k],'prompt');});
    var box=E('div','cb');
    box.innerHTML='<h4>📊 Complétude et Promptitude par '+lv.l+'</h4><canvas id="cp'+idx+'" height="'+(labs.length>15?Math.min(labs.length*5,200):70)+'"></canvas>';
    c.appendChild(box);
    setTimeout(function(){
      var x=document.getElementById('cp'+idx);if(!x)return;
      S.charts['cp'+idx]=new Chart(x,{type:'bar',data:{labels:labs.map(function(l){return tr(l,24);}),datasets:[{label:'Complétude (%)',data:cd,backgroundColor:'rgba(33,150,243,.72)',borderRadius:3},{label:'Promptitude (%)',data:pd,backgroundColor:'rgba(255,152,0,.72)',borderRadius:3}]},options:{indexAxis:labs.length>12?'y':'x',responsive:true,plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true}},tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+ctx.raw.toFixed(1)+'%';}}}},scales:{x:{beginAtZero:true,max:100,title:{display:true,text:'%'}},y:{ticks:{font:{size:labs.length>25?7:9}}}}}});
    },60+idx*30);
  });

  // Line chart: % rapportage par mois
  var byM=grp(data,function(r){return r._YM||'';}),months=Object.keys(byM).filter(Boolean).sort();
  var pM=months.map(function(m){var d=byM[m],t=sf(d,'n'),r2=sf(d,'rap');return t?(r2/t*100):0;});
  var lb2=E('div','cb');lb2.innerHTML='<h4>📈 % FOSA ayant rapporté par mois</h4><canvas id="pMC" height="50"></canvas>';c.appendChild(lb2);
  setTimeout(function(){
    var x=document.getElementById('pMC');if(!x)return;
    S.charts.pMC=new Chart(x,{type:'line',data:{labels:months.map(mL),datasets:[{label:'% rapportage',data:pM,borderColor:'#0b3a6f',backgroundColor:'rgba(11,58,111,.05)',fill:true,tension:.35,pointRadius:5,pointBackgroundColor:'#0b3a6f',borderWidth:3}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'%'}}}}});
  },400);

  // Heatmap
  var hmBox=E('div','cb');
  hmBox.innerHTML='<h4>🗓️ Suivi des soumissions par FOSA × mois</h4><div class="lgb"><div class="lgi"><div class="lgd" style="background:#27ae60"></div> Rapporté</div><div class="lgi"><div class="lgd" style="background:#e74c3c"></div> Non rapporté</div><div class="lgi"><div class="lgd" style="background:#bdc3c8"></div> Pas de données</div></div><div id="HM" style="width:100%;min-height:300px;text-align:center;padding:30px;color:#888"><em>⏳ Chargement heatmap…</em></div>';
  c.appendChild(hmBox);

  loadHeatmap().then(function(){
    var hm=S.heatmap;
    var fosas=Object.keys(hm).sort().slice(0,150);
    if(fosas.length>0&&months.length>0){
      var z=fosas.map(function(f){return months.map(function(m){return hm[f]&&hm[f][m]!==undefined?hm[f][m]:-1;});});
      var el=document.getElementById('HM');if(!el)return;
      el.innerHTML='';
      el.style.cssText='width:100%;height:'+Math.max(400,fosas.length*14)+'px';
      Plotly.newPlot(el,[{z:z,x:months.map(mL),y:fosas.map(function(f){return tr(f,32);}),type:'heatmap',colorscale:[[0,'#e74c3c'],[.5,'#bdc3c8'],[1,'#27ae60']],showscale:false,hoverongaps:false}],{margin:{l:200,r:25,t:8,b:55},xaxis:{tickangle:-45,tickfont:{size:10}},yaxis:{autorange:'reversed',dtick:1,tickfont:{size:7}},plot_bgcolor:'#fafbfc'},{responsive:true});
    }else{
      var el=document.getElementById('HM');
      if(el)el.innerHTML='<em>Aucune donnée heatmap pour cette sélection.</em>';
    }
  }).catch(function(e){
    console.error('Heatmap error:',e);
    var el=document.getElementById('HM');
    if(el)el.innerHTML='<em style="color:#e74c3c">Erreur chargement heatmap.</em>';
  });
}

/* ══════════════════════════════════════
   PAGE 2: COHÉRENCE-TEMPS
   ══════════════════════════════════════ */
function renderP2(c){
  var data=S.filtered.zs;
  var months=[...new Set(data.map(function(r){return r._YM;}))].filter(Boolean).sort();

  ['BCG','DTC1','DTC3','VPO3','VPI1','VAR1'].forEach(function(ag,i){
    var f=AG_MAP[ag];if(!f)return;
    var row=E('div','cr');

    // Left: evolution
    var left=E('div','ch');
    left.innerHTML='<div class="cb"><h4>📈 '+agL(ag)+' — Évolution mensuelle</h4><canvas id="ev'+i+'" height="60"></canvas></div>';
    row.appendChild(left);

    // Right: dot plot
    var right=E('div','ch');
    right.innerHTML='<div class="cb"><h4>🎯 '+agL(ag)+' — Valeurs vs Moy. (±33%)</h4><div id="dp'+i+'" style="height:290px"></div></div>';
    row.appendChild(right);

    c.appendChild(row);

    var vals=months.map(function(m){return data.filter(function(r){return r._YM===m;}).reduce(function(a,r){return a+(r[f]||0);},0);});

    setTimeout(function(){
      var x=document.getElementById('ev'+i);if(!x)return;
      S.charts['ev'+i]=new Chart(x,{type:'line',data:{labels:months.map(mL),datasets:[{label:agL(ag),data:vals,borderColor:'#1565c0',backgroundColor:'rgba(21,101,192,.05)',fill:true,tension:.3,pointRadius:5,borderWidth:3}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},usePointStyle:true}}},scales:{y:{beginAtZero:true,title:{display:true,text:'Vaccinés'}},x:{grid:{display:false}}}}});

      // Dot plot
      var dv=document.getElementById('dp'+i);if(!dv)return;
      var lastM=months[months.length-1];if(!lastM)return;
      var ld=data.filter(function(r){return r._YM===lastM;});
      var gZS=grp(ld,function(r){return r._ZS||'';});
      var xV=[],yV=[],txt=[],col=[];
      Object.keys(gZS).filter(Boolean).forEach(function(zs){
        var cv=sf(gZS[zs],f);
        var prevD=data.filter(function(r){return r._ZS===zs&&r._YM<lastM;});
        if(!prevD.length)return;
        var avg2=prevD.reduce(function(s,r){return s+(r[f]||0);},0)/prevD.length;
        if(!avg2)return;
        var v2=(cv-avg2)/avg2;
        xV.push(avg2);yV.push(cv);col.push(Math.abs(v2)<=C.CT?'#1565c0':'#e74c3c');
        txt.push(zs+'<br>Valeur: '+cv+'<br>Moy: '+avg2.toFixed(0)+'<br>Var: '+(v2*100).toFixed(1)+'%');
      });
      if(!xV.length)return;
      var mx=Math.max.apply(null,xV.concat(yV).concat([10]))*1.15;
      Plotly.newPlot(dv,[
        {x:xV,y:yV,text:txt,type:'scatter',mode:'markers',marker:{size:9,color:col,line:{width:1,color:'#fff'}},hoverinfo:'text',name:'ZS'},
        {x:[0,mx],y:[0,mx],type:'scatter',mode:'lines',line:{color:'#333',width:2},name:'Moyenne',showlegend:true},
        {x:[0,mx],y:[0,mx*(1+C.CT)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'+33%'},
        {x:[0,mx],y:[0,mx*(1-C.CT)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'-33%'}
      ],{xaxis:{title:'Moyenne précédente'},yaxis:{title:'Valeur courante'},margin:{l:55,r:20,t:8,b:45},legend:{orientation:'h',y:-0.22},plot_bgcolor:'#fafbfc'},{responsive:true});
    },80+i*60);
  });
}

/* ══════════════════════════════════════
   PAGE 3: COHÉRENCE-DONNÉE
   ══════════════════════════════════════ */
function renderP3(c){
  var data=S.filtered.zs;
  var thr=C.CD;

  // Scatter plots
  [{a:'PCV13_1_0_11',aL:'PCV13-1',b:'DTC1_0_11',bL:'DTC1',t:'PCV13-1 vs DTC1'},{a:'PCV13_3_0_11',aL:'PCV13-3',b:'DTC3_0_11',bL:'DTC3',t:'PCV13-3 vs DTC3'}].forEach(function(p,pi){
    var box=E('div','cb');
    box.innerHTML='<h4>🔗 Cohérence '+p.t+' (±'+Math.round(thr*100)+'%)</h4><div id="cs'+pi+'" style="height:340px"></div>';
    c.appendChild(box);
    setTimeout(function(){
      var dv=document.getElementById('cs'+pi);if(!dv)return;
      var months2=[...new Set(data.map(function(r){return r._YM;}))].sort();
      var lastM=months2[months2.length-1];if(!lastM)return;
      var lastD=data.filter(function(r){return r._YM===lastM;});
      var xV=[],yV=[],txt=[],col=[];
      lastD.forEach(function(r){
        var vA=r[p.a]||0,vB=r[p.b]||0;if(!vA&&!vB)return;
        var den=vB||vA||1,v2=(vA-vB)/den;
        xV.push(vB);yV.push(vA);col.push(Math.abs(v2)>thr?'#e74c3c':'#1565c0');
        txt.push((r._ZS||'')+'<br>'+p.bL+': '+vB+'<br>'+p.aL+': '+vA+'<br>Var: '+(v2*100).toFixed(1)+'%');
      });
      if(!xV.length)return;
      var mx=Math.max.apply(null,xV.concat(yV).concat([10]))*1.15;
      Plotly.newPlot(dv,[
        {x:xV,y:yV,text:txt,type:'scatter',mode:'markers',marker:{size:9,color:col,line:{width:1,color:'#fff'}},hoverinfo:'text'},
        {x:[0,mx],y:[0,mx],type:'scatter',mode:'lines',line:{color:'#333',width:2,dash:'dot'},name:'Égalité'},
        {x:[0,mx],y:[0,mx*(1+thr)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'+10%'},
        {x:[0,mx],y:[0,mx*(1-thr)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'-10%'}
      ],{xaxis:{title:p.bL},yaxis:{title:p.aL},margin:{l:55,r:20,t:8,b:45},legend:{orientation:'h',y:-0.2},plot_bgcolor:'#fafbfc'},{responsive:true});
    },80+pi*80);
  });

  // Dropout DTC1-DTC3
  var gZS=grp(data,function(r){return r._ZS||'';});
  var labs=[],vals=[],cols=[];
  Object.keys(gZS).filter(Boolean).sort().forEach(function(zs){
    var d=gZS[zs];var d1=sf(d,'DTC1_0_11'),d3=sf(d,'DTC3_0_11');if(!d1)return;
    var dr=(d1-d3)/d1*100;labs.push(tr(zs,26));vals.push(dr);cols.push(dr<0?'#e74c3c':'#1565c0');
  });
  var drBox=E('div','cb');
  drBox.innerHTML='<h4>📉 Taux d\'abandon DTC1–DTC3 par ZS</h4><canvas id="drC" height="80"></canvas>';
  c.appendChild(drBox);
  setTimeout(function(){
    var x=document.getElementById('drC');if(!x)return;
    S.charts.dr=new Chart(x,{type:'bar',data:{labels:labs,datasets:[{label:'Dropout (%)',data:vals,backgroundColor:cols,borderRadius:3}]},options:{indexAxis:labs.length>8?'y':'x',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){var v=ctx.raw;return 'Dropout: '+(v>0?'+':'')+v.toFixed(1)+'%'+(v<0?' ⚠️ NÉGATIF':'');}}}},scales:{x:{title:{display:true,text:'%'}},y:{ticks:{font:{size:labs.length>20?7:9}}}}}});
  },300);
}

/* ══════════════════════════════════════
   PAGE 5: SCORE QUALITÉ DES DONNÉES
   ══════════════════════════════════════ */
function renderP5(c){
  c.innerHTML='<div class="stt" id="sTabs"><div class="stb act" onclick="showST(0)">Par Province</div><div class="stb" onclick="showST(1)">Par Antenne</div><div class="stb" onclick="showST(2)">Par ZS</div></div><div id="sC"></div>';
  setTimeout(function(){showST(0);},50);
}

window.showST=function(idx){
  document.querySelectorAll('#sTabs .stb').forEach(function(t,i){t.classList.toggle('act',i===idx);});
  var sc=document.getElementById('sC');sc.innerHTML='';
  var data=[S.filtered.prov,S.filtered.zs,S.filtered.zs][idx];
  var kf=['_Province','_Antenne','_ZS'][idx];
  var lb=['Province','Antenne PEV','Zone de Santé'][idx];
  var g=grp(data,function(r){return r[kf]||'';});
  var units=Object.keys(g).filter(Boolean).sort();

  var rows=units.map(function(u){
    var d=g[u],tN=sf(d,'n'),tR2=sf(d,'rap'),pR2=tN?(tR2/tN*100):0;
    var aC2=af(d,'comp'),aP2=af(d,'prompt');
    var d1=sf(d,'DTC1_0_11'),d3=sf(d,'DTC3_0_11'),dr=d1?((d1-d3)/d1*100):0;
    var scR=sB(pR2,C.BR),scE=sB(aC2,C.BR),scD=dr>=0?20:0;
    var tot=scR+scE+scD;
    var interp=tot>=50?'Bon':'Mauvais';
    return{u:u,nT:tN,nR:tR2,tR:pR2,aC:aC2,aP:aP2,d1:d1,d3:d3,dr:dr,scR:scR,scE:scE,scD:scD,tot:tot,interp:interp};
  });

  rows.sort(function(a,b){return b.tot-a.tot;});

  var exc=rows.filter(function(r){return r.tot>=50;}).length;
  var mau=rows.length-exc;
  var avg2=rows.length?rows.reduce(function(s,r){return s+r.tot;},0)/rows.length:0;

  sc.innerHTML='<div class="kr" style="margin-bottom:16px">'+
    '<div class="kc gn"><div class="kv">'+exc+'</div><div class="kl">Score ≥50</div></div>'+
    '<div class="kc rd"><div class="kv">'+mau+'</div><div class="kl">Score <50</div></div>'+
    '<div class="kc bl"><div class="kv">'+avg2.toFixed(0)+'</div><div class="kl">Score moyen</div></div>'+
    '<div class="kc pu"><div class="kv">'+rows.length+'</div><div class="kl">'+lb+'s évaluées</div></div></div>';

  // Distribution chart
  sc.innerHTML+='<div class="cb"><h4>📊 Distribution des scores — '+lb+'</h4><canvas id="sDist" height="45"></canvas></div>';
  setTimeout(function(){
    var x=document.getElementById('sDist');if(!x)return;
    var bins=[[0,20],[20,40],[40,60],[60,80],[80,101]],bL2=bins.map(function(b){return b[0]+'-'+(b[1]===101?100:b[1]);}),bC=bins.map(function(b){return rows.filter(function(r){return r.tot>=b[0]&&r.tot<b[1];}).length;});
    S.charts.sDist=new Chart(x,{type:'bar',data:{labels:bL2,datasets:[{data:bC,backgroundColor:['#e74c3c','#ff7043','#f39c12','#66bb6a','#27ae60'],borderRadius:5}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,title:{display:true,text:'Nombre'}},x:{title:{display:true,text:'Score'}}}}});
  },60);

  // Table
  var h='<div class="tw"><table class="dt"><thead><tr><th>'+lb+'</th><th>Enreg.</th><th>Rapp.</th><th>%Rapp.</th><th>Sc.</th><th>Compl.</th><th>Sc.</th><th>Prompt.</th><th>DTC1</th><th>DTC3</th><th>Drop%</th><th>Sc.</th><th>SCORE</th><th>Interprét.</th></tr></thead><tbody>';

  rows.forEach(function(r){
    var scCol=r.tot>=50?'#27ae60':'#e74c3c';
    var intC=r.interp==='Bon'?'cg':'crd';
    h+='<tr><td><b>'+tr(r.u,26)+'</b></td><td style="text-align:center">'+r.nT+'</td><td style="text-align:center">'+r.nR+'</td><td class="'+ccl(r.tR)+'">'+r.tR.toFixed(1)+'%</td><td style="text-align:center;font-weight:700">'+r.scR+'</td><td class="'+ccl(r.aC)+'">'+r.aC.toFixed(1)+'%</td><td style="text-align:center;font-weight:700">'+r.scE+'</td><td>'+r.aP.toFixed(1)+'%</td><td>'+r.d1+'</td><td>'+r.d3+'</td><td class="'+(r.dr<0?'crd':'')+'">'+r.dr.toFixed(1)+'%</td><td style="text-align:center;font-weight:700">'+r.scD+'</td><td style="background:'+scCol+';color:#fff;text-align:center;font-weight:800;font-size:15px">'+r.tot+'</td><td class="'+intC+'" style="font-weight:700;text-align:center">'+r.interp+'</td></tr>';
  });

  sc.innerHTML+=h+'</tbody></table></div>';
};
