<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Dashboard PEV de routine – RDC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            color: #333;
            font-size: 13px
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px
        }

        ::-webkit-scrollbar-thumb {
            background: #999;
            border-radius: 3px
        }

        .hdr {
            background: linear-gradient(135deg, #002b55 0%, #0b3a6f 45%, #1a5fa8 100%);
            color: #fff;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 1200;
            box-shadow: 0 3px 18px rgba(0, 0, 0, .22)
        }

        .hdr .logo {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .hdr .logo img,
        .hdr .logo svg {
            height: 42px;
            width: 42px
        }

        .hdr h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: .4px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .2)
        }

        .ibtn {
            border: 2px solid rgba(255, 255, 255, .45);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-style: italic;
            font-size: 18px;
            color: #fff;
            transition: .2s
        }

        .ibtn:hover {
            background: rgba(255, 255, 255, .15)
        }

        .nav {
            background: linear-gradient(135deg, #0b3a6f, #0d4888);
            display: flex;
            padding-left: 16px;
            border-top: 1px solid rgba(255, 255, 255, .07);
            position: sticky;
            top: 60px;
            z-index: 1100;
            overflow: visible;
            -webkit-overflow-scrolling: touch
        }

        .mi {
            position: relative;
            padding: 13px 20px;
            color: rgba(255, 255, 255, .82);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: .2s;
            user-select: none
        }

        .mi:hover,
        .mi.act {
            color: #fff;
            background: rgba(255, 255, 255, .09);
            border-bottom-color: #64b5f6
        }

        .dd {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            min-width: 290px;
            box-shadow: 0 14px 42px rgba(0, 0, 0, .22);
            border-radius: 0 0 10px 10px;
            z-index: 9999;
            overflow: hidden;
            border: 1px solid #ddd
        }

        .dd .di {
            padding: 12px 18px;
            cursor: pointer;
            color: #333;
            font-size: 12.5px;
            font-weight: 500;
            border-bottom: 1px solid #f3f3f3;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .dd .di:last-child {
            border: none
        }

        .dd .di:hover {
            background: #e3f2fd;
            color: #0b3a6f;
            padding-left: 24px
        }

        .dd .di.as {
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            font-weight: 700
        }

        .mi:hover>.dd {
            display: block
        }

        .mi .dd {
            animation: fadeIn .15s ease
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .lb {
            background: linear-gradient(135deg, #e3ecf7, #d6e3f5);
            padding: 9px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #c5d4e8;
            font-size: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1000
        }

        .lb .st {
            font-weight: 700;
            min-width: 160px;
            color: #0b3a6f
        }

        .lb .pw {
            flex: 1;
            min-width: 180px;
            height: 6px;
            background: #c5d4e8;
            border-radius: 3px;
            overflow: hidden
        }

        .lb .pf {
            height: 100%;
            background: linear-gradient(90deg, #0b3a6f, #2196f3);
            border-radius: 3px;
            transition: width .4s
        }

        .lb .pt {
            font-size: 11px;
            color: #555;
            min-width: 100px
        }

        .fs {
            background: #fff;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            border-bottom: 2px solid #e3ecf7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .02);
            position: relative;
            z-index: 1000
        }

        .fg {
            position: relative
        }

        .fg label {
            display: block;
            font-size: 9.5px;
            font-weight: 700;
            color: #888;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .fg select {
            padding: 7px 10px;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            background: #fafbfc;
            font-size: 12px;
            font-weight: 600;
            min-width: 160px;
            cursor: pointer;
            outline: none;
            transition: .2s
        }

        .fg select:focus {
            border-color: #1565c0;
            background: #f0f4ff
        }

        .fbtn {
            padding: 7px 12px;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            background: #fafbfc;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            min-width: 140px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: .2s;
            gap: 6px
        }

        .fbtn:hover {
            border-color: #1565c0;
            background: #f0f4ff
        }

        .fbtn .cn {
            background: #0b3a6f;
            color: #fff;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 8px
        }

        .fd {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            min-width: 230px;
            max-height: 310px;
            overflow-y: auto;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .16);
            border-radius: 8px;
            z-index: 999;
            padding: 4px 0;
            border: 1px solid #ddd;
            margin-top: 2px
        }

        .fd.sh {
            display: block
        }

        .fd .sr {
            width: calc(100% - 14px);
            margin: 4px 7px 6px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 11px;
            outline: none
        }

        .fd .sr:focus {
            border-color: #1565c0
        }

        .fi {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: .12s
        }

        .fi:hover {
            background: #e3f2fd
        }

        .fi input[type=checkbox] {
            accent-color: #0b3a6f;
            width: 14px;
            height: 14px
        }

        .fa {
            border-bottom: 2px solid #e3ecf7;
            font-weight: 700;
            padding: 7px 12px;
            background: #fafbfc
        }

        .ct {
            padding: 18px 22px
        }

        .db {
            background: #fff;
            border-radius: 13px;
            padding: 22px;
            min-height: 480px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .05);
            border: 1px solid #e5e7eb
        }

        .kr {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .kc {
            flex: 1;
            min-width: 170px;
            background: #fff;
            border-radius: 13px;
            padding: 18px;
            box-shadow: 0 3px 16px rgba(0, 0, 0, .05);
            border-left: 5px solid #0b3a6f;
            text-align: center;
            transition: transform .2s, box-shadow .2s
        }

        .kc:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(0, 0, 0, .1)
        }

        .kc.gn {
            border-left-color: #27ae60
        }

        .kc.rd {
            border-left-color: #e74c3c
        }

        .kc.or {
            border-left-color: #f39c12
        }

        .kc.bl {
            border-left-color: #2196f3
        }

        .kc.pu {
            border-left-color: #9b59b6
        }

        .kv {
            font-size: 28px;
            font-weight: 800;
            color: #0b3a6f
        }

        .kl {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            margin-top: 4px
        }

        .cb {
            background: #fff;
            border-radius: 13px;
            padding: 18px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, .04);
            margin-bottom: 18px;
            border: 1px solid #eef1f5
        }

        .cb h4 {
            font-size: 14px;
            font-weight: 700;
            color: #0b3a6f;
            margin-bottom: 12px;
            padding-bottom: 9px;
            border-bottom: 2px solid #e3ecf7;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .cr {
            display: flex;
            gap: 16px;
            flex-wrap: wrap
        }

        .ch {
            flex: 1;
            min-width: 370px
        }

        .tw {
            overflow-x: auto;
            margin-bottom: 16px;
            border-radius: 9px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
            max-height: 480px;
            overflow-y: auto
        }

        .dt {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px
        }

        .dt thead {
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .dt th {
            padding: 10px 8px;
            text-align: left;
            font-weight: 700;
            white-space: nowrap;
            font-size: 10px
        }

        .dt td {
            padding: 7px 8px;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap
        }

        .dt tbody tr:hover {
            background: #f0f7ff
        }

        .dt tbody tr:nth-child(even) {
            background: #fafbfc
        }

        .cg {
            background: #d4edda !important;
            color: #155724
        }

        .crd {
            background: #fee2e2 !important;
            color: #991b1b
        }

        .cy {
            background: #fff3cd !important;
            color: #856404
        }

        .co {
            background: #ffe0b2 !important;
            color: #e65100
        }

        .tr {
            color: #e74c3c !important;
            font-weight: 700
        }

        .st {
            font-size: 15px;
            font-weight: 800;
            color: #0b3a6f;
            margin-bottom: 16px;
            padding: 13px 18px;
            background: linear-gradient(135deg, #e3ecf7, #dce8fa);
            border-radius: 11px;
            display: flex;
            align-items: center;
            gap: 9px;
            border-left: 5px solid #0b3a6f
        }

        .stt {
            display: flex;
            margin-bottom: 18px;
            border-bottom: 3px solid #0b3a6f;
            background: #fff;
            border-radius: 11px 11px 0 0;
            overflow-x: auto
        }

        .stb {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            color: #666;
            border-bottom: 4px solid transparent;
            white-space: nowrap;
            transition: .2s
        }

        .stb:hover {
            background: #e3f2fd;
            color: #0b3a6f
        }

        .stb.act {
            color: #0b3a6f;
            border-bottom-color: #0b3a6f;
            font-weight: 800;
            background: #f0f7ff
        }

        .pg {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 14px;
            margin-top: 10px
        }

        .pg button {
            padding: 9px 22px;
            border: none;
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .12)
        }

        .pg button:disabled {
            opacity: .3;
            cursor: not-allowed;
            box-shadow: none
        }

        .pg button:not(:disabled):hover {
            background: linear-gradient(135deg, #1565c0, #1976d2)
        }

        .pg span {
            font-size: 13px;
            font-weight: 700;
            color: #0b3a6f;
            background: #e3ecf7;
            padding: 7px 14px;
            border-radius: 18px
        }

        .lgb {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin: 8px 0;
            font-size: 11px
        }

        .lgi {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .lgd {
            width: 13px;
            height: 13px;
            border-radius: 2px;
            display: inline-block
        }

        .frst {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 1px 4px;
            color: #aaa;
            transition: .2s;
            margin-left: 6px;
            vertical-align: middle
        }

        .frst:hover {
            color: #e74c3c;
            transform: rotate(-90deg)
        }

        @media(max-width:900px) {
            .nav {
                flex-wrap: wrap
            }

            .ch {
                min-width: 100%
            }

            .kr {
                flex-direction: column
            }

            .hdr {
                padding: 0 10px
            }

            .hdr h1 {
                font-size: 15px
            }

            .fs {
                padding: 8px 10px
            }
        }
    </style>
</head>

<body>
    <div class="hdr">
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2.5" />
                <path d="M35 25L35 75M65 25L65 75M35 50L65 50M25 38L75 38M25 62L75 62" stroke="#fff" stroke-width="3.5"
                    stroke-linecap="round" />
                <circle cx="50" cy="18" r="5" fill="#64b5f6" />
                <circle cx="50" cy="82" r="5" fill="#64b5f6" /><text x="50" y="98" text-anchor="middle" fill="#64b5f6"
                    font-size="9" font-weight="bold">PEV</text>
            </svg>
            <span style="font-weight:700;font-size:14px">PEV</span>
        </div>
        <h1>Dashboard PEV de routine – RDC</h1>
        <div class="ibtn" title="Info"><i>i</i></div>
    </div>
    <div class="nav" id="NAV"></div>
    <div class="lb" id="LB">
        <div class="st" id="LS">⏳ Initialisation...</div>
        <div class="pw">
            <div class="pf" id="PF" style="width:0%"></div>
        </div>
        <div class="pt" id="PT"></div>
    </div>
    <div class="fs" id="FS"></div>
    <div class="ct">
        <div class="db" id="DB">
            <div style="text-align:center;padding:70px;color:#888">
                <div style="font-size:48px;margin-bottom:14px">📊</div>
                <h3>Chargement...</h3>
            </div>
        </div>
        <div class="pg" id="PG" style="display:none"><button id="BP" onclick="chPg(-1)" disabled>◀
                Précédent</button><span id="PI">Page 1/5</span><button id="BN" onclick="chPg(1)">Suivant ▶</button>
        </div>
    </div>

    <script>
        /* ═══ CONFIGURATION ═══ */
        var C = {
            MA: 11, CT: 0.33, CD: 0.10,
            VAP_PROV: ['Kongo Central', 'Kwango', 'Kwilu', 'Maindombe', 'Equateur', 'Tshuapa', 'Mongala', 'Sud-Ubangi', 'Nord-Ubangi', 'Bas-Uele', 'Haut-Uele', 'Tshopo', 'Maniema', 'Lomami', 'Haut-Lomami', 'Kasai Central'],
            BR: [[90, 20], [80, 16], [70, 12], [60, 8], [50, 4], [0, 0]],
            BA: [[0, 20], [5.01, 16], [10.01, 12], [20.01, 8], [30.01, 4], [50.01, 0]]
        };

        var AG = ['BCG', 'VPO0', 'DTC1', 'VPO1', 'ROTA1', 'PCV13_1', 'DTC2', 'VPO2', 'ROTA2', 'PCV13_2',
            'DTC3', 'VPO3', 'VPI1', 'ROTA3', 'PCV13_3', 'VAR1', 'VPI2', 'VAA', 'VAR2', 'TD'];
        var AG_VAP = ['VAP1', 'VAP2', 'VAP3', 'VAP4'];
        var AG_ALL = AG.concat(AG_VAP);

        var AG_LBL = {
            BCG: 'BCG', VPO0: 'VPO0', DTC1: 'DTC1/Penta1', VPO1: 'VPO1', ROTA1: 'ROTA1',
            PCV13_1: 'PCV13-1', DTC2: 'DTC2/Penta2', VPO2: 'VPO2', ROTA2: 'ROTA2', PCV13_2: 'PCV13-2',
            DTC3: 'DTC3/Penta3', VPO3: 'VPO3', VPI1: 'VPI1', ROTA3: 'ROTA3', PCV13_3: 'PCV13-3',
            VAR1: 'VAR1', VPI2: 'VPI2', VAA: 'VAA', VAR2: 'VAR2', TD: 'Td 2+',
            VAP1: 'VAP1', VAP2: 'VAP2', VAP3: 'VAP3', VAP4: 'VAP4'
        };

        var AG_FIELD_MAP = {
            BCG: 'BCG_0_11', VPO0: 'VPO0_0_11', DTC1: 'DTC1_0_11', VPO1: 'VPO1_0_11',
            ROTA1: 'ROTA1_0_11', PCV13_1: 'PCV13_1_0_11', DTC2: 'DTC2_0_11', VPO2: 'VPO2_0_11',
            ROTA2: 'ROTA2_0_11', PCV13_2: 'PCV13_2_0_11', DTC3: 'DTC3_0_11', VPO3: 'VPO3_0_11',
            VPI1: 'VPI1_0_11', ROTA3: 'ROTA3_0_11', PCV13_3: 'PCV13_3_0_11',
            VAR1: 'VAR1_0_11', VPI2: 'VPI2_0_11', VAA: 'VAA_0_11', VAR2: 'VAR2_0_11',
            TD: 'Td_2_plus',
            VAP1: 'VAP1_0_11', VAP2: 'VAP2_0_11', VAP3: 'VAP3_0_11', VAP4: 'VAP4_12_23'
        };

        var SAME_AGE = [
            { age: 'Naissance', v: ['BCG', 'VPO0'] },
            { age: '6 semaines', v: ['DTC1', 'VPO1', 'ROTA1', 'PCV13_1'] },
            { age: '10 semaines', v: ['DTC2', 'VPO2', 'ROTA2', 'PCV13_2'] },
            { age: '14 semaines', v: ['DTC3', 'VPO3', 'VPI1', 'ROTA3', 'PCV13_3'] },
            { age: '9 mois', v: ['VAR1', 'VPI2', 'VAA'] }
        ];

        var TABS = [
            {
                id: 'oqd', lb: 'Outil qualité données', fl: ['province', 'antenne', 'zs', 'as', 'fosa', 'period'],
                pp: [{ t: '1. Complétude et Promptitude', ic: '📋' }, { t: '2. Cohérence-temps', ic: '📈' }, { t: '3. Cohérence-donnée', ic: '🔗' }, { t: '4. Valeurs atypiques', ic: '⚠️' }, { t: '5. Score qualité des données', ic: '🏆' }]
            },
            { id: 'fosa', lb: 'FOSA', fl: ['province', 'antenne', 'zs', 'as', 'fosa', 'period'], pp: [{ t: 'Tableau de bord FOSA', ic: '🏥' }] },
            { id: 'as', lb: 'Aire de Santé', fl: ['province', 'antenne', 'zs', 'as', 'period'], pp: [{ t: 'Tableau de bord AS', ic: '📍' }] },
            { id: 'zs', lb: 'Zone de Santé', fl: ['province', 'antenne', 'zs', 'period'], pp: [{ t: 'Tableau de bord ZS', ic: '🗺️' }] },
            { id: 'ant', lb: 'Antenne PEV', fl: ['province', 'antenne', 'period'], pp: [{ t: 'Tableau de bord Antenne', ic: '📡' }] },
            { id: 'nat', lb: 'National', fl: ['province', 'period'], pp: [{ t: 'Tableau de bord National', ic: '🇨🇩' }] },
            { id: 'gen', lb: 'Aperçu général', fl: ['province', 'antenne', 'zs', 'as', 'fosa', 'period'], pp: [{ t: 'Aperçu général', ic: '🎯' }] }
        ];

        /* ═══ STATE ═══ */
        var BASE = './data/dashboard';
        var S = {
            tab: 0, pg: 0, data: [], flt: [], charts: {}, filters: { province: '', antenne: [], zs: [], as: [], fosa: [], period: [] },
            vals: { province: [], antenne: [], zs: [], as: [], fosa: [], period: [] },
            cascaded: { antenne: [], zs: [], as: [], fosa: [] },
            loaded: false, meta: null,
            hmIndex: {}, hmCache: {}, heatmap: {},
            fosaIndex: {}, fosaCache: {}, fosaData: [],
            asIndex: {}, asCache: {}, asData: [],
            zsData: []
        };

        /* ═══ UTILITIES ═══ */
        function mL(ym) { if (!ym || ym.length < 6) return ym || ''; var n = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc']; return n[parseInt(ym.substr(4, 2), 10) - 1] + ' ' + ym.substr(0, 4); }
        function grp(a, fn) { var g = {}; a.forEach(function (r) { var k = fn(r) || '_'; if (!g[k]) g[k] = []; g[k].push(r); }); return g; }
        function sf(a, f) { return a.reduce(function (s, r) { return s + (Number(r[f]) || 0); }, 0); }
        function af(a, f) { return a.length ? sf(a, f) / a.length : 0; }
        function uv(a, fn) { var s = {}, r = []; a.forEach(function (x) { var v = fn(x); if (v && !s[v]) { s[v] = 1; r.push(v); } }); return r.sort(); }
        function pct(n, d) { return d ? (n / d * 100) : 0; }
        function tr(s, n) { return s && s.length > n ? s.substr(0, n - 1) + '…' : s; }
        function E(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
        function isRep(r) { return r.completude > 0; }
        function isVAP(r) { return r.isVAP; }
        function obAg(r) { return isVAP(r) ? AG.concat(AG_VAP) : AG; }
        function obTotal(r) { return obAg(r).length; }
        function cntRens(r) { var c = 0; obAg(r).forEach(function (a) { if ((Number(r[a + '_f']) || 0) > 0) c++; }); return c; }
        function exh(r) { return pct(cntRens(r), obTotal(r)); }
        function missAg(r) { return obAg(r).filter(function (a) { return !(Number(r[a + '_f']) || 0); }); }
        function mAvg(fosa, ag, per, data, N) { var d = data.filter(function (r) { return r.org5 === fosa && r.period < per && (Number(r[ag]) || 0) > 0; }); d.sort(function (a, b) { return b.period < a.period ? -1 : 1; }); var sub = d.slice(0, N); if (!sub.length) return null; return sub.reduce(function (s, r) { return s + (Number(r[ag]) || 0); }, 0) / sub.length; }
        function chkCoh(r) { var ok = true; SAME_AGE.forEach(function (g) { for (var i = 0; i < g.v.length - 1; i++) { var a = Number(r[g.v[i]]) || 0, b = Number(r[g.v[i + 1]]) || 0; var den = b || a || 1; if (Math.abs((a - b) / den) > C.CD) ok = false; } }); return ok; }
        function ccl(v) { return v >= 80 ? 'cg' : v >= 50 ? 'cy' : 'crd'; }
        function sB(val, bar) { for (var i = 0; i < bar.length; i++) { if (val >= bar[i][0]) return bar[i][1]; } return 0; }
        function sBA(v) { if (v <= 5) return 20; if (v <= 10) return 16; if (v <= 20) return 12; if (v <= 30) return 8; if (v <= 50) return 4; return 0; }
        function getOrgLevel(D) {
            var f = S.filters;
            if (f.as && f.as.length === 1) return { k: 'org5', l: 'FOSA' };
            if (f.zs && f.zs.length === 1) return { k: 'org4', l: 'Aire de Santé' };
            if (f.antenne && f.antenne.length === 1) return { k: 'org3', l: 'Zone de Santé' };
            var nbAnt = uv(D, function (r) { return r.antenne; }).length;
            if (nbAnt > 1) return { k: 'antenne', l: 'Antenne PEV' };
            return { k: 'org3', l: 'Zone de Santé' };
        }
        function sp(p, t, s) { var a = document.getElementById('PF'), b = document.getElementById('PT'), c = document.getElementById('LS'); if (a) a.style.width = p + '%'; if (b && t) b.textContent = t; if (c && s) c.textContent = s; }

        /* ═══ DEFAULT PERIOD ═══ */
        function getDefaultPeriod(months) {
            if (!months || !months.length) return [];
            var now = new Date(), day = now.getDate(), yr = now.getFullYear(), mo = now.getMonth() + 1;
            if (day < 20) { mo -= 2; } else { mo -= 1; }
            if (mo <= 0) { mo += 12; yr -= 1; }
            var ym = '' + yr + (mo < 10 ? '0' : '') + mo;
            if (months.indexOf(ym) >= 0) return [ym];
            return [months[months.length - 1]];
        }

        /* ═══ TRANSFORM RECORD ═══ */
        function transformRecord(r) {
            var rec = {
                org2: r._Province || '', org3: r._ZS || '', org4: r._AS || '', org5: r._FOSA || '',
                antenne: r._Antenne || '', period: r._YM || '',
                completude: Number(r.comp) || 0, promptitude: Number(r.prompt) || 0,
                isVAP: C.VAP_PROV.indexOf(r._Province) >= 0,
                _n: Number(r.n) || 0, _rap: Number(r.rap) || 0
            };
            AG_ALL.forEach(function (ag) {
                var src = AG_FIELD_MAP[ag];
                var val = src ? (Number(r[src]) || 0) : 0;
                rec[ag] = val; rec[ag + '_f'] = val;
            });
            return rec;
        }

        /* ═══ DATA LOADING ═══ */
        async function loadAll() {
            var t0 = Date.now(); sp(10, 'Chargement...', '⏳ Chargement...');
            try {
                var [mR, pR, zR, hmR, fosaR, asR] = await Promise.all([
                    fetch(BASE + '/meta.json?t=' + Date.now()),
                    fetch(BASE + '/by_province.json'),
                    fetch(BASE + '/by_zs.json'),
                    fetch(BASE + '/heatmap/manifest.json').catch(function () { return { ok: true, json: function () { return Promise.resolve({}); } } }),
                    fetch(BASE + '/by_fosa/manifest.json').catch(function () { return { ok: true, json: function () { return Promise.resolve({}); } } }),
                    fetch(BASE + '/by_as/manifest.json').catch(function () { return { ok: true, json: function () { return Promise.resolve({}); } } })
                ]);
                sp(40, 'Parsing...');
                S.meta = await mR.json();
                await pR.json(); // by_province loaded but not primary
                var byZS = await zR.json();
                S.hmIndex = await hmR.json();
                S.fosaIndex = await fosaR.json();
                S.asIndex = await asR.json();
                S.hmCache = {}; S.fosaCache = {}; S.asCache = {};

                sp(55, 'Transformation ZS...');
                S.zsData = byZS.map(transformRecord);
                S.data = S.zsData;

                if (byZS.length > 0) {
                    console.log('=== PREMIER ENREGISTREMENT by_zs ===');
                    console.log(Object.keys(byZS[0]).join(', '));
                }

                /* Construire les listes globales */
                var v = {
                    province: (S.meta.provinces || []).sort(),
                    antenne: S.meta.antennes || [],
                    zs: S.meta.zs || [],
                    as: S.meta.as || [],
                    fosa: S.meta.fosa || [],
                    period: (S.meta.months || []).sort()
                };

                /* Compléter AS/FOSA depuis les données ZS si meta ne les a pas */
                if (!v.as.length) S.zsData.forEach(function (r) { if (r.org4 && v.as.indexOf(r.org4) < 0) v.as.push(r.org4); });
                if (!v.fosa.length) S.zsData.forEach(function (r) { if (r.org5 && v.fosa.indexOf(r.org5) < 0) v.fosa.push(r.org5); });
                v.as.sort(); v.fosa.sort();
                S.vals = v;

                /* ═══ DEFAULTS ═══ */
                /* Province = première par ordre alphabétique */
                S.filters.province = v.province.length ? v.province[0] : '';
                /* Période = défaut intelligent */
                S.filters.period = getDefaultPeriod(v.period);

                sp(70, 'Chargement FOSA/AS province...');
                /* Charger les données FOSA+AS de la province par défaut */
                await loadProvinceData(S.filters.province);

                sp(85, 'Calcul filtres...');
                computeCascade(true);
                S.loaded = true;

                sp(90, 'Rendu...');
                bNav(); rFlt(); apFlt(); render();
                var dt = ((Date.now() - t0) / 1000).toFixed(1);
                sp(100, (S.meta.total_records || S.data.length).toLocaleString() + ' enreg. | ' + v.period.length + ' mois | ' + (S.meta.nb_fosa || v.fosa.length) + ' FOSA', '⚡ Prêt en ' + dt + 's');
            } catch (e) {
                console.error(e); sp(0, '❌ ' + e.message, '❌ Erreur');
                document.getElementById('DB').innerHTML = '<div style="text-align:center;padding:60px;color:#e74c3c"><h3>❌ Erreur</h3><p>' + e.message + '</p></div>';
            }
        }

        /* Charger données FOSA+AS pour UNE province */
        async function loadProvinceData(prov) {
            if (!prov) return;
            var promises = [];
            if (S.fosaIndex[prov] && !S.fosaCache[prov]) {
                promises.push(fetch(BASE + '/by_fosa/' + S.fosaIndex[prov]).then(function (r) { return r.json(); }).then(function (d) { S.fosaCache[prov] = d; }).catch(function () { }));
            }
            if (S.asIndex[prov] && !S.asCache[prov]) {
                promises.push(fetch(BASE + '/by_as/' + S.asIndex[prov]).then(function (r) { return r.json(); }).then(function (d) { S.asCache[prov] = d; }).catch(function () { }));
            }
            if (promises.length) await Promise.all(promises);

            /* Construire fosaData et asData pour cette province */
            S.fosaData = []; S.asData = [];
            var fd = S.fosaCache[prov];
            if (fd && fd.length) fd.forEach(function (r) { S.fosaData.push(transformRecord(r)); });
            var ad = S.asCache[prov];
            if (ad && ad.length) ad.forEach(function (r) { S.asData.push(transformRecord(r)); });

            /* Utiliser le niveau le plus fin disponible */
            if (S.fosaData.length) S.data = S.fosaData;
            else if (S.asData.length) S.data = S.asData;
            else S.data = S.zsData.filter(function (r) { return r.org2 === prov; });

            console.log('Province ' + prov + ': FOSA=' + S.fosaData.length + ' AS=' + S.asData.length + ' ZS=' + S.data.length);
        }

        /* ═══ CASCADING FILTERS ═══ */
        function computeCascade(autoFill) {
            var src = S.data;

            var avAnt = uv(src, function (r) { return r.antenne; });
            S.cascaded.antenne = avAnt;
            S.filters.antenne = S.filters.antenne.filter(function (a) { return avAnt.indexOf(a) >= 0; });
            if (autoFill && !S.filters.antenne.length) S.filters.antenne = avAnt.slice();

            var srcAnt = S.filters.antenne.length ? src.filter(function (r) { return S.filters.antenne.indexOf(r.antenne) >= 0; }) : src;
            var avZS = uv(srcAnt, function (r) { return r.org3; });
            S.cascaded.zs = avZS;
            S.filters.zs = S.filters.zs.filter(function (a) { return avZS.indexOf(a) >= 0; });
            if (autoFill && !S.filters.zs.length) S.filters.zs = avZS.slice();

            var srcZS = S.filters.zs.length ? srcAnt.filter(function (r) { return S.filters.zs.indexOf(r.org3) >= 0; }) : srcAnt;
            var avAS = uv(srcZS, function (r) { return r.org4; });
            S.cascaded.as = avAS;
            S.filters.as = S.filters.as.filter(function (a) { return avAS.indexOf(a) >= 0; });
            if (autoFill && !S.filters.as.length) S.filters.as = avAS.slice();

            var srcAS = S.filters.as.length ? srcZS.filter(function (r) { return S.filters.as.indexOf(r.org4) >= 0; }) : srcZS;
            var avFOSA = uv(srcAS, function (r) { return r.org5; });
            S.cascaded.fosa = avFOSA;
            S.filters.fosa = S.filters.fosa.filter(function (a) { return avFOSA.indexOf(a) >= 0; });
            if (autoFill && !S.filters.fosa.length) S.filters.fosa = avFOSA.slice();
        }
        /* ═══ APPLY FILTER ═══ */
        function apFlt() {
            var f = S.filters;
            S.flt = S.data.filter(function (r) {
                if (f.province && r.org2 !== f.province) return false;
                if (f.antenne.length && f.antenne.indexOf(r.antenne) < 0) return false;
                if (f.zs.length && f.zs.indexOf(r.org3) < 0) return false;
                if (f.as.length && f.as.indexOf(r.org4) < 0) return false;
                if (f.fosa.length && f.fosa.indexOf(r.org5) < 0) return false;
                if (f.period.length && f.period.indexOf(r.period) < 0) return false;
                return true;
            });
        }

        /* ═══ RENDER FILTERS ═══ */
        function rFlt() {
            var c = document.getElementById('FS'); c.innerHTML = '';
            var tab = TABS[S.tab];

            /* 1) PROVINCE - choix unique (select) */
            if (tab.fl.indexOf('province') >= 0) {
                var fg = E('div', 'fg');
                var plbl = document.createElement('label'); plbl.textContent = 'Province';
                var prst = document.createElement('button'); prst.className = 'frst'; prst.innerHTML = '↺'; prst.title = 'Réinitialiser Province';
                prst.onclick = function (e) {
                    e.stopPropagation();
                    S.filters.province = S.vals.province[0] || '';
                    S.filters.antenne = []; S.filters.zs = []; S.filters.as = []; S.filters.fosa = [];
                    sp(50, 'Chargement...', '⏳');
                    loadProvinceData(S.filters.province).then(function () { computeCascade(true); rFlt(); apFlt(); render(); sp(100, '', '⚡ Prêt'); });
                };
                plbl.appendChild(prst);
                fg.appendChild(plbl);
                var sel = document.createElement('select');
                S.vals.province.forEach(function (p) {
                    var o = document.createElement('option'); o.value = p; o.textContent = p;
                    if (p === S.filters.province) o.selected = true;
                    sel.appendChild(o);
                });
                sel.onchange = function () {
                    S.filters.province = sel.value;
                    S.filters.antenne = []; S.filters.zs = []; S.filters.as = []; S.filters.fosa = [];
                    sp(50, 'Chargement province...', '⏳ Changement...');
                    loadProvinceData(sel.value).then(function () {
                        computeCascade(true); rFlt(); apFlt(); render();
                        sp(100, '', '⚡ Prêt');
                    });
                };
                fg.appendChild(sel); c.appendChild(fg);
            }

            /* 2-5) ANTENNE, ZS, AS, FOSA - multichoix en cascade */
            var cascDims = [
                { dim: 'antenne', l: 'Antenne PEV', k: 'antenne' },
                { dim: 'zs', l: 'Zone de Santé', k: 'zs' },
                { dim: 'as', l: 'Aire de Santé', k: 'as' },
                { dim: 'fosa', l: 'FOSA', k: 'fosa' }
            ];
            cascDims.forEach(function (info) {
                if (tab.fl.indexOf(info.dim) < 0) return;
                var avail = S.cascaded[info.k] || [];
                if (!avail.length) return;
                var selArr = S.filters[info.k];
                buildMultiFilter(c, info, avail, selArr, info.dim);
            });

            /* 6) PÉRIODE - multichoix */
            if (tab.fl.indexOf('period') >= 0) {
                buildMultiFilter(c, { l: 'Période', k: 'period' }, S.vals.period, S.filters.period, 'period');
            }
        }

        function buildMultiFilter(container, info, options, selected, dimKey) {
            var g = E('div', 'fg');
            var lbl = document.createElement('label');
            lbl.textContent = info.l;
            /* Bouton reset ↺ */
            var rst = document.createElement('button'); rst.className = 'frst'; rst.innerHTML = '↺'; rst.title = 'Réinitialiser ' + info.l;
            rst.onclick = function (e) {
                e.stopPropagation();
                if (dimKey === 'period') { S.filters.period = getDefaultPeriod(S.vals.period); }
                else { S.filters[dimKey] = (S.cascaded[dimKey] || options).slice(); }
                if (dimKey !== 'period') computeCascade(false);
                apFlt(); rFlt(); render();
            };
            lbl.appendChild(rst);
            g.appendChild(lbl);

            var bt = document.createElement('button'); bt.className = 'fbtn';
            var tot = options.length, nSel = selected.length;
            var btnLabel;
            if (dimKey === 'period' && nSel === 1) { btnLabel = mL(selected[0]); }
            else if (nSel === tot && tot > 0) { btnLabel = 'Tout (' + tot + ')'; }
            else { btnLabel = nSel + '/' + tot; }
            bt.innerHTML = '<span>' + btnLabel + '</span><span class="cn">' + nSel + '</span><span>▼</span>';
            bt.onclick = function (e) {

                document.querySelectorAll('.fd').forEach(function (el) { if (el.id !== 'fd-' + dimKey) el.classList.remove('sh'); });
                document.getElementById('fd-' + dimKey).classList.toggle('sh');

            g.appendChild(bt);

            var dd = E('div', 'fd'); dd.id = 'fd-' + dimKey;
            var sr = document.createElement('input'); sr.className = 'sr'; sr.placeholder = 'Rechercher...'; sr.type = 'text';
            sr.oninput = function () { var q = sr.value.toLowerCase(); dd.querySelectorAll('.fi:not(.fa)').forEach(function (it) { it.style.display = it.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none'; }); };
            dd.appendChild(sr);

            /* Tout sélectionner */
            var aD = E('div', 'fi fa');
            var aC = document.createElement('input'); aC.type = 'checkbox';
            aC.checked = (nSel === tot && tot > 0);
            aC.onchange = function () {
                if (aC.checked) { S.filters[dimKey] = options.slice(); }
                else { S.filters[dimKey] = []; }
                if (dimKey !== 'period') computeCascade(false);
                apFlt(); rFlt(); render();
                setTimeout(function () { var el = document.getElementById('fd-' + dimKey); if (el) el.classList.add('sh'); }, 60);
            };
            aD.appendChild(aC);
            var aS = document.createElement('span'); aS.textContent = 'Tout sélectionner'; aS.style.fontWeight = '700';
            aD.appendChild(aS); dd.appendChild(aD);

            /* Options individuelles */
            options.forEach(function (v) {
                var it = E('div', 'fi');
                var cb = document.createElement('input'); cb.type = 'checkbox';
                cb.checked = (selected.indexOf(v) >= 0);
                cb.onchange = function () {
                    if (cb.checked) { if (S.filters[dimKey].indexOf(v) < 0) S.filters[dimKey].push(v); }
                    else { S.filters[dimKey] = S.filters[dimKey].filter(function (x) { return x !== v; }); }
                    if (dimKey !== 'period') computeCascade(false);
                    apFlt(); rFlt(); render();
                    setTimeout(function () { var el = document.getElementById('fd-' + dimKey); if (el) el.classList.add('sh'); }, 60);
                };
                it.appendChild(cb);
                var sp2 = document.createElement('span'); sp2.textContent = dimKey === 'period' ? mL(v) : v;
                it.appendChild(sp2); dd.appendChild(it);
            });

            g.appendChild(dd); container.appendChild(g);
        }

        /* Fermer les dropdowns en cliquant ailleurs */
        document.addEventListener('click', function (e) { if (!e.target.closest('.fg')) document.querySelectorAll('.fd').forEach(function (el) { el.classList.remove('sh'); }); });

        /* ═══ NAV ═══ */
        function bNav() {
            var nav = document.getElementById('NAV'); nav.innerHTML = '';
            TABS.forEach(function (tab, ti) {
                var mi = document.createElement('div');
                mi.className = 'mi' + (ti === S.tab ? ' act' : '');
                mi.id = 'mi-' + tab.id;

                /* Le texte de l'onglet */
                var sp1 = document.createElement('span'); sp1.textContent = tab.lb;
                mi.appendChild(sp1);

                /* Flèche ▼ uniquement si sous-pages */
                if (tab.pp.length > 1) {
                    var arr = document.createElement('span');
                    arr.style.cssText = 'font-size:10px;margin-left:3px;opacity:.6';
                    arr.textContent = '▼';
                    mi.appendChild(arr);
                }

                /* Dropdown des sous-pages */
                if (tab.pp.length > 0) {
                    var dd = document.createElement('div');
                    dd.className = 'dd';
                    dd.id = 'dd-' + tab.id;

                    tab.pp.forEach(function (pg, pi) {
                        var di = document.createElement('div');
                        di.className = 'di' + (ti === S.tab && pi === S.pg ? ' as' : '');
                        di.innerHTML = '<span>' + pg.ic + '</span> ' + pg.t;

                        /* Clic sur un item → navigation immédiate */
                        di.addEventListener('click', function (ev) {
                            ev.stopPropagation();
                            ev.preventDefault();
                            navTo(ti, pi);
                        });

                        dd.appendChild(di);
                    });

                    mi.appendChild(dd);
                }

                /* Clic sur l'onglet lui-même → page 0 (seulement si pas cliqué dans le dropdown) */
                mi.addEventListener('click', function (ev) {

                });

                nav.appendChild(mi);
            });
        }
        function navTo(t, p) {

            var dd = document.getElementById('dd-' + TABS[t].id); if (dd) dd.querySelectorAll('.di').forEach(function (el, i) { el.classList.toggle('as', i === p); });
            rFlt(); apFlt(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function chPg(d) { var tab = TABS[S.tab], np = S.pg + d; if (np >= 0 && np < tab.pp.length) { S.pg = np; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

        /* ═══ RENDER ═══ */
        function render() {
            Object.values(S.charts).forEach(function (c) { try { c.destroy(); } catch (e) { } }); S.charts = {};
            var db = document.getElementById('DB'); db.innerHTML = '';
            var tab = TABS[S.tab], pg = tab.pp[S.pg];
            db.appendChild(E('div', 'st', '<span>' + pg.ic + '</span> ' + pg.t + ' <span style="font-size:12px;font-weight:400;color:#666;margin-left:12px">Province: ' + S.filters.province + '</span>'));
            var ct = E('div', '', ''); ct.id = 'PC'; db.appendChild(ct);
            if (tab.id === 'oqd') { [rP1, rP2, rP3, rP4, rP5][S.pg](ct); }
            else { ct.innerHTML = '<div style="text-align:center;padding:70px;color:#888"><h3>' + tab.lb + ' — En construction</h3></div>'; }
            var bar = document.getElementById('PG');
            if (tab.pp.length > 1) { bar.style.display = 'flex'; document.getElementById('PI').textContent = 'Page ' + (S.pg + 1) + ' sur ' + tab.pp.length; document.getElementById('BP').disabled = S.pg === 0; document.getElementById('BN').disabled = S.pg >= tab.pp.length - 1; }
            else { bar.style.display = 'none'; }
        }
        function ctxLbl() {
            var f = S.filters;
            if (f.fosa && f.fosa.length === 1) return ' FOSA: ' + f.fosa[0];
            if (f.as && f.as.length === 1) return ' AS: ' + f.as[0];
            if (f.zs && f.zs.length === 1) return ' ZS: ' + f.zs[0];
            if (f.province) return ' Province: ' + f.province;
            return '';
        }

        /* ═══ P1: COMPLÉTUDE & PROMPTITUDE ═══ */
        function rP1(c) {
            var D = S.flt, rep = D.filter(isRep), nT = D.length, nNR = nT - rep.length;
            var pR = pct(rep.length, nT);
            var aE = rep.length ? rep.reduce(function (s, r) { return s + exh(r); }, 0) / rep.length : 0;
            var nF = uv(D, function (r) { return r.org5; }).length;
            c.appendChild(E('div', 'kr',
                '<div class="kc gn"><div class="kv">' + rep.length + '</div><div class="kl">FOSA rapportantes</div></div>' +
                '<div class="kc rd"><div class="kv">' + nNR + '</div><div class="kl">FOSA non-rapportantes</div></div>' +
                '<div class="kc bl"><div class="kv">' + pR.toFixed(1) + '%</div><div class="kl">% rapportage</div></div>' +

                ld2.forEach(function (r) {

        /* ═══ P5: SCORE QUALITÉ ═══ */
        function rP5(c) {
            c.innerHTML = '<div class="stt" id="sTabs"><div class="stb act" onclick="sSL(0)">FOSA</div><div class="stb" onclick="sSL(1)">AS</div><div class="stb" onclick="sSL(2)">ZS</div><div class="stb" onclick="sSL(3)">Antenne</div></div><div id="sC"></div>';
            setTimeout(function () { sSL(0); }, 40);
        }
        window.sSL = function (lv) {
            document.querySelectorAll('#sTabs .stb').forEach(function (t, i) { t.classList.toggle('act', i === lv); });
            var sc = document.getElementById('sC'); sc.innerHTML = '';
            var D = S.flt, AD = S.data, mos = uv(D, function (r) { return r.period; }), N = C.MA, thr = C.CT, lastM = mos[mos.length - 1];

                if (lastM) { rep.filter(function (r) { return r.period === lastM; }).forEach(function (r) { AG.forEach(function (ag) { var val = Number(r[ag]) || 0; if (!val) return; tV++; var avg = mAvg(r.org5, ag, lastM, AD, N); if (avg && avg > 0 && Math.abs((val - avg) / avg) > thr) aV++; }); }); }
                var pA = tV ? (aV / tV * 100) : 0;
                var d1 = sf(rc, 'DTC1'), d3 = sf(rc, 'DTC3'), dr = d1 ? ((d1 - d3) / d1 * 100) : 0;
                var scR = sB(tR, C.BR), scE = sB(aE, C.BR), scC = bCoh ? 20 : 0, scA = sBA(pA), scD = dr >= 0 ? 20 : 0;
                var tot = scR + scE + scC + scA + scD;
                var interp = tot >= 80 ? 'Excellent' : (tot >= 50 ? 'Bon' : 'Mauvais');
                var notes = [];
                if (tot < 50) { if (scR < 12) notes.push('Rapp'); if (scE < 12) notes.push('Exh'); if (!bCoh) notes.push('Coh'); if (scA < 12) notes.push('Atyp'); if (scD === 0) notes.push('Drop'); }
                return { u: u, nT: nT, nR: nR, tR: tR, aE: aE, bCoh: bCoh, pA: pA, dr: dr, scR: scR, scE: scE, scC: scC, scA: scA, scD: scD, tot: tot, interp: interp, notes: notes.join('; ') };
            });

            var exc = rows.filter(function (r) { return r.interp === 'Excellent'; }).length;
            var bon = rows.filter(function (r) { return r.interp === 'Bon'; }).length;
            var mau = rows.filter(function (r) { return r.interp === 'Mauvais'; }).length;

            sc.innerHTML = '<div class="kr" style="margin-bottom:16px"><div class="kc gn"><div class="kv">' + exc + '</div><div class="kl">Excellent ≥80</div></div><div class="kc or"><div class="kv">' + bon + '</div><div class="kl">Bon 50-79</div></div><div class="kc rd"><div class="kv">' + mau + '</div><div class="kl">Mauvais <50</div></div><div class="kc bl"><div class="kv">' + avg2.toFixed(0) + '</div><div class="kl">Moy /100</div></div></div>';

            sc.innerHTML += '<div class="cb"><h4>📊 Distribution</h4><canvas id="sDist" height="45"></canvas></div>';
            setTimeout(function () {
                var x = document.getElementById('sDist'); if (!x) return;
                var bins = [[0, 20], [20, 40], [40, 60], [60, 80], [80, 101]], bL = bins.map(function (b) { return b[0] + '-' + (b[1] === 101 ? 100 : b[1]); }), bC = bins.map(function (b) { return rows.filter(function (r) { return r.tot >= b[0] && r.tot < b[1]; }).length; });
                S.charts.sDist = new Chart(x, { type: 'bar', data: { labels: bL, datasets: [{ data: bC, backgroundColor: ['#e74c3c', '#ff7043', '#f39c12', '#66bb6a', '#27ae60'], borderRadius: 5 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            }, 60);

            var h = '<div class="tw"><table class="dt"><thead><tr><th>' + lvC.l + '</th><th>Att</th><th>Prod</th><th>Rapp%</th><th>Sc</th><th>Exh%</th><th>Sc</th><th>Coh</th><th>Sc</th><th>Atyp%</th><th>Sc</th><th>Drop%</th><th>Sc</th><th>SCORE</th><th>Int</th><th>Notes</th></tr></thead><tbody>';
            rows.forEach(function (r) {
                var scCol = r.tot >= 80 ? '#27ae60' : (r.tot >= 50 ? '#f39c12' : '#e74c3c');
                var intC = r.interp === 'Excellent' ? 'cg' : (r.interp === 'Bon' ? 'cy' : 'crd');
                h += '<tr><td><b>' + tr(r.u, 24) + '</b></td><td>' + r.nT + '</td><td>' + r.nR + '</td><td class="' + ccl(r.tR) + '">' + r.tR.toFixed(1) + '%</td><td style="font-weight:700">' + r.scR + '</td><td class="' + ccl(r.aE) + '">' + r.aE.toFixed(1) + '%</td><td style="font-weight:700">' + r.scE + '</td><td class="' + (r.bCoh ? 'cg' : 'crd') + '">' + (r.bCoh ? 'O' : 'N') + '</td><td style="font-weight:700">' + r.scC + '</td><td>' + r.pA.toFixed(1) + '%</td><td style="font-weight:700">' + r.scA + '</td><td class="' + (r.dr < 0 ? 'crd' : '') + '">' + r.dr.toFixed(1) + '%</td><td style="font-weight:700">' + r.scD + '</td><td style="background:' + scCol + ';color:#fff;text-align:center;font-weight:800;font-size:15px">' + r.tot + '</td><td class="' + intC + '" style="font-weight:700">' + r.interp + '</td><td style="font-size:9px;color:#e74c3c">' + r.notes + '</td></tr>';
            });
            sc.innerHTML += h + '</tbody></table></div>';
        };
