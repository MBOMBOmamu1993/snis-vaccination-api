<div class="ct"><div class="db" id="DB"><div style="text-align:center;padding:70px;color:#888"><div style="font-size:48px;margin-bottom:14px">📊</div><h3>Chargement...</h3></div></div>
<div class="pg" id="PG" style="display:none"><button id="BP" onclick="chPg(-1)" disabled>◀ Précédent</button><span id="PI">Page 1/5</span><button id="BN" onclick="chPg(1)">Suivant ▶</button></div></div>

<script>
/* ═══ CONFIGURATION ═══ */
var C={
  MA:11,CT:0.33,CD:0.10,
  VAP_PROV:['Kongo Central','Kwango','Kwilu','Maindombe','Equateur','Tshuapa','Mongala','Sud-Ubangi','Nord-Ubangi','Bas-Uele','Haut-Uele','Tshopo','Maniema','Lomami','Haut-Lomami','Kasai Central'],
  BR:[[90,20],[80,16],[70,12],[60,8],[50,4],[0,0]],
  BA:[[0,20],[5.01,16],[10.01,12],[20.01,8],[30.01,4],[50.01,0]]
};

var AG=['BCG','VPO0','DTC1','VPO1','ROTA1','PCV13_1','DTC2','VPO2','ROTA2','PCV13_2','DTC3','VPO3','VPI1','ROTA3','PCV13_3','VAR1','VPI2','VAA','VAR2'];
var AG_VAP=['VAP1','VAP2','VAP3','VAP4'];
var AG_ALL=AG.concat(AG_VAP);
var AG_LBL={BCG:'BCG',VPO0:'VPO0',DTC1:'DTC1/Penta1',VPO1:'VPO1',ROTA1:'ROTA1',PCV13_1:'PCV13-1',DTC2:'DTC2/Penta2',VPO2:'VPO2',ROTA2:'ROTA2',PCV13_2:'PCV13-2',DTC3:'DTC3/Penta3',VPO3:'VPO3',VPI1:'VPI1',ROTA3:'ROTA3',PCV13_3:'PCV13-3',VAR1:'VAR1',VPI2:'VPI2',VAA:'VAA',VAR2:'VAR2',VAP1:'VAP1',VAP2:'VAP2',VAP3:'VAP3',VAP4:'VAP4'};
var AG_FIELD_MAP={BCG:'BCG_0_11',VPO0:'VPO0_0_11',DTC1:'DTC1_0_11',VPO1:'VPO1_0_11',ROTA1:'ROTA1_0_11',PCV13_1:'PCV13_1_0_11',DTC2:'DTC2_0_11',VPO2:'VPO2_0_11',ROTA2:'ROTA2_0_11',PCV13_2:'PCV13_2_0_11',DTC3:'DTC3_0_11',VPO3:'VPO3_0_11',VPI1:'VPI1_0_11',ROTA3:'ROTA3_0_11',PCV13_3:'PCV13_3_0_11',VAR1:'VAR1_0_11',VPI2:'VPI2_0_11',VAA:'VAA_0_11',VAR2:'VAR2_0_11',VAP1:'VAP1_0_11',VAP2:'VAP2_0_11',VAP3:'VAP3_0_11',VAP4:'VAP4_12_23'};

var SAME_AGE=[
  {age:'Naissance',v:['BCG','VPO0']},
  {age:'6 semaines',v:['DTC1','VPO1','ROTA1','PCV13_1']},
  {age:'10 semaines',v:['DTC2','VPO2','ROTA2','PCV13_2']},
  {age:'14 semaines',v:['DTC3','VPO3','VPI1','ROTA3','PCV13_3']},
  {age:'9 mois',v:['VAR1','VPI2','VAA']}
];

var TABS=[
  {id:'oqd',lb:'Outil qualité données',fl:['province','antenne','zs','as','fosa','period'],
    pp:[{t:'1. Complétude et Promptitude',ic:'📋'},{t:'2. Cohérence-temps',ic:'📈'},{t:'3. Cohérence-donnée',ic:'🔗'},{t:'4. Valeurs atypiques',ic:'⚠️'},{t:'5. Score qualité des données',ic:'👤'}]},
  {id:'fosa',lb:'FOSA',fl:['province','antenne','zs','as','fosa','period'],pp:[{t:'Tableau de bord FOSA',ic:'🏥'}]},
  {id:'as',lb:'Aire de Santé',fl:['province','antenne','zs','as','period'],pp:[{t:'Tableau de bord AS',ic:'🔵'}]},
  {id:'zs',lb:'Zone de Santé',fl:['province','antenne','zs','period'],pp:[{t:'Tableau de bord ZS',ic:'🟢'}]},
  {id:'ant',lb:'Antenne PEV',fl:['province','antenne','period'],pp:[{t:'Tableau de bord Antenne',ic:'🏢'}]},
  {id:'nat',lb:'National',fl:['province','period'],pp:[{t:'Tableau de bord National',ic:'🇨🇩'}]},
  {id:'gen',lb:'Aperçu général',fl:['province','antenne','zs','as','fosa','period'],pp:[{t:'Aperçu général',ic:'🔴'}]}
];

/* ═══ STATE ═══ */
var BASE='./data/dashboard';
var S={tab:0,pg:0,data:[],flt:[],charts:{},filters:{},vals:{},loaded:false,meta:null,
       hmIndex:{},hmCache:{},heatmap:{},
       fosaIndex:{},fosaCache:{},fosaData:[],
       asIndex:{},asCache:{},asData:[],
       /* Hiérarchie complète extraite des données FOSA */
       hierarchy:{}
       /* hierarchy[province][antenne][zs][as] = [fosa1, fosa2, ...] */
};

/* ═══ UTILITIES ═══ */
function mL(ym){if(!ym||ym.length<6)return ym||'';var n=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];return n[parseInt(ym.substr(4,2),10)-1]+' '+ym.substr(0,4);}
function grp(a,fn){var g={};a.forEach(function(r){var k=fn(r)||'_';if(!g[k])g[k]=[];g[k].push(r);});return g;}
function sf(a,f){return a.reduce(function(s,r){return s+(Number(r[f])||0);},0);}
function af(a,f){return a.length?sf(a,f)/a.length:0;}
function uv(a,fn){var s={},r=[];a.forEach(function(x){var v=fn(x);if(v&&!s[v]){s[v]=1;r.push(v);}});return r.sort();}
function pct(n,d){return d?(n/d*100):0;}
function tr(s,n){return s&&s.length>n?s.substr(0,n-1)+'…':s;}
function E(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function isRep(r){return r.completude>0;}
function isVAP(r){return r.isVAP;}
function obAg(r){return isVAP(r)?AG.concat(AG_VAP):AG;}
function obTotal(r){return isVAP(r)?AG.length+AG_VAP.length:AG.length;}
function cntRens(r){var c=0;obAg(r).forEach(function(a){if((Number(r[a+'_f'])||0)>0)c++;});return c;}
function exh(r){return pct(cntRens(r),obTotal(r));}
function missAg(r){return obAg(r).filter(function(a){return!(Number(r[a+'_f'])||0);});}
function mAvg(fosa,ag,per,data,N){var d=data.filter(function(r){return r.org5===fosa&&r.period<per&&(Number(r[ag])||0)>0;});d.sort(function(a,b){return b.period<a.period?-1:1;});var sub=d.slice(0,N);if(!sub.length)return null;return sub.reduce(function(s,r){return s+(Number(r[ag])||0);},0)/sub.length;}
function chkCoh(r){var ok=true;SAME_AGE.forEach(function(g){for(var i=0;i<g.v.length-1;i++){var a=Number(r[g.v[i]])||0,b=Number(r[g.v[i+1]])||0;var den=b||a||1;if(Math.abs((a-b)/den)>C.CD)ok=false;}});return ok;}
function ccl(v){return v>=80?'cg':v>=50?'cy':'crd';}
function sB(val,bar){for(var i=0;i<bar.length;i++){if(val>=bar[i][0])return bar[i][1];}return 0;}
function sBA(v){if(v<=5)return 20;if(v<=10)return 16;if(v<=20)return 12;if(v<=30)return 8;if(v<=50)return 4;return 0;}
function sp(p,t,s){var a=document.getElementById('PF'),b=document.getElementById('PT'),c=document.getElementById('LS');if(a)a.style.width=p+'%';if(b&&t)b.textContent=t;if(c&&s)c.textContent=s;}

/* ═══ TRANSFORM RECORD ═══ */
function transformRecord(r){
  var rec={org2:r._Province||'',org3:r._ZS||'',org4:r._AS||'',org5:r._FOSA||'',
    antenne:r._Antenne||'',period:r._YM||'',
    completude:Number(r.comp)||0,promptitude:Number(r.prompt)||0,
    isVAP:C.VAP_PROV.indexOf(r._Province)>=0,
    _n:Number(r.n)||0,_rap:Number(r.rap)||0};
  AG_ALL.forEach(function(ag){var src=AG_FIELD_MAP[ag];var val=src?(Number(r[src])||0):0;rec[ag]=val;rec[ag+'_f']=val;});
  return rec;
}

/* ═══ BUILD HIERARCHY ═══
   Construit la hiérarchie Province → Antenne → ZS → AS → [FOSA] */
function buildHierarchy(fosaData,zsData,asData){
  var h={};
  /* D'abord depuis fosaData (le plus complet) */
  fosaData.forEach(function(r){
    var prov=r.org2,ant=r.antenne,zs=r.org3,as2=r.org4,fosa=r.org5;
    if(!prov)return;
    if(!h[prov])h[prov]={};
    if(ant&&!h[prov][ant])h[prov][ant]={};
    if(ant&&zs&&!h[prov][ant][zs])h[prov][ant][zs]={};
    if(ant&&zs&&as2&&!h[prov][ant][zs][as2])h[prov][ant][zs][as2]=[];
    if(ant&&zs&&as2&&fosa&&h[prov][ant][zs][as2].indexOf(fosa)<0)h[prov][ant][zs][as2].push(fosa);
  });
  /* Compléter avec asData */
  asData.forEach(function(r){
    var prov=r.org2,ant=r.antenne,zs=r.org3,as2=r.org4;
    if(!prov)return;
    if(!h[prov])h[prov]={};
    if(ant&&!h[prov][ant])h[prov][ant]={};
    if(ant&&zs&&!h[prov][ant][zs])h[prov][ant][zs]={};
    if(ant&&zs&&as2&&!h[prov][ant][zs][as2])h[prov][ant][zs][as2]=[];
  });
  /* Compléter avec zsData */
  zsData.forEach(function(r){
    var prov=r.org2,ant=r.antenne,zs=r.org3;
    if(!prov)return;
    if(!h[prov])h[prov]={};
    if(ant&&!h[prov][ant])h[prov][ant]={};
    if(ant&&zs&&!h[prov][ant][zs])h[prov][ant][zs]={};
  });
  /* Trier */
  Object.keys(h).forEach(function(p){
    Object.keys(h[p]).forEach(function(a){
      Object.keys(h[p][a]).forEach(function(z){
        Object.keys(h[p][a][z]).forEach(function(as2){
          h[p][a][z][as2].sort();
        });
      });
    });
  });
  return h;
}

/* ═══ CASCADED OPTIONS ═══
   Retourne les options disponibles pour chaque dimension selon les filtres actuels */
function getCascadedOptions(){
  var h=S.hierarchy;
  var selProv=S.filters.province; /* string unique */
  var selAnt=S.filters.antenne;   /* array */
  var selZS=S.filters.zs;         /* array */
  var selAS=S.filters.as;         /* array */

  var opts={province:Object.keys(h).sort(),antenne:[],zs:[],as:[],fosa:[],period:S.vals.period};

  /* Antennes de la province sélectionnée */
  if(selProv&&h[selProv]){
    opts.antenne=Object.keys(h[selProv]).sort();
  }

  /* ZS des antennes sélectionnées */
  var activeAnt=selAnt.length?selAnt:opts.antenne;
  if(selProv&&h[selProv]){
    activeAnt.forEach(function(ant){
      if(h[selProv][ant]){
        Object.keys(h[selProv][ant]).forEach(function(zs){
          if(opts.zs.indexOf(zs)<0)opts.zs.push(zs);
        });
      }
    });
    opts.zs.sort();
  }

  /* AS des ZS sélectionnées */
  var activeZS=selZS.length?selZS:opts.zs;
  if(selProv&&h[selProv]){
    activeAnt.forEach(function(ant){
      if(!h[selProv][ant])return;
      activeZS.forEach(function(zs){
        if(!h[selProv][ant][zs])return;
        Object.keys(h[selProv][ant][zs]).forEach(function(as2){
          if(opts.as.indexOf(as2)<0)opts.as.push(as2);
        });
      });
    });
    opts.as.sort();
  }

  /* FOSA des AS sélectionnées */
  var activeAS=selAS.length?selAS:opts.as;
  if(selProv&&h[selProv]){
    activeAnt.forEach(function(ant){
      if(!h[selProv][ant])return;
      activeZS.forEach(function(zs){
        if(!h[selProv][ant][zs])return;
        activeAS.forEach(function(as2){
          if(!h[selProv][ant][zs][as2])return;
          h[selProv][ant][zs][as2].forEach(function(f){
            if(opts.fosa.indexOf(f)<0)opts.fosa.push(f);
          });
        });
      });
    });
    opts.fosa.sort();
  }

  return opts;
}

/* ═══ DATA LOADING ═══ */
async function loadAll(){
  var t0=Date.now();sp(10,'Chargement...','⏳ Chargement...');
  try{
    var [mR,pR,zR,hmR,fosaR,asR]=await Promise.all([
      fetch(BASE+'/meta.json?t='+Date.now()),
      fetch(BASE+'/by_province.json'),
      fetch(BASE+'/by_zs.json'),
      fetch(BASE+'/heatmap/manifest.json').catch(function(){return{ok:true,json:function(){return Promise.resolve({});}}}),
      fetch(BASE+'/by_fosa/manifest.json').catch(function(){return{ok:true,json:function(){return Promise.resolve({});}}}),
      fetch(BASE+'/by_as/manifest.json').catch(function(){return{ok:true,json:function(){return Promise.resolve({});}}})
    ]);
    sp(40,'Parsing...');
    S.meta=await mR.json();
    await pR.json(); /* byProv - on ne l'utilise pas directement */
    var byZS=await zR.json();
    S.hmIndex=await hmR.json();
    S.fosaIndex=await fosaR.json();
    S.asIndex=await asR.json();
    S.hmCache={};S.heatmap={};S.fosaCache={};S.asCache={};

    sp(55,'Transformation ZS...');
    S.data=byZS.map(transformRecord);

    if(byZS.length>0){
      console.log('=== PREMIER ENREGISTREMENT (by_zs) ===');
      console.log(Object.keys(byZS[0]).join(', '));
    }

    sp(65,'Chargement FOSA/AS...');
    var allProvs=S.meta.provinces||[];

    /* Charger TOUTES les données FOSA et AS */
    var fosaP=allProvs.filter(function(p){return S.fosaIndex[p];}).map(function(p){
      return fetch(BASE+'/by_fosa/'+S.fosaIndex[p]).then(function(r){return r.json();}).then(function(d){S.fosaCache[p]=d;}).catch(function(){});
    });
    var asP=allProvs.filter(function(p){return S.asIndex[p];}).map(function(p){
      return fetch(BASE+'/by_as/'+S.asIndex[p]).then(function(r){return r.json();}).then(function(d){S.asCache[p]=d;}).catch(function(){});
    });
    await Promise.all(fosaP.concat(asP));

    sp(80,'Indexation...');
    S.fosaData=[];
    Object.keys(S.fosaCache).forEach(function(p){
      var arr=S.fosaCache[p];if(arr&&arr.length)arr.forEach(function(r){S.fosaData.push(transformRecord(r));});
    });
    S.asData=[];
    Object.keys(S.asCache).forEach(function(p){
      var arr=S.asCache[p];if(arr&&arr.length)arr.forEach(function(r){S.asData.push(transformRecord(r));});
    });

    console.log('FOSA:',S.fosaData.length,'AS:',S.asData.length,'ZS:',S.data.length);

    /* Construire la hiérarchie */
    S.hierarchy=buildHierarchy(S.fosaData,S.data,S.asData);

    /* Valeurs globales */
    S.vals={
      province:allProvs,
      antenne:S.meta.antennes||[],
      zs:S.meta.zs||[],
      as:S.meta.as||[],
      fosa:[],
      period:S.meta.months||[]
    };

    /* Extraire FOSA */
    var fSet={};
    S.fosaData.forEach(function(r){if(r.org5&&!fSet[r.org5]){fSet[r.org5]=1;S.vals.fosa.push(r.org5);}});
    S.vals.fosa.sort();

    /* ═══ FILTRES PAR DÉFAUT : première province ═══ */
    var defaultProv=allProvs.length?allProvs[0]:'';
    S.filters={
      province:defaultProv,    /* CHOIX UNIQUE */
      antenne:[],              /* vide = tout */
      zs:[],
      as:[],
      fosa:[],
      period:S.vals.period.slice()
    };

    S.loaded=true;
    sp(90,'Rendu...');
    apFlt();bNav();rFlt();render();

    var dt=((Date.now()-t0)/1000).toFixed(1);
    sp(100,
      (S.meta.total_records||0).toLocaleString()+' enreg. | '+S.vals.period.length+' mois | '+(S.meta.nb_fosa||S.vals.fosa.length)+' FOSA | '+S.vals.as.length+' AS',
      '⚡ Prêt en '+dt+'s — Province: '+defaultProv);
  }catch(e){
    console.error(e);sp(0,'❌ '+e.message,'❌ Erreur');
    document.getElementById('DB').innerHTML='<div style="text-align:center;padding:60px;color:#e74c3c"><h3>❌ Erreur</h3><p>'+e.message+'</p></div>';
  }
}

/* ═══ Données contextuelles ═══ */
function getContextData(){
  var tab=TABS[S.tab];
  if(tab.fl.indexOf('fosa')>=0&&S.fosaData.length)return S.fosaData;
  if(tab.fl.indexOf('as')>=0&&S.asData.length)return S.asData;
  return S.data;
}

/* ═══ APPLY FILTER ═══ */
function apFlt(){
  var f=S.filters,tab=TABS[S.tab],dims=tab.fl;
  var src=getContextData();
  var opts=getCascadedOptions();

  S.flt=src.filter(function(r){
    /* Province = choix unique obligatoire */
    if(dims.indexOf('province')>=0&&f.province&&r.org2!==f.province)return false;
    /* Antenne : si sélection, filtrer; sinon tout */
    if(dims.indexOf('antenne')>=0&&f.antenne.length&&f.antenne.indexOf(r.antenne)<0)return false;
    /* ZS */
    if(dims.indexOf('zs')>=0&&f.zs.length&&f.zs.indexOf(r.org3)<0)return false;
    /* AS */
    if(dims.indexOf('as')>=0&&f.as.length&&f.as.indexOf(r.org4)<0)return false;
    /* FOSA */
    if(dims.indexOf('fosa')>=0&&f.fosa.length&&f.fosa.indexOf(r.org5)<0)return false;
    /* Période */
    if(dims.indexOf('period')>=0&&f.period.length<S.vals.period.length&&f.period.indexOf(r.period)<0)return false;
    return true;
  });
}

/* ═══ RENDER FILTERS (cascadés) ═══ */
function rFlt(){
  var c=document.getElementById('FS');c.innerHTML='';
  var tab=TABS[S.tab];
  var opts=getCascadedOptions();

  var dims=[
    {dim:'province',l:'Province',k:'province',single:true},
    {dim:'antenne',l:'Antenne PEV',k:'antenne',single:false},
    {dim:'zs',l:'Zone de Santé',k:'zs',single:false},
    {dim:'as',l:'Aire de Santé',k:'as',single:false},
    {dim:'fosa',l:'FOSA',k:'fosa',single:false},
    {dim:'period',l:'Période',k:'period',single:false}
  ];

  dims.forEach(function(info){
    if(tab.fl.indexOf(info.dim)<0)return;
    var available=opts[info.k]||[];
    if(!available.length&&info.dim!=='province')return;

    var g=document.createElement('div');g.className='fg';
    var lb=document.createElement('label');lb.textContent=info.l;g.appendChild(lb);

    var bt=document.createElement('button');bt.className='fbtn';
    var ddId='fd-'+info.k;

    if(info.single){
      /* Province : choix unique */
      bt.innerHTML='<span>'+S.filters.province+'</span><span>▼</span>';
    }else{
      var sel=S.filters[info.k];
      var cnt=sel.length;
      var tot=available.length;
      bt.innerHTML='<span>'+(cnt===0?'Tout ('+tot+')':cnt+'/'+tot)+'</span><span class="cn">'+(cnt||tot)+'</span><span>▼</span>';
    }

    bt.onclick=function(e){
      e.stopPropagation();
      /* Fermer les autres */
      document.querySelectorAll('.fd').forEach(function(el){if(el.id!==ddId)el.classList.remove('sh');});
      document.getElementById(ddId).classList.toggle('sh');
    };
    g.appendChild(bt);

    var dd=document.createElement('div');dd.className='fd';dd.id=ddId;

    /* Recherche */
    var sr=document.createElement('input');sr.className='sr';sr.placeholder='Rechercher...';sr.type='text';
    sr.oninput=function(){var q=sr.value.toLowerCase();dd.querySelectorAll('.fi:not(.fa)').forEach(function(it){it.style.display=it.textContent.toLowerCase().indexOf(q)>=0?'':'none';});};
    dd.appendChild(sr);

    if(info.single){
      /* PROVINCE : radio buttons */
      available.forEach(function(v){
        var it=document.createElement('div');it.className='fi';
        var rb=document.createElement('input');rb.type='radio';rb.name='prov_radio';rb.checked=(v===S.filters.province);
        rb.onchange=function(){
          if(rb.checked){
            S.filters.province=v;
            /* Reset sous-filtres */
            S.filters.antenne=[];S.filters.zs=[];S.filters.as=[];S.filters.fosa=[];
            apFlt();rFlt();render();
          }
        };
        it.appendChild(rb);
        var sp2=document.createElement('span');sp2.textContent=v;
        if(v===S.filters.province)sp2.style.fontWeight='700';
        it.appendChild(sp2);dd.appendChild(it);
      });
    }else{
      /* MULTI-SELECT avec Tout sélectionner/Tout décocher */
      var sel=S.filters[info.k];

      var aD=document.createElement('div');aD.className='fi fa';
      var aC=document.createElement('input');aC.type='checkbox';aC.checked=(sel.length===0);
      aC.onchange=function(){
        S.filters[info.k]=[];
        /* Cascade reset des niveaux inférieurs */
        if(info.k==='antenne'){S.filters.zs=[];S.filters.as=[];S.filters.fosa=[];}
        if(info.k==='zs'){S.filters.as=[];S.filters.fosa=[];}
        if(info.k==='as'){S.filters.fosa=[];}
        apFlt();rFlt();render();
        /* NE PAS fermer le dropdown */
      };
      aD.appendChild(aC);
      var aS=document.createElement('span');aS.textContent='Tout sélectionner';aS.style.fontWeight='700';
      aD.appendChild(aS);dd.appendChild(aD);

      available.forEach(function(v){
        var it=document.createElement('div');it.className='fi';
        var cb=document.createElement('input');cb.type='checkbox';
        cb.checked=(sel.length===0||sel.indexOf(v)>=0);
        cb.onchange=function(){
          if(cb.checked){
            if(sel.indexOf(v)<0)sel.push(v);
          }else{
            S.filters[info.k]=sel.filter(function(x){return x!==v;});
            sel=S.filters[info.k];
          }
          /* Si tout est coché, reset à [] (= tout) */
          if(sel.length===available.length)S.filters[info.k]=[];

          /* Cascade reset */
          if(info.k==='antenne'){S.filters.zs=[];S.filters.as=[];S.filters.fosa=[];}
          if(info.k==='zs'){S.filters.as=[];S.filters.fosa=[];}
          if(info.k==='as'){S.filters.fosa=[];}

          apFlt();rFlt();render();
          /* NE PAS fermer — rFlt va re-render mais on va re-ouvrir */
          setTimeout(function(){
            var el=document.getElementById(ddId);
            if(el)el.classList.add('sh');
          },50);
        };
        it.appendChild(cb);
        var sp2=document.createElement('span');sp2.textContent=info.k==='period'?mL(v):v;
        it.appendChild(sp2);dd.appendChild(it);
      });
    }

    g.appendChild(dd);c.appendChild(g);
  });
}

        allOrg.sort(function(a,b){return b.period<a.period?-1:1;});
        var prev=allOrg.slice(0,N);if(!prev.length)return;
        var avg=prev.reduce(function(s,r){return s+(Number(r[ag])||0);},0)/prev.length;
        if(!avg)return;
        var v2=(cv-avg)/avg;
        xV.push(avg);yV.push(cv);col.push(Math.abs(v2)<=thr?'#1565c0':'#e74c3c');
        txt.push(org+'<br>Val: '+cv+'<br>Moy: '+avg.toFixed(0)+'<br>Var: '+(v2*100).toFixed(1)+'%');
      });
      if(!xV.length)return;
      var mx=Math.max.apply(null,xV.concat(yV).concat([10]))*1.15;
      Plotly.newPlot(dv,[
        {x:xV,y:yV,text:txt,type:'scatter',mode:'markers',marker:{size:9,color:col,line:{width:1,color:'#fff'}},hoverinfo:'text',name:orgL},
        {x:[0,mx],y:[0,mx],type:'scatter',mode:'lines',line:{color:'#333',width:2},name:'Moy',showlegend:true},
        {x:[0,mx],y:[0,mx*(1+thr)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'+'+Math.round(thr*100)+'%'},
        {x:[0,mx],y:[0,mx*(1-thr)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'-'+Math.round(thr*100)+'%'}
      ],{xaxis:{title:'Moyenne '+N+' mois'},yaxis:{title:'Valeur courante'},margin:{l:55,r:20,t:8,b:45},legend:{orientation:'h',y:-0.22},plot_bgcolor:'#fafbfc'},{responsive:true});
    },80+i*60);
  });
  c.appendChild(mkAlertTbl(D,AD,mos,N,thr));
}

function mkAlertTbl(D,AD,mos,N,thr){
  var box=E('div','cb');var lastM=mos[mos.length-1];
  box.innerHTML='<h4>🚨 Alertes Prioritaires (moy. mobile '+N+'m, ±'+Math.round(thr*100)+'%)</h4>';
  if(!lastM){box.innerHTML+='<p style="color:#888;padding:20px">Aucune donnée.</p>';return box;}
  var ld=D.filter(function(r){return r.period===lastM&&isRep(r);}),rows=[];
  ld.forEach(function(r){AG.forEach(function(ag){
    var val=Number(r[ag])||0;if(!val)return;
    var avg=mAvg(r.org5,ag,lastM,AD,N);if(!avg)return;
    var v2=(val-avg)/avg;
    if(Math.abs(v2)>thr)rows.push({fosa:r.org5,as:r.org4,zs:r.org3,ant:r.antenne,vac:AG_LBL[ag],val:val,avg:avg.toFixed(0),var2:(v2*100).toFixed(1),pri:Math.abs(v2)>=.5?'P1':'P2'});
  });});
  rows.sort(function(a,b){return a.pri<b.pri?-1:a.pri>b.pri?1:Math.abs(+b.var2)-Math.abs(+a.var2);});
  var p1=rows.filter(function(r){return r.pri==='P1';}).length;
  box.innerHTML+='<div class="kr" style="margin-bottom:12px"><div class="kc rd" style="min-width:90px"><div class="kv">'+p1+'</div><div class="kl">P1 (≥50%)</div></div><div class="kc or" style="min-width:90px"><div class="kv">'+(rows.length-p1)+'</div><div class="kl">P2 (>33%)</div></div><div class="kc" style="min-width:90px"><div class="kv">'+rows.length+'</div><div class="kl">Total</div></div></div>';
  if(!rows.length){box.innerHTML+='<p style="padding:20px;color:#27ae60;font-weight:600">✅ RAS pour '+mL(lastM)+'</p>';return box;}
  var h='<div class="tw"><table class="dt"><thead><tr><th>FOSA</th><th>AS</th><th>ZS</th><th>Antigène</th><th>Valeur</th><th>Moy</th><th>%Var</th><th>Pri</th></tr></thead><tbody>';
  rows.slice(0,150).forEach(function(r){
    var vn=+r.var2,pc=r.pri==='P1'?'crd':'co';
    h+='<tr><td>'+tr(r.fosa,24)+'</td><td>'+tr(r.as,18)+'</td><td>'+tr(r.zs,16)+'</td><td><b>'+r.vac+'</b></td><td style="text-align:right">'+r.val+'</td><td style="text-align:right">'+r.avg+'</td><td style="text-align:right;color:'+(vn>0?'#e74c3c':'#1565c0')+';font-weight:700">'+(vn>0?'+':'')+r.var2+'%</td><td class="'+pc+'" style="font-weight:700">'+r.pri+'</td></tr>';
  });
  box.innerHTML+=h+'</tbody></table></div>';return box;
}

/* ═══ P3: COHÉRENCE-DONNÉE ═══ */

        {x:[0,mx],y:[0,mx],type:'scatter',mode:'lines',line:{color:'#333',width:2,dash:'dot'},name:'='},
        {x:[0,mx],y:[0,mx*(1+thr)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'+10%'},
        {x:[0,mx],y:[0,mx*(1-thr)],type:'scatter',mode:'lines',line:{color:'#27ae60',width:1.5,dash:'dash'},name:'-10%'}
      ],{xaxis:{title:AG_LBL[p.b]},yaxis:{title:AG_LBL[p.a]},margin:{l:55,r:20,t:8,b:45},legend:{orientation:'h',y:-0.2},plot_bgcolor:'#fafbfc'},{responsive:true});
    },80+pi*80);
  });

  if(lastM){
    var tBox=E('div','cb');tBox.innerHTML='<h4>📊 Vaccins même âge ('+mL(lastM)+')</h4>';

    SAME_AGE.forEach(function(g){h+='<th>'+g.age+'</th><th>%Var</th>';});
    h+='<th>Accept.</th><th>Pri</th></tr></thead><tbody>';
    ld.slice(0,80).forEach(function(r){
      h+='<tr><td>'+tr(r.org5,22)+'</td><td>'+tr(r.org4,16)+'</td>';
      var bad=false,maxV=0;
      SAME_AGE.forEach(function(g){
        var vs=g.v.map(function(v){return AG_LBL[v]+':'+(Number(r[v])||0);}).join(', ');
        h+='<td style="font-size:9px">'+vs+'</td>';var parts=[];
        for(var j=0;j<g.v.length-1;j++){var a2=Number(r[g.v[j]])||0,b2=Number(r[g.v[j+1]])||0,den=b2||a2||1;
          var pv=den>0?((a2-b2)/den*100):0;var isBad=Math.abs(pv)>10;if(isBad)bad=true;maxV=Math.max(maxV,Math.abs(pv));
          parts.push('<span style="color:'+(isBad?'#e74c3c':'#27ae60')+'">'+AG_LBL[g.v[j]]+'-'+AG_LBL[g.v[j+1]]+':'+(pv>0?'+':'')+pv.toFixed(1)+'%</span>');}
        h+='<td style="font-size:8px">'+parts.join('<br>')+'</td>';});
      var acc=bad?'Non':'Oui',pri=maxV>20?'P1':(bad?'P2':'—');
      h+='<td class="'+(bad?'crd':'cg')+'">'+acc+'</td><td class="'+(pri==='P1'?'crd':(pri==='P2'?'co':''))+'">'+pri+'</td></tr>';});
    tBox.innerHTML+=h+'</tbody></table></div>';c.appendChild(tBox);
  }

  var drBox=E('div','cb');drBox.innerHTML='<h4>📉 Dropout DTC1–DTC3</h4><canvas id="drC" height="75"></canvas>';c.appendChild(drBox);
  setTimeout(function(){var x=document.getElementById('drC');if(!x)return;
    var orgK=S.filters.zs.length<=3&&S.filters.zs.length>0?'org4':'org3';
    var og=grp(D,function(r){return r[orgK];}),orgs=Object.keys(og).filter(Boolean).sort();
    var dV=[],dC=[];
    orgs.forEach(function(org){var d1=sf(og[org],'DTC1'),d3=sf(og[org],'DTC3');var dr2=d1>0?((d1-d3)/d1*100):0;dV.push(dr2);dC.push(dr2<0?'#e74c3c':'#1565c0');});
    S.charts.dr=new Chart(x,{type:'bar',data:{labels:orgs.map(function(l){return tr(l,24);}),datasets:[{label:'Dropout %',data:dV,backgroundColor:dC,borderRadius:3}]},options:{indexAxis:orgs.length>8?'y':'x',responsive:true,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'%'}},y:{ticks:{font:{size:orgs.length>20?7:9}}}}}});
  },300);
}

/* ═══ P4: VALEURS ATYPIQUES ═══ */
function rP4(c){
  var D=S.flt,AD=getContextData(),mos=uv(D,function(r){return r.period;}),N=C.MA,thr=C.CT;
  var lastM=mos[mos.length-1];
  var ld=lastM?D.filter(function(r){return r.period===lastM&&isRep(r);}):[];
  var atB={};AG.forEach(function(ag){atB[ag]={t:0,a:0};});
  ld.forEach(function(r){AG.forEach(function(ag){var val=Number(r[ag])||0;if(!val)return;atB[ag].t++;var avg=mAvg(r.org5,ag,lastM,AD,N);if(avg&&avg>0&&Math.abs((val-avg)/avg)>thr)atB[ag].a++;});});
  var agK=AG.filter(function(a){return atB[a].t>0;});

  var b1=E('div','cb');b1.innerHTML='<h4>⚠️ Atypiques par antigène — '+mL(lastM||'')+'</h4><canvas id="atB" height="55"></canvas>';c.appendChild(b1);
  setTimeout(function(){var x=document.getElementById('atB');if(!x)return;
    S.charts.atB=new Chart(x,{type:'bar',data:{labels:agK.map(function(a){return AG_LBL[a];}),datasets:[{label:'Atypiques',data:agK.map(function(a){return atB[a].a;}),backgroundColor:'#e74c3c',borderRadius:3},{label:'Normales',data:agK.map(function(a){return atB[a].t-atB[a].a;}),backgroundColor:'#27ae60',borderRadius:3}]},options:{responsive:true,plugins:{legend:{position:'top',labels:{usePointStyle:true}}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,title:{display:true,text:'FOSA'}}}}});
  },80);

  var b2=E('div','cb');b2.innerHTML='<h4>📈 Tendance mensuelle atypiques</h4><canvas id="atT" height="50"></canvas>';c.appendChild(b2);
  setTimeout(function(){var x=document.getElementById('atT');if(!x)return;
    var td=mos.map(function(m){var mD=D.filter(function(r){return r.period===m&&isRep(r);});var t=0,a=0;
      mD.forEach(function(r){AG.forEach(function(ag){var val=Number(r[ag])||0;if(!val)return;t++;var avg=mAvg(r.org5,ag,m,AD,N);if(avg&&avg>0&&Math.abs((val-avg)/avg)>thr)a++;});});
      return{t:t,a:a,p:t?(a/t*100):0};});
    S.charts.atT=new Chart(x,{type:'line',data:{labels:mos.map(mL),datasets:[{label:'Nb',data:td.map(function(d){return d.a;}),borderColor:'#e74c3c',backgroundColor:'rgba(231,76,60,.05)',fill:true,tension:.3,pointRadius:5,borderWidth:3,yAxisID:'y'},{label:'%',data:td.map(function(d){return d.p;}),borderColor:'#f39c12',borderWidth:2,tension:.3,pointRadius:4,borderDash:[5,3],fill:false,yAxisID:'y1'}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{usePointStyle:true}}},scales:{y:{beginAtZero:true,title:{display:true,text:'Nb'},position:'left'},y1:{beginAtZero:true,title:{display:true,text:'%'},position:'right',grid:{drawOnChartArea:false}}}}});
  },160);

  var b3=E('div','cb');b3.innerHTML='<h4>🔬 FOSA avec VAR2/VAA > 0</h4><canvas id="v2h" height="50"></canvas>';c.appendChild(b3);
  setTimeout(function(){var x=document.getElementById('v2h');if(!x)return;
    S.charts.v2h=new Chart(x,{type:'bar',data:{labels:mos.map(mL),datasets:[{label:'VAR2>0',data:mos.map(function(m){return D.filter(function(r){return r.period===m&&isRep(r)&&(Number(r.VAR2)||0)>0;}).length;}),backgroundColor:'rgba(156,39,176,.65)',borderRadius:3},{label:'VAA>0',data:mos.map(function(m){return D.filter(function(r){return r.period===m&&isRep(r)&&(Number(r.VAA)||0)>0;}).length;}),backgroundColor:'rgba(0,150,136,.65)',borderRadius:3}]},options:{responsive:true,plugins:{legend:{position:'top',labels:{usePointStyle:true}}},scales:{y:{beginAtZero:true,title:{display:true,text:'FOSA'}}}}});
  },240);

  if(lastM){
    var b4=E('div','cb');
    b4.innerHTML='<h4>📋 Données manquantes — '+mL(lastM)+'</h4>'+
      '<div style="margin-bottom:8px"><label style="font-weight:600;font-size:11px;margin-right:6px">Antigène:</label>'+
      '<select id="agFlt" onchange="fltMiss()" style="padding:5px 8px;border:1px solid #ddd;border-radius:5px;font-size:11px"><option value="all">Tous</option>'+AG_ALL.map(function(a){return'<option value="'+a+'">'+AG_LBL[a]+'</option>';}).join('')+'</select></div>';
    var ld2=D.filter(function(r){return r.period===lastM;});
    var h='<div class="tw"><table class="dt" id="mTbl"><thead><tr><th>FOSA</th><th>AS</th><th>ZS</th><th>Rapp</th><th>Rens.</th><th>Tot</th><th>%Compl</th><th>Manquants</th></tr></thead><tbody>';
    ld2.forEach(function(r){var rep=isRep(r),nR=cntRens(r),tot=obTotal(r),ex=pct(nR,tot),miss=missAg(r);
      h+='<tr data-miss="'+miss.join(',')+'"><td>'+tr(r.org5,22)+'</td><td>'+tr(r.org4,16)+'</td><td>'+tr(r.org3,14)+'</td><td class="'+(rep?'cg':'crd')+'">'+(rep?'O':'N')+'</td><td style="text-align:center">'+nR+'</td><td style="text-align:center">'+tot+'</td><td class="'+ccl(ex)+'">'+ex.toFixed(1)+'%</td><td style="font-size:9px"><span class="tr">'+miss.map(function(a){return AG_LBL[a];}).join(', ')+'</span></td></tr>';});

window.fltMiss=function(){var sel=document.getElementById('agFlt');if(!sel)return;var v=sel.value;document.querySelectorAll('#mTbl tbody tr').forEach(function(row){if(v==='all'){row.style.display='';return;}var m=(row.getAttribute('data-miss')||'').split(',');row.style.display=m.indexOf(v)>=0?'':'none';});};

/* ═══ P5: SCORE QUALITÉ ═══ */
function rP5(c){
  c.innerHTML='<div class="stt" id="sTabs"><div class="stb act" onclick="sSL(0)">Par FOSA</div><div class="stb" onclick="sSL(1)">Par AS</div><div class="stb" onclick="sSL(2)">Par ZS</div><div class="stb" onclick="sSL(3)">Par Antenne</div><div class="stb" onclick="sSL(4)">Par Province</div></div><div id="sC"></div>';
  setTimeout(function(){sSL(0);},40);
}
window.sSL=function(lv){
  document.querySelectorAll('#sTabs .stb').forEach(function(t,i){t.classList.toggle('act',i===lv);});
  var sc=document.getElementById('sC');sc.innerHTML='';
  var D=S.flt,AD=getContextData(),mos=uv(D,function(r){return r.period;}),N=C.MA,thr=C.CT,lastM=mos[mos.length-1];
  var lvC=[{k:function(r){return r.org5;},l:'FOSA'},{k:function(r){return r.org4;},l:'AS'},{k:function(r){return r.org3;},l:'ZS'},{k:function(r){return r.antenne;},l:'Antenne'},{k:function(r){return r.org2;},l:'Province'}][lv];
  var og=grp(D,lvC.k),units=Object.keys(og).filter(Boolean).sort();
  var rows=units.map(function(u){
    var rc=og[u],rep=rc.filter(isRep),nT=rc.length,nR=rep.length;
    var tR=pct(nR,nT);
    var aE=rep.length?rep.reduce(function(s,r){return s+exh(r);},0)/rep.length:0;
    var cohOk=rep.filter(chkCoh).length,bCoh=rep.length?(cohOk/rep.length>=.5):false;
    var tV=0,aV=0;
    if(lastM){var lr=rep.filter(function(r){return r.period===lastM;});
      lr.forEach(function(r){AG.forEach(function(ag){var val=Number(r[ag])||0;if(!val)return;tV++;var avg=mAvg(r.org5,ag,lastM,AD,N);if(avg&&avg>0&&Math.abs((val-avg)/avg)>thr)aV++;});});}
    var pA=tV?(aV/tV*100):0;
    var d1=sf(rc,'DTC1'),d3=sf(rc,'DTC3'),dr=d1?((d1-d3)/d1*100):0;
    var scR=sB(tR,C.BR),scE=sB(aE,C.BR),scC=bCoh?20:0,scA=sBA(pA),scD=dr>=0?20:0;
    var tot=scR+scE+scC+scA+scD;
    var interp=tot>=80?'Excellent':(tot>=50?'Bon':'Mauvais');
    var notes=[];
    if(tot<50){if(scR<12)notes.push('Rapp');if(scE<12)notes.push('Exh');if(!bCoh)notes.push('Coh');if(scA<12)notes.push('Atyp');if(scD===0)notes.push('Drop');}
    return{u:u,nT:nT,nR:nR,tR:tR,aE:aE,bCoh:bCoh,pA:pA,dr:dr,scR:scR,scE:scE,scC:scC,scA:scA,scD:scD,tot:tot,interp:interp,notes:notes.join('; ')};
  });
  rows.sort(function(a,b){return b.tot-a.tot;});
  var exc=rows.filter(function(r){return r.interp==='Excellent';}).length;
  var bon=rows.filter(function(r){return r.interp==='Bon';}).length;
  var mau=rows.filter(function(r){return r.interp==='Mauvais';}).length;
  var avg2=rows.length?rows.reduce(function(s,r){return s+r.tot;},0)/rows.length:0;
  sc.innerHTML='<div class="kr" style="margin-bottom:16px"><div class="kc gn"><div class="kv">'+exc+'</div><div class="kl">Excellent (≥80)</div></div><div class="kc or"><div class="kv">'+bon+'</div><div class="kl">Bon (50-79)</div></div><div class="kc rd"><div class="kv">'+mau+'</div><div class="kl">Mauvais (<50)</div></div><div class="kc bl"><div class="kv">'+avg2.toFixed(0)+'</div><div class="kl">Score moyen</div></div><div class="kc pu"><div class="kv">'+rows.length+'</div><div class="kl">'+lvC.l+'s</div></div></div>';

  sc.innerHTML+='<div class="cb"><h4>📊 Distribution — '+lvC.l+'</h4><canvas id="sDist" height="45"></canvas></div>';
  setTimeout(function(){var x=document.getElementById('sDist');if(!x)return;
    var bins=[[0,20],[20,40],[40,60],[60,80],[80,101]],bL=bins.map(function(b){return b[0]+'-'+(b[1]===101?100:b[1]);}),bC=bins.map(function(b){return rows.filter(function(r){return r.tot>=b[0]&&r.tot<b[1];}).length;});
    S.charts.sDist=new Chart(x,{type:'bar',data:{labels:bL,datasets:[{data:bC,backgroundColor:['#e74c3c','#ff7043','#f39c12','#66bb6a','#27ae60'],borderRadius:5}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{title:{display:true,text:'Score'}}}}});
  },60);

  var h='<div class="tw"><table class="dt"><thead><tr><th>'+lvC.l+'</th><th>Att</th><th>Prod</th><th>Rapp%</th><th>Sc</th><th>Exh%</th><th>Sc</th><th>Coh</th><th>Sc</th><th>Atyp%</th><th>Sc</th><th>Drop%</th><th>Sc</th><th>SCORE</th><th>Interp</th><th>Notes</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var scCol=r.tot>=80?'#27ae60':(r.tot>=50?'#f39c12':'#e74c3c');
    var intC=r.interp==='Excellent'?'cg':(r.interp==='Bon'?'cy':'crd');
    h+='<tr><td><b>'+tr(r.u,24)+'</b></td><td style="text-align:center">'+r.nT+'</td><td style="text-align:center">'+r.nR+'</td><td class="'+ccl(r.tR)+'">'+r.tR.toFixed(1)+'%</td><td style="text-align:center;font-weight:700">'+r.scR+'</td><td class="'+ccl(r.aE)+'">'+r.aE.toFixed(1)+'%</td><td style="text-align:center;font-weight:700">'+r.scE+'</td><td class="'+(r.bCoh?'cg':'crd')+'">'+(r.bCoh?'O':'N')+'</td><td style="text-align:center;font-weight:700">'+r.scC+'</td><td style="text-align:center;color:'+(r.pA>20?'#e74c3c':'#333')+'">'+r.pA.toFixed(1)+'%</td><td style="text-align:center;font-weight:700">'+r.scA+'</td><td class="'+(r.dr<0?'crd':'')+'">'+r.dr.toFixed(1)+'%</td><td style="text-align:center;font-weight:700">'+r.scD+'</td><td style="background:'+scCol+';color:#fff;text-align:center;font-weight:800;font-size:15px">'+r.tot+'</td><td class="'+intC+'" style="font-weight:700;text-align:center">'+r.interp+'</td><td style="font-size:9px;color:#e74c3c;max-width:140px;white-space:normal">'+r.notes+'</td></tr>';
  });
  sc.innerHTML+=h+'</tbody></table></div>';
};
