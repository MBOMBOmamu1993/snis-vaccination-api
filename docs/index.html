<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Dashboard PEV de routine – RDC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <!-- Bibliothèques pour les exports PDF et PowerPoint -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            color: #333;
            font-size: 13px
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px
        }

        ::-webkit-scrollbar-thumb {
            background: #999;
            border-radius: 3px
        }

        .hdr {
            background: linear-gradient(135deg, #002b55 0%, #0b3a6f 45%, #1a5fa8 100%);
            color: #fff;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 1200;
            box-shadow: 0 3px 18px rgba(0, 0, 0, .22)
        }

        .hdr .logo {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .hdr .logo img {
            height: 52px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            background: transparent
        }

        .hdr .logo svg {
            height: 42px;
            width: 42px
        }

        .hdr h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: .4px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .2)
        }

        .ibtn {
            border: 2px solid rgba(255, 255, 255, .45);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-style: italic;
            font-size: 18px;
            color: #fff;
            transition: .2s
        }

        .ibtn:hover {
            background: rgba(255, 255, 255, .15)
        }

        .nav {
            background: linear-gradient(135deg, #0b3a6f, #0d4888);
            display: flex;
            padding-left: 16px;
            border-top: 1px solid rgba(255, 255, 255, .07);
            position: sticky;
            top: 60px;
            z-index: 1100;
            overflow: visible;
            -webkit-overflow-scrolling: touch
        }

        .mi {
            position: relative;
            padding: 13px 20px;
            color: rgba(255, 255, 255, .82);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: .2s;
            user-select: none
        }

        .mi:hover,
        .mi.act {
            color: #fff;
            background: rgba(255, 255, 255, .09);
            border-bottom-color: #64b5f6
        }

        .dd {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            min-width: 290px;
            box-shadow: 0 14px 42px rgba(0, 0, 0, .22);
            border-radius: 0 0 10px 10px;
            z-index: 9999;
            overflow: hidden;
            border: 1px solid #ddd
        }

        .dd .di {
            padding: 12px 18px;
            cursor: pointer;
            color: #333;
            font-size: 12.5px;
            font-weight: 500;
            border-bottom: 1px solid #f3f3f3;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .dd .di:last-child {
            border: none
        }

        .dd .di:hover {
            background: #e3f2fd;
            color: #0b3a6f;
            padding-left: 24px
        }

        .dd .di.as {
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            font-weight: 700
        }

        .mi:hover>.dd {
            display: block
        }

        .mi .dd {
            animation: fadeIn .15s ease
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .lb {
            background: linear-gradient(135deg, #e3ecf7, #d6e3f5);
            padding: 9px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #c5d4e8;
            font-size: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1000
        }

        .lb .st {
            font-weight: 700;
            min-width: 160px;
            color: #0b3a6f
        }

        .lb .pw {
            flex: 1;
            min-width: 180px;
            height: 6px;
            background: #c5d4e8;
            border-radius: 3px;
            overflow: hidden
        }

        .lb .pf {
            height: 100%;
            background: linear-gradient(90deg, #0b3a6f, #2196f3);
            border-radius: 3px;
            transition: width .4s
        }

        .lb .pt {
            font-size: 11px;
            color: #555;
            min-width: 100px
        }

        .fs {
            background: #fff;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            border-bottom: 2px solid #e3ecf7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .02);
            position: relative;
            z-index: 1000
        }

        .fg {
            position: relative
        }

        .fg label {
            display: block;
            font-size: 9.5px;
            font-weight: 700;
            color: #888;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .fg select {
            padding: 7px 10px;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            background: #fafbfc;
            font-size: 12px;
            font-weight: 600;
            min-width: 160px;
            cursor: pointer;
            outline: none;
            transition: .2s
        }

        .fg select:focus {
            border-color: #1565c0;
            background: #f0f4ff
        }

        .fbtn {
            padding: 7px 12px;
            border: 2px solid #d1d5db;
            border-radius: 7px;
            background: #fafbfc;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            min-width: 140px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: .2s;
            gap: 6px
        }

        .fbtn:hover {
            border-color: #1565c0;
            background: #f0f4ff
        }

        .fbtn .cn {
            background: #0b3a6f;
            color: #fff;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 8px
        }

        .fd {
            display: block;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            min-width: 230px;
            max-height: 310px;
            overflow-y: auto;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .16);
            border-radius: 8px;
            z-index: 999;
            padding: 4px 0;
            border: 1px solid #ddd;
            margin-top: 2px
        }

        .fd.sh {
            display: block
        }

        .fd .sr {
            width: calc(100% - 14px);
            margin: 4px 7px 6px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 11px;
            outline: none
        }

        .fd .sr:focus {
            border-color: #1565c0
        }

        .fi {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: .12s
        }

        .fi:hover {
            background: #e3f2fd
        }

        .fi input[type=checkbox] {
            accent-color: #0b3a6f;
            width: 14px;
            height: 14px
        }

        .fa {
            border-bottom: 2px solid #e3ecf7;
            font-weight: 700;
            padding: 7px 12px;
            background: #fafbfc
        }

        .fd.pcal {
            min-width: 280px;
            padding: 10px 12px 12px;
            max-height: 380px;
            overflow: visible
        }

        .pcal-yr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px 10px;
            gap: 6px;
            border-bottom: 1px solid #eef0f4;
            margin-bottom: 10px
        }

        .pcal-nav {
            background: #fafbfc;
            border: 1.5px solid #d1d5db;
            border-radius: 6px;
            width: 32px;
            height: 30px;
            cursor: pointer;
            font-size: 12px;
            color: #0b3a6f;
            font-weight: 700;
            transition: .15s
        }

        .pcal-nav:hover:not(:disabled) {
            background: #e3f2fd;
            border-color: #1565c0
        }

        .pcal-yrlbl {
            font-size: 17px;
            font-weight: 800;
            color: #0b3a6f;
            letter-spacing: .5px
        }

        .pcal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px
        }

        .pcal-mo {
            padding: 10px 4px;
            background: #fafbfc;
            border: 1.5px solid #d1d5db;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: .12s
        }

        .pcal-mo:hover:not(.dis) {
            background: #e3f2fd;
            border-color: #1565c0
        }

        .pcal-mo.sel {
            background: #0b3a6f;
            color: #fff;
            border-color: #0b3a6f
        }

        .pcal-mo.sel:hover {
            background: #1565c0;
            border-color: #1565c0
        }

        .pcal-mo.dis {
            color: #c5c8cc;
            background: #f5f5f5;
            border-color: #eaeaea;
            cursor: not-allowed;
            opacity: .55
        }

        .pcal-ft {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 10px;
            margin-top: 10px;
            border-top: 1px solid #eef0f4
        }

        .pcal-sum {
            flex: 1;
            font-size: 10.5px;
            color: #555;
            font-weight: 600;
            line-height: 1.3
        }

        .pcal-act {
            padding: 5px 10px;
            border: 1.5px solid #0b3a6f;
            border-radius: 6px;
            background: #0b3a6f;
            color: #fff;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            transition: .15s;
            white-space: nowrap
        }

        .pcal-act:hover {
            background: #1565c0;
            border-color: #1565c0
        }

        .pcal-act-clr {
            background: #fff;
            color: #0b3a6f
        }

        .pcal-act-clr:hover {
            background: #f0f4ff;
            color: #0b3a6f
        }

        .ct {
            padding: 18px 22px
        }

        .db {
            background: #fff;
            border-radius: 13px;
            padding: 22px;
            min-height: 480px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .05);
            border: 1px solid #e5e7eb
        }

        .kr {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .kc {
            flex: 1;
            min-width: 170px;
            background: #fff;
            border-radius: 13px;
            padding: 18px;
            box-shadow: 0 3px 16px rgba(0, 0, 0, .05);
            border-left: 5px solid #0b3a6f;
            text-align: center;
            transition: transform .2s, box-shadow .2s
        }

        .kc:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(0, 0, 0, .1)
        }

        .kc.gn {
            border-left-color: #27ae60
        }

        .kc.rd {
            border-left-color: #e74c3c
        }

        .kc.or {
            border-left-color: #f39c12
        }

        .kc.bl {
            border-left-color: #2196f3
        }

        .kc.pu {
            border-left-color: #9b59b6
        }

        .kv {
            font-size: 28px;
            font-weight: 800;
            color: #0b3a6f
        }

        .kl {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            margin-top: 4px
        }

        .cb {
            background: #fff;
            border-radius: 13px;
            padding: 18px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, .04);
            margin-bottom: 18px;
            border: 1px solid #eef1f5
        }

        .cb h4 {
            font-size: 14px;
            font-weight: 700;
            color: #0b3a6f;
            margin-bottom: 12px;
            padding-bottom: 9px;
            border-bottom: 2px solid #e3ecf7;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .cr {
            display: flex;
            gap: 16px;
            flex-wrap: wrap
        }

        .ch {
            flex: 1;
            min-width: 370px
        }

        .tw {
            overflow-x: auto;
            margin-bottom: 16px;
            border-radius: 9px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
            max-height: 480px;
            overflow-y: auto
        }

        .dt {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px
        }

        .dt thead {
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .dt th {
            padding: 10px 8px;
            text-align: left;
            font-weight: 700;
            white-space: nowrap;
            font-size: 10px
        }

        .dt td {
            padding: 7px 8px;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap
        }

        .dt tbody tr:hover {
            background: #f0f7ff
        }

        .dt tbody tr:nth-child(even) {
            background: #fafbfc
        }

        .cg {
            background: #d4edda !important;
            color: #155724
        }

        .crd {
            background: #fee2e2 !important;
            color: #991b1b
        }

        .cy {
            background: #fff3cd !important;
            color: #856404
        }

        .co {
            background: #ffe0b2 !important;
            color: #e65100
        }

        .tr {
            color: #e74c3c !important;
            font-weight: 700
        }

        .st {
            font-size: 15px;
            font-weight: 800;
            color: #0b3a6f;
            margin-bottom: 16px;
            padding: 13px 18px;
            background: linear-gradient(135deg, #e3ecf7, #dce8fa);
            border-radius: 11px;
            display: flex;
            align-items: center;
            gap: 9px;
            border-left: 5px solid #0b3a6f
        }

        .stt {
            display: flex;
            margin-bottom: 18px;
            border-bottom: 3px solid #0b3a6f;
            background: #fff;
            border-radius: 11px 11px 0 0;
            overflow-x: auto
        }

        .stb {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            color: #666;
            border-bottom: 4px solid transparent;
            white-space: nowrap;
            transition: .2s
        }

        .stb:hover {
            background: #e3f2fd;
            color: #0b3a6f
        }

        .stb.act {
            color: #0b3a6f;
            border-bottom-color: #0b3a6f;
            font-weight: 800;
            background: #f0f7ff
        }

        .pg {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 14px;
            margin-top: 10px
        }

        .pg button {
            padding: 9px 22px;
            border: none;
            background: linear-gradient(135deg, #0b3a6f, #1565c0);
            color: #fff;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .12)
        }

        .pg button:disabled {
            opacity: .3;
            cursor: not-allowed;
            box-shadow: none
        }

        .pg button:not(:disabled):hover {
            background: linear-gradient(135deg, #1565c0, #1976d2)
        }

        .pg span {
            font-size: 13px;
            font-weight: 700;
            color: #0b3a6f;
            background: #e3ecf7;
            padding: 7px 14px;
            border-radius: 18px
        }

        .lgb {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin: 8px 0;
            font-size: 11px
        }

        .lgi {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .lgd {
            width: 13px;
            height: 13px;
            border-radius: 2px;
            display: inline-block
        }

        .frst {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 1px 4px;
            color: #aaa;
            transition: .2s;
            margin-left: 6px;
            vertical-align: middle
        }

        .frst:hover {
            color: #e74c3c;
            transform: rotate(-90deg)
        }

        @media(max-width:900px) {
            .nav {
                flex-wrap: wrap
            }

            .ch {
                min-width: 100%
            }

            .kr {
                flex-direction: column
            }

            .hdr {
                padding: 0 10px
            }

            .hdr h1 {
                font-size: 15px
            }

            .fs {
                padding: 8px 10px
            }
        }

        /* ═══ PERFORMANCE & FLUIDITÉ ═══ */
        html {
            scroll-behavior: smooth
        }

        body {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility
        }

        * {
            will-change: auto;
            backface-visibility: hidden
        }

        .fd {
            transform: translateZ(0);
            transition: opacity .12s ease, transform .12s ease
        }

        .fd.sh {
            opacity: 1;
            transform: translateZ(0) translateY(0)
        }

        .fd:not(.sh) {
            opacity: 0;
            pointer-events: none;
            transform: translateZ(0) translateY(-4px)
        }

        .fi {
            transition: background .08s ease
        }

        .fbtn {
            transition: border-color .1s ease, background .1s ease
        }

        .dt {
            contain: layout style
        }

        .tw {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth
        }

        .cb {
            contain: content
        }

        canvas {
            image-rendering: auto
        }
    </style>
</head>

<body>
    <div class="hdr">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/MBOMBOmamu1993/pev-assets/main/PEV_RD_Congo_TRANSPARENT.png"
                alt="Logo PEV">
        </div>
        <h1>Dashboard PEV de routine – RDC</h1>
        <div class="ibtn" title="Info"><i>i</i></div>
    </div>
    <div class="nav" id="NAV"></div>
    <div class="lb" id="LB">
        <div class="st" id="LS">⏳ Initialisation...</div>
        <div class="pw">
            <div class="pf" id="PF" style="width:0%"></div>
        </div>
        <div class="pt" id="PT"></div>
    </div>
    <div class="fs" id="FS"></div>
    <div class="ct">
        <div class="db" id="DB">
            <div style="text-align:center;padding:70px;color:#888">
                <div style="font-size:48px;margin-bottom:14px">📊</div>
                <h3>Chargement...</h3>
            </div>
        </div>
        <div class="pg" id="PG" style="display:none"><button id="BP" onclick="chPg(-1)" disabled>◀
                Précédent</button><span id="PI">Page 1/5</span><button id="BN" onclick="chPg(1)">Suivant ▶</button>
        </div>
    </div>

    <script>
        /* ═══ CONFIGURATION ═══ */
        var C = {
            MA: 11, CT: 0.33, CD: 0.10,
            VAP_PROV: ['Kongo Central', 'Kwango', 'Kwilu', 'Maindombe', 'Equateur', 'Tshuapa', 'Mongala', 'Sud-Ubangi', 'Nord-Ubangi', 'Bas-Uele', 'Haut-Uele', 'Tshopo', 'Maniema', 'Lomami', 'Haut-Lomami', 'Kasai Central'],
            BR: [[90, 20], [80, 16], [70, 12], [60, 8], [50, 4], [0, 0]],
            BA: [[0, 20], [5.01, 16], [10.01, 12], [20.01, 8], [30.01, 4], [50.01, 0]]
        };

        var AG = ['BCG', 'VPO0', 'DTC1', 'VPO1', 'ROTA1', 'PCV13_1', 'DTC2', 'VPO2', 'ROTA2', 'PCV13_2',
            'DTC3', 'VPO3', 'VPI1', 'ROTA3', 'PCV13_3', 'VAR1', 'VPI2', 'VAA', 'VAR2', 'TD'];
        var AG_VAP = ['VAP1', 'VAP2', 'VAP3', 'VAP4'];
        var AG_ALL = AG.concat(AG_VAP);

        var AG_LBL = {
            BCG: 'BCG (0-11 mois)', VPO0: 'VPO0 (0-11 mois)', DTC1: 'DTC1/Penta1 (0-11 mois)', VPO1: 'VPO1 (0-11 mois)', ROTA1: 'ROTA1 (0-11 mois)',
            PCV13_1: 'PCV13-1 (0-11 mois)', DTC2: 'DTC2/Penta2 (0-11 mois)', VPO2: 'VPO2 (0-11 mois)', ROTA2: 'ROTA2 (0-11 mois)', PCV13_2: 'PCV13-2 (0-11 mois)',
            DTC3: 'DTC3/Penta3 (0-11 mois)', VPO3: 'VPO3 (0-11 mois)', VPI1: 'VPI1 (0-11 mois)', ROTA3: 'ROTA3 (0-11 mois)', PCV13_3: 'PCV13-3 (0-11 mois)',
            VAR1: 'VAR1 (0-11 mois)', VPI2: 'VPI2 (0-11 mois)', VAA: 'VAA (0-11 mois)', VAR2: 'VAR2 (12-23 mois)', TD: 'Td 2+',
            VAP1: 'VAP1 (0-11 mois)', VAP2: 'VAP2 (0-11 mois)', VAP3: 'VAP3 (0-11 mois)', VAP4: 'VAP4 (15 mois)'

                                     * Clé = meta.generated_at → quand DHIS2 régénère les données, la clé change

                function computeCascade(changedDim) {

                        function _toSet(arr) { var s = {}; for (var i = 0; i < arr.length; i++) s[arr[i]] = 1; return s; }

                            if (!selArr.length || selArr.length >= fullLen) return srcArr; // no-op
                            var set = _toSet(selArr);
                            var out = []; for (var i = 0; i < srcArr.length; i++) { if (set[keyFn(srcArr[i])]) out.push(srcArr[i]); }
                            return out;

                        if (avAnt.length === 1 && S.filters.antenne.length !== 1) {
                            S.filters.antenne = avAnt.slice();
                        }

                        var srcAnt = _fastSub(src, function (r) { return r.antenne; }, S.filters.antenne, avAnt.length);
                        var avZS = uv(srcAnt, function (r) { return r.org3; });
                        S.cascaded.zs = avZS;
                        var _sZS = _toSet(avZS);
                        S.filters.zs = S.filters.zs.filter(function (a) { return _sZS[a]; });
                        if (chIdx < 1) S.filters.zs = avZS.slice();

                        var srcZS = _fastSub(srcAnt, function (r) { return r.org3; }, S.filters.zs, avZS.length);

                    for (var i2 = 0; i2 < sDef.length; i2++) if (_eq(months, sDef[i2][1])) return sDef[i2][0] + ' ' + year;
                    if (per.length === 1) return mL(per[0]);

                var years = Object.keys(yearsSet).sort();
                var nowD = new Date();
                var curYr = nowD.getFullYear().toString();
                var activeYear = yearsSet[curYr] ? curYr : (years.length ? years[years.length - 1] : curYr);
                if (f.period && f.period.length) {
                    var sortedP = f.period.slice().sort();
                    activeYear = sortedP[sortedP.length - 1].substring(0, 4);
                }

                /* Mois courant (1-12) — pour limiter l'affichage si année active = année en cours */
                var curMonth = (activeYear === curYr) ? (nowD.getMonth() + 1) : 12;

                /* Coupure pour la courbe Couverture vaccinale :
                   règle du 20 — si jour < 20 on s'arrête au mois N-2 (mois précédent
                   le mois précédent), sinon au mois N-1 (mois précédent). */
                var nowDay = nowD.getDate(), nowMo = nowD.getMonth() + 1, nowYr = nowD.getFullYear();
                var _lag = (nowDay >= 20 ? 1 : 2);
                var _cutMo = nowMo - _lag, _cutYr = nowYr;
                while (_cutMo <= 0) { _cutMo += 12; _cutYr -= 1; }
                var _ay = parseInt(activeYear, 10);
                var cvCutoffIdx; // index 0..11 inclusif jusqu'auquel on affiche la couverture
                if (_ay < _cutYr) cvCutoffIdx = 11;
                else if (_ay > _cutYr) cvCutoffIdx = -1;
                else cvCutoffIdx = _cutMo - 1;

                /* Données limitées à l'année active.
                   _YM stocké au format 'YYYYMM' (ex: '202604'). */
                var yearData = orgData.filter(function (r) { return r._YM && r._YM.substring(0, 4) === activeYear; });
                var annualTgts = _cvTargets(yearData, 12, gi.dedupKey);

                /* Liste des antigènes à afficher */
                var ALL_AGS = [
                    { ag: 'BCG', lbl: 'BCG', useNV: true },
                    { ag: 'VPO0', lbl: 'VPO 0', useNV: true },
                    { ag: 'DTC1', lbl: 'PENTA 1', useNV: false },
                    { ag: 'VPO1', lbl: 'VPO 1', useNV: false },
                    { ag: 'PCV13_1', lbl: 'PCV-13 1', useNV: false },
                    { ag: 'ROTA1', lbl: 'ROTA 1', useNV: false },
                    { ag: 'DTC2', lbl: 'PENTA 2', useNV: false },
                    { ag: 'VPO2', lbl: 'VPO 2', useNV: false },
                    { ag: 'PCV13_2', lbl: 'PCV-13 2', useNV: false },
                    { ag: 'ROTA2', lbl: 'ROTA 2', useNV: false },
                    { ag: 'DTC3', lbl: 'PENTA 3', useNV: false },
                    { ag: 'VPO3', lbl: 'VPO 3', useNV: false },
                    { ag: 'PCV13_3', lbl: 'PCV-13 3', useNV: false },
                    { ag: 'ROTA3', lbl: 'ROTA 3', useNV: false },
                    { ag: 'VPI1', lbl: 'VPI 1', useNV: false },
                    { ag: 'VAR1', lbl: 'VAR 1', useNV: false },
                    { ag: 'VPI2', lbl: 'VPI 2', useNV: false },
                    { ag: 'VAA', lbl: 'VAA', useNV: false },
                    { ag: 'VAR2', lbl: 'VAR 2 (12-23m)', useNV: false },
                    { ag: 'TD', lbl: 'Td 2+ (FAP)', useNV: true }
                ];
                if (isVAPprov) ALL_AGS = ALL_AGS.concat([
                    { ag: 'VAP1', lbl: 'VAP 1', useNV: false },
                    { ag: 'VAP2', lbl: 'VAP 2', useNV: false },
                    { ag: 'VAP3', lbl: 'VAP 3', useNV: false },
                    { ag: 'VAP4', lbl: 'VAP 4 (12-23m)', useNV: false }
                ]);
                /* Filtre antigènes utilisateur */
                ALL_AGS = ALL_AGS.filter(function (a) { return _agSel(a.ag); });

                var months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
                var monthLabels = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

                /* ── Header ── */
                var scopeNameMap = { as: f.as && f.as.length === 1 ? f.as[0] : (f.as && f.as.length ? f.as.length + ' AS sélectionnées' : ''),
                                     zs: f.zs && f.zs.length === 1 ? f.zs[0] : (f.zs && f.zs.length ? f.zs.length + ' ZS sélectionnées' : ''),
                                     antenne: f.antenne && f.antenne.length === 1 ? f.antenne[0] : (f.antenne && f.antenne.length ? f.antenne.length + ' antennes sélectionnées' : ''),
                                     province: f.province || '',
                                     national: 'National' };
                var scopeName = scopeNameMap[gi.scopeLevel] || (f.province || 'National');
                var scopeLbl = gi.scopeLevel === 'national'
                    ? '<strong>National</strong>'
                    : (gi.scopeLabel || 'Niveau') + ' : <strong>' + scopeName + '</strong>';
                var hdr = E('div', 'cb');
                hdr.innerHTML = '<h3 style="color:#0b3a6f;margin:0 0 4px">📈 Courbes de suivi des couvertures vaccinales</h3>' +
                    '<p style="font-size:12px;color:#555;margin:0">' + scopeLbl + ' — Année : <strong style="color:#dc2626">' + activeYear + '</strong></p>';
                c.appendChild(hdr);

                /* Pré-index yearData par _YM (format 'YYYYMM') pour éviter un re-filter par mois × antigène */
                var byYM = {};
                yearData.forEach(function (r) { var k = r._YM; if (!k) return; (byYM[k] || (byYM[k] = [])).push(r); });

                /* ── Bloc par antigène (chart + table style Excel) ── */
                ALL_AGS.forEach(function (agObj) {
                    var field = AG_FIELD_MAP[agObj.ag]; if (!field) return;
                    var annualTarget = agObj.useNV ? annualTgts.nv : annualTgts.ns;
                    if (!annualTarget) return;

                    /* Doses mensuelles — _YM stocké au format 'YYYYMM' (sans tiret) */
                    var monthlyDoses = months.map(function (mo, i) {
                        if (i + 1 > curMonth) return 0;
                        var ym = activeYear + mo;
                        return _cvSum(byYM[ym] || [], field);
                    });
                    /* Affiche valeur pour tous les mois de janvier au mois en cours (inclus) */
                    var hasData = months.map(function (_, i) { return (i + 1) <= curMonth; });
                    /* Cumulé : Jan = effectuées Jan ; Mois N = cumul N-1 + effectuées N */
                    var cumulative = []; var sum = 0;
                    for (var i = 0; i < 12; i++) {
                        if (hasData[i]) { sum += (monthlyDoses[i] || 0); cumulative.push(sum); }
                        else { cumulative.push(null); }
                    }
                    /* Couvertures */
                    var ideal = months.map(function (_, i) { return +((i + 1) / 12 * 100).toFixed(1); });
                    var poursuivie = months.map(function (_, i) { return +((i + 1) / 12 * 95).toFixed(1); });
                    var actual = cumulative.map(function (cv, i) {
                        if (cv === null) return null;
                        if (i > cvCutoffIdx) return null; // règle du 20 — pas de CV au-delà du cutoff
                        return annualTarget > 0 ? +(cv / annualTarget * 100).toFixed(1) : null;
                    });

                    var canvasId = 'crb_' + agObj.ag;
                    var blockBox = E('div', 'cb');
                    blockBox.style.cssText = 'background:#fff;border:1px solid #d1d5db;padding:14px;margin-bottom:18px';
                    blockBox.innerHTML =
                        '<div style="display:flex;justify-content:space-around;align-items:center;background:#fff;border:1px solid #ccc;padding:6px 12px;margin-bottom:10px;font-size:12px;flex-wrap:wrap;gap:14px">' +
                          '<div>Année : <span style="background:#fff;border:1px solid #999;padding:2px 14px;color:#dc2626;font-weight:700">' + activeYear + '</span></div>' +
                          '<div>ANTIGENE : <span style="background:#fff;border:1px solid #999;padding:2px 14px;font-weight:700">' + agObj.lbl + '</span></div>' +
                          '<div>Population cible annuelle : <span style="background:#fff;border:1px solid #999;padding:2px 14px;color:#dc2626;font-weight:700">' + Math.round(annualTarget).toLocaleString() + '</span></div>' +
                        '</div>' +
                        '<div style="height:380px;position:relative"><canvas id="' + canvasId + '"></canvas></div>' +
                        '<div id="' + canvasId + '_tbl" style="margin-top:10px"></div>';
                    c.appendChild(blockBox);

                    /* Render chart + table après le paint DOM */
                    (function (canvasId, agObj, monthlyDoses, cumulative, ideal, poursuivie, actual, hasData) {
                        setTimeout(function () {
                            var cx = document.getElementById(canvasId); if (!cx) return;
                            if (S.charts[canvasId]) { try { S.charts[canvasId].destroy(); } catch (e) { } }
                            S.charts[canvasId] = new Chart(cx, {
                                type: 'line',
                                data: {
                                    labels: monthLabels,
                                    datasets: [
                                        { label: 'Couverture idéale', data: ideal, borderColor: '#1f4ea0', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 5, pointBackgroundColor: '#1f4ea0', pointStyle: 'rect', tension: 0 },
                                        { label: 'Couverture poursuivie (95%)', data: poursuivie, borderColor: '#e91e63', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 5, pointBackgroundColor: '#e91e63', pointStyle: 'rectRot', tension: 0 },
                                        { label: 'Couverture vaccinale', data: actual, borderColor: '#2e7d32', backgroundColor: 'transparent', borderWidth: 3, pointRadius: 6, pointBackgroundColor: '#2e7d32', pointStyle: 'triangle', tension: 0, spanGaps: false }
                                    ]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: {
                                        legend: { position: 'top', labels: { usePointStyle: true, font: { size: 12 } } },
                                        title: { display: false }
                                    },
                                    scales: {
                                        y: {
                                            beginAtZero: true, max: 110,
                                            ticks: { callback: function (v) { return v + '%'; }, font: { size: 11 }, stepSize: 10 },
                                            title: { display: true, text: 'Couverture vaccinale annualisée', font: { size: 11, weight: 'bold' } }
                                        },
                                        x: { ticks: { font: { size: 11 } } }
                                    }
                                }
                            });

                            /* Tableau données style Excel */
                            var tw = document.getElementById(canvasId + '_tbl'); if (!tw) return;
                            var fmt = function (v) { return v !== null && v !== undefined ? Math.round(v).toLocaleString() : ''; };
                            var pct = function (v) { return v !== null && v !== undefined ? Math.round(v) + '%' : ''; };
                            var html = '<table style="width:100%;font-size:10px;border-collapse:collapse;border:1px solid #999">' +
                                '<thead><tr style="background:#000;color:#fff"><th style="padding:5px 6px;text-align:left;min-width:160px;border:1px solid #555"></th>' +
                                monthLabels.map(function (m) { return '<th style="padding:5px 4px;text-align:center;border:1px solid #555;font-size:9px">' + m + '</th>'; }).join('') +
                                '</tr></thead><tbody>';
                            html += '<tr style="background:#d4edbc"><td style="padding:4px 6px;font-weight:600;border:1px solid #999">Vaccinations effectuées</td>' +
                                monthlyDoses.map(function (d, i) { return '<td style="padding:4px;text-align:center;border:1px solid #999">' + (hasData[i] ? fmt(d) : '') + '</td>'; }).join('') + '</tr>';
                            html += '<tr style="background:#d4edbc"><td style="padding:4px 6px;font-weight:600;border:1px solid #999">Vaccinations cumulées</td>' +
                                cumulative.map(function (d) { return '<td style="padding:4px;text-align:center;border:1px solid #999">' + fmt(d) + '</td>'; }).join('') + '</tr>';
                            html += '<tr style="background:#d4edbc"><td style="padding:4px 6px;font-weight:600;border:1px solid #999">Couverture idéale</td>' +
                                ideal.map(function (v) { return '<td style="padding:4px;text-align:center;border:1px solid #999">' + pct(v) + '</td>'; }).join('') + '</tr>';
                            html += '<tr style="background:#d4edbc"><td style="padding:4px 6px;font-weight:600;border:1px solid #999">Couverture poursuivie</td>' +
                                poursuivie.map(function (v) { return '<td style="padding:4px;text-align:center;border:1px solid #999">' + pct(v) + '</td>'; }).join('') + '</tr>';
                            html += '<tr style="background:#d4edbc"><td style="padding:4px 6px;font-weight:600;border:1px solid #999">Couverture vaccinale</td>' +
                                actual.map(function (v) { return '<td style="padding:4px;text-align:center;border:1px solid #999;font-weight:700">' + pct(v) + '</td>'; }).join('') + '</tr>';
                            html += '</tbody></table>';
                            tw.innerHTML = html;
                        }, 80);
                    })(canvasId, agObj, monthlyDoses, cumulative, ideal, poursuivie, actual, hasData);
                });
            });
        }

        /* ═══ START ═══ */
        loadAll();
    </script>
</body>

</html>
